<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Yuma · Pagos a Proveedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2C6E73; --gold:#E1D082; --wool:#EAE3CD; --cactus:#72785E; --purple:#88285C;
  --ink:#20302f; --paper:#F5F1E6; --line:#d8cfb8;
  --ok:#3f7d4e; --warn:#b5892a; --bad:#a8324a;
  --mono:'Spline Sans Mono',ui-monospace,monospace; --disp:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--mono);background:var(--paper);color:var(--ink);line-height:1.5;font-size:15px}
h1,h2,h3{font-family:var(--disp);font-weight:600;line-height:1.1}
a{color:var(--blue)} button{font-family:var(--mono);cursor:pointer}
#gate{position:fixed;inset:0;background:var(--purple);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.gate-card{background:var(--paper);border-radius:2px;max-width:400px;width:100%;padding:40px 32px;box-shadow:0 30px 80px rgba(0,0,0,.3);text-align:center}
.gate-eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--cactus);margin-bottom:12px}
.gate-card h1{font-size:32px;color:var(--purple);margin-bottom:4px;font-weight:900}
.gate-sub{font-size:12.5px;color:var(--cactus);margin-bottom:26px}
.fld{text-align:left;margin-bottom:16px}
.fld label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cactus);margin-bottom:6px}
.fld select,.fld input,.fld textarea{width:100%;font-family:var(--mono);font-size:16px;padding:11px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px;outline:none}
.fld select:focus,.fld input:focus,.fld textarea:focus{border-color:var(--purple)}
.fld input.pin{letter-spacing:.4em;text-align:center;font-size:22px}
.gate-btn{margin-top:8px;width:100%;background:var(--purple);color:#fff;border:none;padding:14px;font-size:13px;letter-spacing:.15em;text-transform:uppercase;border-radius:2px;transition:background .2s}
.gate-btn:hover{background:#6e2049}
.gate-btn.ghost{background:transparent;color:var(--purple);border:1px solid var(--line);margin-top:10px}
.gate-err{color:var(--bad);font-size:12.5px;margin-top:14px;min-height:18px}
.gate-info{color:var(--cactus);font-size:12px;margin-top:12px;min-height:16px}
.hidden{display:none!important}
#app{display:none;min-height:100vh}
header.top{background:var(--purple);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.top h1{font-size:20px;font-weight:900}
.top .who{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:14px}
.top .who a, .top .who button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:5px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-radius:2px;text-decoration:none}
nav.tabs{background:var(--purple);border-top:1px solid rgba(255,255,255,.15);padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:transparent;border:none;color:rgba(255,255,255,.7);padding:12px 18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.active{color:#fff;border-bottom-color:var(--gold)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.view{display:none}.view.active{display:block}
.section-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--cactus);margin:26px 0 10px}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.ctl label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cactus)}
select,.ctl input{font-family:var(--mono);font-size:14px;padding:9px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px;outline:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:#fff;border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:2px;padding:15px 16px}
.kpi .k-lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cactus);margin-bottom:6px}
.kpi .k-val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:11px;color:var(--cactus);margin-top:2px}
.cap-form{background:#fff;border:1px solid var(--line);border-radius:3px;padding:24px;max-width:640px}
.cap-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.cap-grid .fld{margin-bottom:0}
.cap-full{grid-column:1/-1}
.cap-btn{background:var(--purple);color:#fff;border:none;padding:13px 24px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:2px}
.cap-btn:hover{background:#6e2049}
.cap-btn.sec{background:var(--blue)}
.cap-btn.sec:hover{background:#255a5e}
.aud{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.aud th{background:var(--cactus);color:var(--paper);text-align:left;padding:9px 11px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.aud td{padding:8px 11px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.aud tr:hover td{background:#efe9d8}
.aud td.num{text-align:right}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.p-pend{background:#f2e6cf;color:var(--warn)}
.p-aprob{background:#dce7ea;color:var(--blue)}
.p-pagado{background:#e0efe0;color:var(--ok)}
.p-rech{background:#f2d6dc;color:var(--bad)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.mini-btn{border:none;padding:6px 11px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;color:#fff}
.mini-btn.ok{background:var(--ok)}
.mini-btn.bad{background:var(--bad)}
.mini-btn.info{background:var(--blue)}
.just-input{width:160px;font-family:var(--mono);font-size:12px;padding:6px;border:1px solid var(--line);border-radius:2px;resize:vertical;min-height:34px}
.loading,.empty{text-align:center;padding:50px 20px;color:var(--cactus);font-size:13px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{background:#f2d6dc;border:1px solid var(--bad);color:var(--bad);padding:14px 16px;border-radius:2px;font-size:13px;margin:20px 0}
.okmsg{background:#e0efe0;border:1px solid var(--ok);color:var(--ok);padding:10px 14px;border-radius:2px;font-size:13px;margin:12px 0}
.note{font-size:11.5px;color:var(--cactus);margin-top:18px;font-style:italic}
@media(max-width:560px){main{padding:20px 12px 70px}.cap-grid{grid-template-columns:1fr}}
.p-cancel{background:#e6e3da;color:#777}
.banner{padding:11px 14px;border-radius:2px;font-size:12.5px;margin-bottom:16px;border:1px solid}
.banner.ok{background:#e0efe0;border-color:var(--ok);color:var(--ok)}
.banner.warn{background:#f6edd6;border-color:var(--warn);color:#7a5c17}
.prov-card{background:var(--paper);border:1px dashed var(--line);padding:10px 12px;font-size:12.5px;margin-top:8px;border-radius:2px}
.linkbtn{background:none;border:none;color:var(--purple);text-decoration:underline;font-size:12.5px;padding:0}
.seg{display:flex;gap:6px}
.seg label{flex:1;border:1px solid var(--line);background:#fff;padding:10px;text-align:center;font-size:12px;cursor:pointer;border-radius:2px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0}
.seg input{display:none}
.seg input:checked+span{font-weight:600;color:var(--purple)}
.seg label:has(input:checked){border-color:var(--purple);background:#f7eef3}
.docs a,.docs span{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:10px;margin:1px 2px 1px 0;text-decoration:none}
.docs a{background:#dce7ea;color:var(--blue)}
.docs span.no{background:#f2e6cf;color:var(--warn)}
.venc{color:var(--bad);font-weight:600}
.sub{font-size:11px;color:var(--cactus)}
.selbar{position:sticky;bottom:0;background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;border-radius:2px;z-index:5}
.selbar b{font-size:16px}
.selbar .cap-btn{margin-left:auto;background:var(--ok)}
.cards{display:grid;gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);padding:14px 16px;border-radius:2px;display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.pcard.urg{border-left-color:var(--bad)}
.pcard h3{font-size:17px}
.pcard .monto{font-size:20px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.pcard .bank{grid-column:1/-1;background:var(--paper);padding:8px 10px;font-size:13px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.copy{border:1px solid var(--line);background:#fff;font-size:10px;padding:3px 8px;border-radius:2px;text-transform:uppercase;letter-spacing:.06em}
.mini-btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
#modal{position:fixed;inset:0;background:rgba(32,48,47,.55);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:40px 16px;overflow:auto}
#modal.open{display:flex}
#modal .box{background:#fff;max-width:520px;width:100%;padding:24px;border-radius:3px}
#modal h2{font-size:22px;color:var(--purple);margin-bottom:14px}
#modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.tabla-mini{font-size:12.5px;border-collapse:collapse;width:100%;max-width:520px}
.tabla-mini td{padding:5px 8px;border-bottom:1px solid var(--line)}
.tabla-mini td.num{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:700px){.hide-sm{display:none}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-eyebrow">Puerto Escondido · Oaxaca</div>
    <h1>Casa Yuma</h1>
    <div class="gate-sub">Pagos a Proveedores</div>
    <div id="step1">
      <div class="fld"><label>Colaborador</label><select id="userSel"></select></div>
      <div class="fld"><label>Número de colaborador</label><input id="userId" type="text" placeholder="CY000" autocomplete="off"></div>
      <button class="gate-btn" onclick="identificar()">Continuar</button>
    </div>
    <div id="step2" class="hidden">
      <div class="fld"><label id="pinLabel">Tu PIN</label><input id="pinInput" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off"></div>
      <div id="pinInput2wrap" class="fld hidden"><label>Confirma tu PIN</label><input id="pinInput2" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off"></div>
      <button class="gate-btn" id="pinBtn" onclick="pinSubmit()">Entrar</button>
      <button class="gate-btn ghost" onclick="volverStep1()">← Cambiar colaborador</button>
    </div>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-info" id="gateInfo"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>Casa Yuma · Pagos a Proveedores</h1>
    <div class="who"><span id="whoLabel"></span><a href="index.html">Portal</a><button onclick="logout()">Salir</button></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-view="concentrado" data-rol="ve">Concentrado</button>
    <button data-view="porpagar" data-rol="paga">Por pagar</button>
    <button data-view="nueva">Nueva solicitud</button>
    <button data-view="mias">Mis solicitudes</button>
    <button data-view="historial" data-rol="ve">Historial</button>
    <button data-view="proveedores">Proveedores</button>
  </nav>
  <main>
    <section class="view" id="v-concentrado"><div id="concentradoBody"></div></section>
    <section class="view" id="v-porpagar"><div id="porpagarBody"></div></section>
    <section class="view" id="v-nueva"><div id="nuevaBody"></div></section>
    <section class="view" id="v-mias"><div id="miasBody"></div></section>
    <section class="view" id="v-historial">
      <div class="ctl">
        <label>Desde</label><input id="hDesde" type="date">
        <label>Hasta</label><input id="hHasta" type="date">
        <select id="hEstatus"><option value="">Todo estatus</option><option>Pendiente</option><option>Autorizado</option><option>Pagado</option><option>Rechazado</option><option>Cancelado</option></select>
        <select id="hDepto"><option value="">Todos los deptos.</option></select>
        <input id="hTexto" placeholder="Proveedor o concepto" style="width:170px">
        <button class="cap-btn" style="padding:9px 16px" onclick="renderHistorial()">Ver</button>
        <button class="cap-btn sec" style="padding:9px 16px" onclick="pdfHistorial()">PDF</button>
        <button class="cap-btn sec" style="padding:9px 16px" onclick="csvHistorial()">Excel</button>
      </div>
      <div id="historialKpis"></div>
      <div id="historialBody"></div>
    </section>
    <section class="view" id="v-proveedores"><div id="proveedoresBody"></div></section>
  </main>
</div>

<div id="modal" onclick="if(event.target===this)cerrarModal()"><div class="box" id="modalBox"></div></div>

<script>
// ————— El directorio de colaboradores YA NO se copia aquí a mano —————
// El selector de nombres del login (#userSel) se llena en vivo desde la pestaña "Usuarios"
// del Sheet (acción pública 'listar_colaboradores' en Codigo.gs).
//
// ROLES EN PAGOS (nov-2026):
//  · Líder           → solicita (sáb 00:00 – mié 12:00) y ve solo lo suyo.
//  · Dirección       → nivel 'superfull'. ÚNICO que autoriza/rechaza (pestaña Concentrado).
//  · Administración  → RolEspecial 'administracion' (col G de Usuarios). Ve todo y registra pagos.
//  · Full            → ve todo; puede registrar pagos como respaldo de Administración. No autoriza.
const CONFIG={
  WEBAPP_URL:'https://script.google.com/macros/s/AKfycbwaQK50qEOFGvYxoy3wpS17uPzru1BQAs0TYwnEeD50M1fe3UfNWqcy1AwN1wDOlqM/exec',
};
const CATEGORIAS=['Alimentos y Bebidas','Mantenimiento','Amenities e Insumos','Servicios (luz/agua/internet)','Honorarios y Nómina externa','Marketing','Eventos','Construcción / Obra','Otros'];
const FORMAS_PAGO=['Transferencia','Efectivo','Cheque','Tarjeta'];
const ESTATUS_PILL={Pendiente:'p-pend',Autorizado:'p-aprob',Pagado:'p-pagado',Rechazado:'p-rech',Cancelado:'p-cancel'};
// Índices de columna de la hoja Pagos (ver Codigo.gs)
const C={id:0,fSol:1,solId:2,solNom:3,prov:4,cat:5,concepto:6,monto:7,forma:9,fReq:10,factura:11,liga:12,urg:13,est:14,autPor:15,fAut:16,motivo:17,fPago:18,ref:19,notas:20,depto:21,provId:22,rfc:23,clabe:24,banco:25,cot:26,comp:27,pagPor:28};

const money=n=>(isNaN(n)||n===''||n==null)?'–':Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{const x=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(x)?0:x;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
// Fecha/hora en Puerto Escondido (no UTC — antes después de las 6 pm salía la fecha de mañana)
function hoyMX(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City'}).format(new Date());}
function addDias(f,n){const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function ventanaAbiertaMX(){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Mexico_City',weekday:'short',hour:'numeric',hourCycle:'h23'}).formatToParts(new Date());
  const dia=p.find(x=>x.type==='weekday').value, hora=Number(p.find(x=>x.type==='hour').value);
  if(['Sat','Sun','Mon','Tue'].indexOf(dia)!==-1)return true;
  return dia==='Wed' && hora<12;
}

let SESSION=null,PENDING=null,PAGOS=[],PROVEEDORES_CACHE=[],EDITANDO=null,SEL={};
const NIVELES_VALIDOS=['superfull','full','lider'];
function esDireccion(){ return SESSION && SESSION.nivel==='superfull'; }
function esAdmin(){ return SESSION && norm(SESSION.rolEspecial)==='administracion'; }
function puedePagar(){ return esAdmin() || (SESSION && SESSION.nivel==='full'); }
function veTodo(){ return SESSION && (SESSION.nivel==='superfull'||SESSION.nivel==='full'||esAdmin()); }
function editaProveedores(){ return veTodo(); }
function rolLabel(){
  if(esDireccion())return 'Dirección';
  if(esAdmin())return 'Administración';
  if(SESSION.nivel==='full')return 'Full';
  return 'Líder'+(SESSION.rolEspecial==='compras'?' Compras':'');
}

(function(){
  const sel=document.getElementById('userSel');
  sel.innerHTML='<option value="">Cargando…</option>';
  apiGet({accion:'listar_colaboradores'}).then(j=>{
    if(!j || !j.ok || !j.usuarios || !j.usuarios.length){ sel.innerHTML='<option value="">— escribe tu número abajo —</option>'; return; }
    sel.innerHTML='';
    j.usuarios.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.nombre;sel.appendChild(o);});
    sel.onchange=()=>{document.getElementById('userId').value=sel.value;};
    document.getElementById('userId').value=sel.value;
  }).catch(()=>{ sel.innerHTML='<option value="">— escribe tu número abajo —</option>'; });
})();

async function apiGet(params){params=Object.assign({},params,{_ts:Date.now()});const qs=Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');const res=await fetch(CONFIG.WEBAPP_URL+'?'+qs,{cache:'no-store'});return res.json();}
async function apiPost(body){const res=await fetch(CONFIG.WEBAPP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return res.json();}
function api(accion,extra){return apiPost(Object.assign({accion,id:SESSION.id,pin:SESSION.pin},extra||{}));}

(async function tryAutoLogin(){
  try{
    const raw=sessionStorage.getItem('CY_FIN_SESSION');
    if(!raw)return;
    const s=JSON.parse(raw);
    const j=await apiGet({accion:'entrar',id:s.id,pin:s.pin});
    if(j.ok){
      const nivel=j.nivel||s.nivel;
      if(NIVELES_VALIDOS.indexOf(nivel)===-1){return;}
      SESSION={id:s.id,pin:s.pin,nombre:j.nombre||s.nombre,nivel:nivel,rolEspecial:j.rolEspecial||'',departamento:j.departamento||''};
      entrarApp();
    }
  }catch(e){}
})();

async function identificar(){
  const id=document.getElementById('userId').value.trim().toUpperCase();
  const err=document.getElementById('gateErr'),info=document.getElementById('gateInfo');
  err.textContent='';info.textContent='Verificando…';
  try{
    const j=await apiGet({accion:'login',id:id});
    if(!j.ok){info.textContent='';err.textContent=j.error;return;}
    PENDING={id:j.id,nombre:j.nombre,nivel:j.nivel,rolEspecial:j.rolEspecial,departamento:j.departamento,tienePin:j.tienePin};info.textContent='';
    document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');
    if(j.tienePin){document.getElementById('pinLabel').textContent='Tu PIN · '+j.nombre.split(' ')[0];document.getElementById('pinInput2wrap').classList.add('hidden');document.getElementById('pinBtn').textContent='Entrar';}
    else{document.getElementById('pinLabel').textContent='Crea tu PIN · '+j.nombre.split(' ')[0];document.getElementById('pinInput2wrap').classList.remove('hidden');document.getElementById('pinBtn').textContent='Crear PIN y entrar';info.textContent='Primera vez: define un PIN de 4 a 6 dígitos.';}
    document.getElementById('pinInput').focus();
  }catch(e){info.textContent='';err.textContent='No se pudo conectar. Revisa CONFIG.WEBAPP_URL.';}
}
function volverStep1(){document.getElementById('step2').classList.add('hidden');document.getElementById('step1').classList.remove('hidden');document.getElementById('gateErr').textContent='';document.getElementById('gateInfo').textContent='';document.getElementById('pinInput').value='';document.getElementById('pinInput2').value='';}
async function pinSubmit(){
  const pin=document.getElementById('pinInput').value.trim();const err=document.getElementById('gateErr');err.textContent='';
  if(!/^\d{4,6}$/.test(pin)){err.textContent='El PIN debe ser de 4 a 6 dígitos.';return;}
  try{
    let j;
    if(PENDING.tienePin){j=await apiGet({accion:'entrar',id:PENDING.id,pin:pin});}
    else{const pin2=document.getElementById('pinInput2').value.trim();if(pin!==pin2){err.textContent='Los PIN no coinciden.';return;}j=await apiPost({accion:'crearPin',id:PENDING.id,pin:pin});}
    if(!j.ok){err.textContent=j.error;return;}
    const nivel=j.nivel||PENDING.nivel;
    if(NIVELES_VALIDOS.indexOf(nivel)===-1){err.textContent='Tu usuario no tiene acceso a Pagos.';return;}
    SESSION={id:PENDING.id,pin:pin,nombre:j.nombre||PENDING.nombre,nivel:nivel,rolEspecial:j.rolEspecial||PENDING.rolEspecial||'',departamento:j.departamento||PENDING.departamento||''};entrarApp();
  }catch(e){err.textContent='No se pudo conectar.';}
}
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')pinSubmit();});
document.getElementById('pinInput2').addEventListener('keydown',e=>{if(e.key==='Enter')pinSubmit();});
document.getElementById('userId').addEventListener('keydown',e=>{if(e.key==='Enter')identificar();});

function entrarApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoLabel').textContent=SESSION.nombre+' · '+rolLabel();
  try{sessionStorage.setItem('CY_FIN_SESSION',JSON.stringify(SESSION));}catch(e){}
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const r=b.dataset.rol;
    if((r==='ve' && !veTodo()) || (r==='paga' && !puedePagar() && !esDireccion())) b.classList.add('hidden');
    b.onclick=()=>switchView(b.dataset.view);
  });
  document.getElementById('hDesde').value=addDias(hoyMX(),-30);
  document.getElementById('hHasta').value=hoyMX();
  // Pestaña inicial según rol: Dirección → Concentrado, Administración → Por pagar, Líder → Nueva
  switchView(esDireccion()?'concentrado':(puedePagar()?'porpagar':'nueva'));
  renderNueva();
  cargarTodo();
  applyPrefillFromURL();
}
function logout(){try{sessionStorage.removeItem('CY_FIN_SESSION');}catch(e){}location.reload();}
function switchView(id){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+id));
}
const LOADING='<div class="loading"><div class="spinner"></div>Cargando…</div>';

async function cargarTodo(){
  ['concentradoBody','porpagarBody','miasBody','historialBody','proveedoresBody'].forEach(i=>{document.getElementById(i).innerHTML=LOADING;});
  await Promise.all([cargarPagos(),cargarProveedores()]);
}
async function cargarPagos(){
  try{
    const j=await apiGet({accion:'pagos_list',id:SESSION.id,pin:SESSION.pin});
    if(!j.ok)throw new Error(j.error);
    PAGOS=j.filas||[];
  }catch(e){
    ['concentradoBody','porpagarBody','miasBody','historialBody'].forEach(i=>{document.getElementById(i).innerHTML=`<div class="errbox">${esc(e.message||'No se pudo cargar.')}</div>`;});
    return;
  }
  const deptos=[...new Set(PAGOS.map(r=>r[C.depto]).filter(Boolean))].sort();
  const hd=document.getElementById('hDepto'),cur=hd.value;
  hd.innerHTML='<option value="">Todos los deptos.</option>'+deptos.map(d=>`<option${d===cur?' selected':''}>${esc(d)}</option>`).join('');
  if(veTodo()){renderConcentrado();renderHistorial();}
  if(puedePagar()||esDireccion())renderPorPagar();
  renderMias();
}

// ————— Utilidades de render —————
function pill(e){return `<span class="pill ${ESTATUS_PILL[e]||'p-pend'}">${esc(e)}</span>`;}
function link(u,t){return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`:'';}
function docs(r){
  return `<div class="docs">${r[C.cot]?link(r[C.cot],'Cotización'):'<span class="no">Sin cotización</span>'}${(r[C.factura]||r[C.liga])?(r[C.liga]?link(r[C.liga],'Factura '+esc(r[C.factura])):'<a>Factura '+esc(r[C.factura])+'</a>'):'<span class="no">Factura pendiente</span>'}${r[C.comp]?link(r[C.comp],'Comprobante'):''}</div>`;
}
function fReqHtml(f){
  if(!f)return '–';
  const h=hoyMX(); const cls=f<h?'venc':(f<=addDias(h,2)?'venc':'');
  return `<span class="${cls}">${esc(f)}</span>`;
}
function clabeTxt(r){return r[C.forma]==='Transferencia'&&r[C.clabe]?`CLABE ${esc(r[C.clabe])}${r[C.banco]?' · '+esc(r[C.banco]):''}`:esc(r[C.forma]);}
function kpi(lbl,val,sub){return `<div class="kpi"><div class="k-lbl">${lbl}</div><div class="k-val">${val}</div>${sub?`<div class="k-sub">${sub}</div>`:''}</div>`;}
function suma(arr){return arr.reduce((a,r)=>a+num(r[C.monto]),0);}

// ————— Concentrado (Dirección autoriza; Admin/Full solo ven) —————
let CONC_DEPTO='';
function renderConcentrado(){
  const el=document.getElementById('concentradoBody');
  const pend=PAGOS.filter(r=>r[C.est]==='Pendiente');
  const aut=PAGOS.filter(r=>r[C.est]==='Autorizado');
  const mes=hoyMX().slice(0,7);
  const pagMes=PAGOS.filter(r=>r[C.est]==='Pagado'&&String(r[C.fPago]).slice(0,7)===mes);
  const urg=pend.filter(r=>r[C.urg]==='Urgente');
  const deptos=[...new Set(pend.map(r=>r[C.depto]||'—'))].sort();
  const vis=pend.filter(r=>!CONC_DEPTO||(r[C.depto]||'—')===CONC_DEPTO)
    .sort((a,b)=>(a[C.urg]==='Urgente'?0:1)-(b[C.urg]==='Urgente'?0:1)||String(a[C.fReq]||'9').localeCompare(String(b[C.fReq]||'9')));
  Object.keys(SEL).forEach(k=>{if(!pend.find(r=>r[C.id]===k))delete SEL[k];});
  const dir=esDireccion();
  let html=`<div class="kpis">
    ${kpi('Por autorizar','$'+money(suma(pend)),pend.length+' solicitud(es)')}
    ${kpi('Urgentes','$'+money(suma(urg)),urg.length+' solicitud(es)')}
    ${kpi('Autorizado por pagar','$'+money(suma(aut)),aut.length+' en Administración')}
    ${kpi('Pagado este mes','$'+money(suma(pagMes)),pagMes.length+' pago(s)')}
  </div>`;
  if(!pend.length){
    html+='<div class="empty">No hay solicitudes por autorizar. 🎉</div>';
  }else{
    html+=`<div class="ctl"><label>Departamento</label><select onchange="CONC_DEPTO=this.value;renderConcentrado()"><option value="">Todos (${pend.length})</option>${deptos.map(d=>{const n=pend.filter(r=>(r[C.depto]||'—')===d);return `<option value="${esc(d)}"${d===CONC_DEPTO?' selected':''}>${esc(d)} · ${n.length} · $${money(suma(n))}</option>`;}).join('')}</select>
      ${dir?'':'<span class="sub">Solo Dirección autoriza. Vista de consulta.</span>'}</div>
    <div style="overflow-x:auto"><table class="aud"><thead><tr>
      ${dir?`<th><input type="checkbox" onchange="selTodos(this.checked)" ${vis.length&&vis.every(r=>SEL[r[C.id]])?'checked':''}></th>`:''}
      <th>Requerido</th><th>Proveedor</th><th>Concepto</th><th class="hide-sm">Depto · solicitó</th><th>Docs</th><th>Monto</th>${dir?'<th></th>':''}
    </tr></thead><tbody>${vis.map(r=>`<tr>
      ${dir?`<td><input type="checkbox" ${SEL[r[C.id]]?'checked':''} onchange="selUno('${esc(r[C.id])}',this.checked)"></td>`:''}
      <td>${fReqHtml(r[C.fReq])}${r[C.urg]==='Urgente'?'<br><span class="pill p-rech">Urgente</span>':''}</td>
      <td><b>${esc(r[C.prov])}</b><div class="sub">${r[C.rfc]?'RFC '+esc(r[C.rfc]):'Sin RFC'} · ${clabeTxt(r)}</div></td>
      <td>${esc(r[C.concepto])}<div class="sub">${esc(r[C.id])} · ${esc(r[C.cat])}</div>${r[C.notas]?`<div class="sub">“${esc(r[C.notas])}”</div>`:''}</td>
      <td class="hide-sm">${esc(r[C.depto]||'—')}<div class="sub">${esc(r[C.solNom])} · ${esc(r[C.fSol])}</div></td>
      <td>${docs(r)}</td>
      <td class="num"><b>$${money(r[C.monto])}</b></td>
      ${dir?`<td><div class="row-actions"><button class="mini-btn ok" onclick="autorizar(['${esc(r[C.id])}'])">Autorizar</button><button class="mini-btn bad" onclick="modalRechazo('${esc(r[C.id])}')">Rechazar</button></div></td>`:''}
    </tr>`).join('')}</tbody></table></div>`;
    if(dir){
      const ids=Object.keys(SEL);const sel=pend.filter(r=>SEL[r[C.id]]);
      html+=`<div class="selbar ${ids.length?'':'hidden'}"><span>${ids.length} seleccionada(s)</span><b>$${money(suma(sel))}</b><button class="cap-btn" onclick="autorizar(Object.keys(SEL))">Autorizar seleccionadas</button></div>`;
    }
  }
  if(aut.length){
    html+=`<div class="section-eyebrow">Autorizado · esperando pago de Administración (${aut.length})</div>
      <table class="tabla-mini">${aut.sort((a,b)=>String(a[C.fReq]).localeCompare(String(b[C.fReq]))).map(r=>`<tr><td>${esc(r[C.id])}</td><td>${esc(r[C.prov])}</td><td>${fReqHtml(r[C.fReq])}</td><td class="num">$${money(r[C.monto])}</td></tr>`).join('')}</table>`;
  }
  el.innerHTML=html;
}
function selUno(id,on){if(on)SEL[id]=1;else delete SEL[id];renderConcentrado();}
function selTodos(on){PAGOS.filter(r=>r[C.est]==='Pendiente'&&(!CONC_DEPTO||(r[C.depto]||'—')===CONC_DEPTO)).forEach(r=>{if(on)SEL[r[C.id]]=1;else delete SEL[r[C.id]];});renderConcentrado();}
async function autorizar(ids){
  const filas=PAGOS.filter(r=>ids.indexOf(r[C.id])!==-1);
  if(!filas.length)return;
  if(!confirm(`¿Autorizar ${filas.length} pago(s) por $${money(suma(filas))}?`))return;
  try{
    const j=await api('pagos_autorizar',{idPagos:ids,accionEstatus:'autorizar'});
    if(!j.ok){alert(j.error);return;}
    SEL={};
    if(j.omitidos)alert(j.omitidos+' ya no estaban pendientes y se omitieron.');
    cargarPagos();
  }catch(e){alert('No se pudo procesar.');}
}
function modalRechazo(id){
  const r=PAGOS.find(x=>x[C.id]===id);

async function rechazar(id){
  const motivo=document.getElementById('mMotivo').value.trim();

  const j=await api('pagos_autorizar',{idPagos:[id],accionEstatus:'rechazar',motivo}).catch(()=>({ok:false,error:'No se pudo procesar.'}));

function renderPorPagar(){
  const el=document.getElementById('porpagarBody');
  const aut=PAGOS.filter(r=>r[C.est]==='Autorizado').sort((a,b)=>(a[C.urg]==='Urgente'?0:1)-(b[C.urg]==='Urgente'?0:1)||String(a[C.fReq]||'9').localeCompare(String(b[C.fReq]||'9')));

      <div class="monto">$${money(r[C.monto])}<div class="sub" style="text-align:right">${esc(r[C.forma])}</div></div>
      <div class="bank">${r[C.forma]==='Transferencia'?`<span>CLABE <b>${esc(r[C.clabe])}</b> <button class="copy" onclick="copiar('${esc(r[C.clabe])}',this)">Copiar</button></span><span>${esc(r[C.banco]||'Banco no indicado')}</span>`:`<span>Pago en ${esc(r[C.forma]).toLowerCase()}</span>`}<span>${r[C.rfc]?'RFC '+esc(r[C.rfc]):'Sin RFC'}</span>
      ${paga?`<button class="mini-btn ok" style="margin-left:auto" onclick="modalPagar('${esc(r[C.id])}')">Registrar pago</button>`:''}</div>
    </div>`).join('')}</div>`;
  if(sinFact.length)html+=`<div class="section-eyebrow">Pagados · falta factura (${sinFact.length})</div>
    <table class="tabla-mini">${sinFact.map(r=>`<tr><td>${esc(r[C.id])}</td><td>${esc(r[C.prov])}</td><td>${esc(r[C.solNom])}</td><td class="num">$${money(r[C.monto])}</td><td><button class="linkbtn" onclick="modalFactura('${esc(r[C.id])}')">+ Factura</button></td></tr>`).join('')}</table>`;
  el.innerHTML=html;
}
function copiar(t,btn){navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>{btn.textContent='✓';setTimeout(()=>btn.textContent='Copiar',1200);});}

async function pagar(id){

  if(!body.referenciaPago&&!body.comprobante){modalErr('Escribe la referencia o pega el comprobante.');return;}

async function guardarFactura(id){

function provPorNombre(n){const k=norm(n);return PROVEEDORES_CACHE.find(p=>norm(p[1])===k&&p[9]!=='NO');}
function onProveedor(){
  const inp=document.getElementById('pProveedor');if(!inp)return;
  const box=document.getElementById('provInfo'),forma=document.getElementById('pForma');
  const txt=inp.value.trim(),p=provPorNombre(txt);
  forma.options[0].disabled=false;
  if(p){
    const soloEf=!p[7];
    if(soloEf){forma.value=forma.value==='Transferencia'?'Efectivo':forma.value;forma.options[0].disabled=true;}
    box.innerHTML=`<div class="prov-card">✓ ${esc(p[1])} · ${p[6]?'RFC '+esc(p[6]):'Sin RFC'} · ${soloEf?'Solo efectivo':'CLABE ••••'+esc(String(p[7]).slice(-4))+(p[10]?' · '+esc(p[10]):'')}</div>`;
  }else if(txt){
    box.innerHTML=`<div class="prov-card">“${esc(txt)}” no está registrado. <button class="linkbtn" onclick="modalProveedor()">+ Registrar proveedor</button></div>`;
  }else box.innerHTML=`<div class="sub" style="margin-top:6px">¿No aparece? <button class="linkbtn" onclick="modalProveedor()">+ Registrar proveedor nuevo</button></div>`;
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
async function enviarPago(){
  const msg=document.getElementById('nuevaMsg');
  const p=provPorNombre(val('pProveedor'));
  if(!p){msg.innerHTML='<div class="errbox">Elige un proveedor registrado (o regístralo con “+ Registrar proveedor”).</div>';return;}
  const monto=num(val('pMonto'));
  if(!val('pConcepto')||monto<=0){msg.innerHTML='<div class="errbox">Concepto y monto son obligatorios.</div>';return;}
  if(!EDITANDO && !ventanaAbiertaMX() && !esDireccion()){msg.innerHTML='<div class="errbox">Fuera de horario: se reciben de sábado 00:00 a miércoles 12:00 pm.</div>';return;}
  const body={proveedorId:p[0],proveedor:p[1],concepto:val('pConcepto'),monto,formaPago:val('pForma'),categoria:val('pCategoria'),
    fechaRequerida:val('pFecha'),urgencia:val('pUrgencia'),cotizacion:val('pCot'),factura:val('pFactura'),liga:val('pLiga'),notas:val('pNotas')};
  msg.innerHTML='<div class="okmsg">Enviando…</div>';
  try{
    const j=EDITANDO?await api('pagos_editar',Object.assign({idPago:EDITANDO[C.id]},body)):await api('pagos_crear',body);
    if(!j.ok){msg.innerHTML=`<div class="errbox">${esc(j.error)}</div>`;return;}
    const fueEdit=!!EDITANDO;EDITANDO=null;renderNueva();
    document.getElementById('nuevaMsg').innerHTML=`<div class="okmsg">${fueEdit?'Cambios guardados.':'Solicitud '+esc(j.id||'')+' enviada a Dirección.'} La ves en “Mis solicitudes”.</div>`;
    cargarPagos();
  }catch(e){msg.innerHTML='<div class="errbox">No se pudo enviar. Revisa tu conexión.</div>';}
}
function applyPrefillFromURL(){
  const p=new URLSearchParams(location.search);
  if(p.get('prefill')!=='1')return;
  switchView('nueva');
  const set=(id,v)=>{if(v!=null && document.getElementById(id))document.getElementById(id).value=v;};
  set('pProveedor',p.get('proveedor'));set('pConcepto',p.get('concepto'));set('pMonto',p.get('monto'));set('pNotas',p.get('notas'));
  if(p.get('categoria'))set('pCategoria',p.get('categoria'));
  onProveedor();
}

// ————— Mis solicitudes —————
function renderMias(){
  const el=document.getElementById('miasBody');
  const mias=PAGOS.filter(r=>String(r[C.solId])===String(SESSION.id));
  if(!mias.length){el.innerHTML='<div class="empty">Aún no has enviado solicitudes de pago.</div>';return;}
  const pend=mias.filter(r=>r[C.est]==='Pendiente'),aut=mias.filter(r=>r[C.est]==='Autorizado');
  el.innerHTML=`<div class="kpis">${kpi('En revisión de Dirección','$'+money(suma(pend)),pend.length+' solicitud(es)')}${kpi('Autorizado, por pagar','$'+money(suma(aut)),aut.length+' solicitud(es)')}</div>
  <div style="overflow-x:auto"><table class="aud"><thead><tr><th>ID · fecha</th><th>Proveedor</th><th>Concepto</th><th>Monto</th><th>Estatus</th><th>Docs</th><th></th></tr></thead><tbody>
  ${mias.map(r=>{
    const e=r[C.est],vivo=e!=='Rechazado'&&e!=='Cancelado';
    return `<tr><td>${esc(r[C.id])}<div class="sub">${esc(r[C.fSol])}</div></td><td>${esc(r[C.prov])}</td><td>${esc(r[C.concepto])}</td><td class="num">$${money(r[C.monto])}</td>
    <td>${pill(e)}${e==='Rechazado'&&r[C.motivo]?`<div class="sub">${esc(r[C.motivo])}</div>`:''}${e==='Pagado'?`<div class="sub">${esc(r[C.fPago])}</div>`:''}</td>
    <td>${docs(r)}</td>
    <td><div class="row-actions">${e==='Pendiente'?`<button class="mini-btn info" onclick="editar('${esc(r[C.id])}')">Editar</button><button class="mini-btn ghost" onclick="cancelar('${esc(r[C.id])}')">Cancelar</button>`:''}${vivo&&!r[C.factura]&&!r[C.liga]?`<button class="mini-btn ghost" onclick="modalFactura('${esc(r[C.id])}')">+ Factura</button>`:''}</div></td></tr>`;}).join('')}
  </tbody></table></div>`;
}
function editar(id){EDITANDO=PAGOS.find(r=>r[C.id]===id);renderNueva();switchView('nueva');window.scrollTo(0,0);}
async function cancelar(id){
  if(!confirm('¿Cancelar la solicitud '+id+'?'))return;
  const j=await api('pagos_cancelar',{idPago:id}).catch(()=>({ok:false,error:'No se pudo procesar.'}));
  if(!j.ok){alert(j.error);return;}
  cargarPagos();
}

// ————— Historial —————
function filtrarHistorial(){
  const d=val('hDesde'),h=val('hHasta'),e=val('hEstatus'),dep=val('hDepto'),t=norm(val('hTexto'));
  return PAGOS.filter(r=>{const f=String(r[C.fSol]).slice(0,10);
    return (!d||f>=d)&&(!h||f<=h)&&(!e||r[C.est]===e)&&(!dep||r[C.depto]===dep)&&(!t||norm(r[C.prov]+' '+r[C.concepto]).indexOf(t)!==-1);});
}
function renderHistorial(){
  const el=document.getElementById('historialBody'),filas=filtrarHistorial();
  const porCat={};filas.filter(r=>r[C.est]!=='Rechazado'&&r[C.est]!=='Cancelado').forEach(r=>{porCat[r[C.cat]]=(porCat[r[C.cat]]||0)+num(r[C.monto]);});
  let top='–',tv=0;Object.keys(porCat).forEach(c=>{if(porCat[c]>tv){tv=porCat[c];top=c;}});
  const pag=filas.filter(r=>r[C.est]==='Pagado');
  document.getElementById('historialKpis').innerHTML=`<div class="kpis">${kpi('Pagado en el rango','$'+money(suma(pag)),pag.length+' pago(s)')}${kpi('Solicitado (sin rechazos)','$'+money(Object.values(porCat).reduce((a,b)=>a+b,0)))}${kpi('Categoría top','<span style="font-size:15px">'+esc(top)+'</span>','$'+money(tv))}</div>`;
  if(!filas.length){el.innerHTML='<div class="empty">Sin resultados para ese filtro.</div>';return;}
  el.innerHTML=`<div style="overflow-x:auto"><table class="aud" id="histTable"><thead><tr>
    <th>ID</th><th>Fecha</th><th>Depto</th><th>Proveedor</th><th>Concepto</th><th>Monto</th><th>Forma</th><th>Estatus</th><th>Autorizó</th><th>Pago</th><th class="no-pdf">Docs</th>
  </tr></thead><tbody>${filas.map(r=>`<tr><td>${esc(r[C.id])}</td><td>${esc(r[C.fSol])}</td><td>${esc(r[C.depto])}</td><td>${esc(r[C.prov])}</td><td>${esc(r[C.concepto])}</td>
    <td class="num">$${money(r[C.monto])}</td><td>${esc(r[C.forma])}</td><td>${pill(r[C.est])}${r[C.est]==='Rechazado'&&r[C.motivo]?`<div class="sub">${esc(r[C.motivo])}</div>`:''}</td>
    <td>${esc(r[C.autPor]||'–')}</td><td>${r[C.fPago]?esc(r[C.fPago])+(r[C.ref]?' · '+esc(r[C.ref]):''):'–'}</td><td class="no-pdf">${docs(r)}</td></tr>`).join('')}</tbody></table></div>`;
}
function pdfHistorial(){
  const el=document.getElementById('historialBody');
  if(!document.getElementById('histTable')){alert('No hay datos para ese filtro.');return;}
  const clon=el.cloneNode(true);clon.querySelectorAll('.no-pdf').forEach(n=>n.remove());
  const w=window.open('','_blank','width=1000,height=650');
  if(!w){alert('Permite las ventanas emergentes para descargar el PDF.');return;}
  w.document.write('<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Pagos Casa Yuma</title>'+
    '<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">'+
    '<style>body{font-family:"Spline Sans Mono",monospace;background:#F5F1E6;padding:24px;color:#20302f}h1{font-family:"Fraunces",serif;font-size:20px;color:#88285C}.pdf-head{display:flex;gap:12px;border-bottom:2px solid #88285C;padding-bottom:12px;margin-bottom:18px}.pdf-head .date{margin-left:auto;font-size:12px;color:#72785E}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#72785E;color:#F5F1E6;text-align:left;padding:7px}td{padding:6px 7px;border-bottom:1px solid #d8cfb8}.num{text-align:right}.sub{font-size:10px;color:#72785E}.pill{font-weight:600;text-transform:uppercase;font-size:10px}@media print{@page{size:A4 landscape;margin:12mm}}</style>'+
    '</head><body><div class="pdf-head"><h1>Casa Yuma</h1><span>Pagos a Proveedores</span><span class="date">'+esc(val('hDesde'))+' – '+esc(val('hHasta'))+'</span></div>'+
    document.getElementById('historialKpis').innerHTML.replace(/class="kpis"/,'style="display:flex;gap:24px;margin-bottom:14px;font-size:12px"')+clon.innerHTML+'</body></html>');
  w.document.close();setTimeout(function(){w.focus();w.print();},600);
}
function csvHistorial(){
  const filas=filtrarHistorial();if(!filas.length){alert('No hay datos para ese filtro.');return;}
  const head=['ID','FechaSolicitud','Departamento','Solicitó','Proveedor','RFC','Categoría','Concepto','Monto','Forma','CLABE','Banco','FechaRequerida','Urgencia','Estatus','Autorizó','FechaAutorización','Motivo','FechaPago','Referencia','Factura','LigaFactura','Cotización','Comprobante','PagadoPor'];
  const k=['id','fSol','depto','solNom','prov','rfc','cat','concepto','monto','forma','clabe','banco','fReq','urg','est','autPor','fAut','motivo','fPago','ref','factura','liga','cot','comp','pagPor'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='﻿'+[head.map(q).join(',')].concat(filas.map(r=>k.map(x=>x==='clabe'&&r[C.clabe]?q('\t'+r[C.clabe]):q(r[C[x]])).join(','))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='pagos_'+val('hDesde')+'_'+val('hHasta')+'.csv';a.click();
}

// ————— Proveedores —————
async function cargarProveedores(){
  try{
    const j=await apiGet({accion:'proveedores_list',id:SESSION.id,pin:SESSION.pin});
    if(!j.ok)throw new Error(j.error);
    PROVEEDORES_CACHE=j.filas||[];
  }catch(e){document.getElementById('proveedoresBody').innerHTML=`<div class="errbox">${esc(e.message)}</div>`;return;}
  const dl=document.getElementById('pProveedorList');
  if(dl)dl.innerHTML=PROVEEDORES_CACHE.filter(p=>p[9]!=='NO').map(p=>`<option value="${esc(p[1])}">`).join('');
  onProveedor();
  renderProveedores();
}
function renderProveedores(){
  document.getElementById('proveedoresBody').innerHTML=`
    <div class="ctl"><button class="cap-btn" onclick="modalProveedor()">+ Nuevo proveedor</button><input id="provBuscar" placeholder="Buscar…" oninput="renderProvTabla()" style="width:200px"></div>
    <div id="provTabla"></div>`;
  renderProvTabla();
}
function renderProvTabla(){
  const t=norm(val('provBuscar')),ed=editaProveedores();
  const lst=PROVEEDORES_CACHE.filter(p=>!t||norm(p[1]+' '+p[2]+' '+p[6]).indexOf(t)!==-1);
  document.getElementById('provTabla').innerHTML=`<div class="section-eyebrow">Catálogo (${lst.length})</div><div style="overflow-x:auto"><table class="aud"><thead><tr><th>Nombre</th><th>Categoría</th><th>RFC</th><th>Pago</th><th>Contacto</th>${ed?'<th></th>':''}</tr></thead><tbody>
    ${lst.map(p=>`<tr${p[9]==='NO'?' style="opacity:.5"':''}><td>${esc(p[1])}<div class="sub">${esc(p[0])}</div></td><td>${esc(p[2])}</td><td>${esc(p[6]||'Sin RFC')}</td>
      <td>${p[7]?`CLABE ${ed?esc(p[7]):'••••'+esc(String(p[7]).slice(-4))}<div class="sub">${esc(p[10])}</div>`:'Solo efectivo'}</td><td>${esc(p[3])}<div class="sub">${esc(p[4])}</div></td>
      ${ed?`<td><button class="mini-btn ghost" onclick="modalProveedor('${esc(p[0])}')">Editar</button></td>`:''}</tr>`).join('')||'<tr><td colspan="6" class="empty">Aún no hay proveedores registrados.</td></tr>'}
  </tbody></table></div>`;
}
function modalProveedor(idEditar){
  const p=idEditar?PROVEEDORES_CACHE.find(x=>x[0]===idEditar):null;
  const nombre=p?p[1]:(val('pProveedor')||'');
  const ef=p?!p[7]:false;
  abrirModal(`<h2>${p?'Editar proveedor':'Nuevo proveedor'}</h2>
    <div class="fld"><label>Nombre o razón social</label><input id="vNombre" value="${esc(nombre)}" ${p?'disabled':''}></div>
    <div class="fld"><label>Categoría</label><select id="vCategoria">${CATEGORIAS.map(c=>`<option${p&&p[2]===c?' selected':''}>${c}</option>`).join('')}</select></div>
    <div class="fld"><label>RFC</label><input id="vRfc" value="${esc(p?p[6]:'')}" placeholder="Déjalo vacío si no tiene" style="text-transform:uppercase"></div>
    <div class="fld"><label>¿Cómo se le paga?</label><div class="seg">
      <label><input type="radio" name="vForma" value="Transferencia" ${ef?'':'checked'} onchange="toggleClabe()"><span>Transferencia</span></label>
      <label><input type="radio" name="vForma" value="Efectivo" ${ef?'checked':''} onchange="toggleClabe()"><span>Solo efectivo</span></label></div></div>
    <div id="vClabeWrap">
      <div class="fld"><label>CLABE (18 dígitos)</label><input id="vClabe" inputmode="numeric" maxlength="22" value="${esc(p?p[7]:'')}"></div>
      <div class="fld"><label>Banco</label><input id="vBanco" value="${esc(p?p[10]:'')}"></div>
    </div>
    <div class="fld"><label>Contacto</label><input id="vContacto" value="${esc(p?p[3]:'')}" placeholder="Nombre"></div>
    <div class="fld"><label>Teléfono</label><input id="vTelefono" value="${esc(p?p[4]:'')}" inputmode="tel"></div>
    ${p?`<div class="fld"><label>Activo</label><select id="vActivo"><option>SI</option><option${p[9]==='NO'?' selected':''}>NO</option></select></div>`:''}
    <div class="acts"><button class="mini-btn ghost" onclick="cerrarModal()">Cancelar</button><button class="cap-btn" onclick="guardarProveedor(${p?`'${esc(p[0])}'`:''})">Guardar</button></div><div id="mMsg"></div>`);
  toggleClabe();
}
function toggleClabe(){const ef=document.querySelector('input[name=vForma]:checked').value==='Efectivo';document.getElementById('vClabeWrap').classList.toggle('hidden',ef);}
async function guardarProveedor(idEditar){
  const forma=document.querySelector('input[name=vForma]:checked').value;
  const clabe=val('vClabe').replace(/\D/g,'');
  const rfc=val('vRfc').toUpperCase();
  if(!val('vNombre')){modalErr('El nombre es obligatorio.');return;}
  if(forma==='Transferencia'&&clabe.length!==18){modalErr('La CLABE debe tener 18 dígitos (llevas '+clabe.length+').');return;}
  if(rfc&&!/^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/.test(rfc)){modalErr('El RFC no parece válido. Si no tiene, déjalo vacío.');return;}
  const body={nombre:val('vNombre'),categoria:val('vCategoria'),rfc,formaPagoProv:forma,clabe,banco:val('vBanco'),contacto:val('vContacto'),telefono:val('vTelefono')};
  if(idEditar){body.proveedorId=idEditar;body.activo=val('vActivo');}
  modalErr('');document.getElementById('mMsg').innerHTML='<div class="okmsg">Guardando…</div>';
  const j=await api(idEditar?'proveedores_actualizar':'proveedores_crear',body).catch(()=>({ok:false,error:'No se pudo guardar.'}));
  if(!j.ok){modalErr(j.error);return;}
  cerrarModal();
  await cargarProveedores();
  if(!idEditar&&document.getElementById('pProveedor')){document.getElementById('pProveedor').value=body.nombre;onProveedor();}
}

// ————— Modal —————
function abrirModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open');}
function cerrarModal(){document.getElementById('modal').classList.remove('open');}
function modalErr(t){const m=document.getElementById('mMsg');if(m)m.innerHTML=t?`<div class="errbox">${esc(t)}</div>`:'';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarModal();});
</script>
</body>
</html>

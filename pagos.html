<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Yuma · Pagos a Proveedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2C6E73; --gold:#E1D082; --wool:#EAE3CD; --cactus:#72785E; --purple:#88285C;
  --ink:#20302f; --paper:#F5F1E6; --line:#d8cfb8;
  --ok:#3f7d4e; --warn:#b5892a; --bad:#a8324a;
  --mono:'Spline Sans Mono',ui-monospace,monospace; --disp:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--mono);background:var(--paper);color:var(--ink);line-height:1.5;font-size:15px}
h1,h2,h3{font-family:var(--disp);font-weight:600;line-height:1.1}
a{color:var(--blue)} button{font-family:var(--mono);cursor:pointer}
#gate{position:fixed;inset:0;background:var(--purple);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.gate-card{background:var(--paper);border-radius:2px;max-width:400px;width:100%;padding:40px 32px;box-shadow:0 30px 80px rgba(0,0,0,.3);text-align:center}
.gate-eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--cactus);margin-bottom:12px}
.gate-card h1{font-size:32px;color:var(--purple);margin-bottom:4px;font-weight:900}
.gate-sub{font-size:12.5px;color:var(--cactus);margin-bottom:26px}
.fld{text-align:left;margin-bottom:16px}
.fld label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cactus);margin-bottom:6px}
.fld select,.fld input,.fld textarea{width:100%;font-family:var(--mono);font-size:16px;padding:11px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px;outline:none}
.fld select:focus,.fld input:focus,.fld textarea:focus{border-color:var(--purple)}
.fld input.pin{letter-spacing:.4em;text-align:center;font-size:22px}
.gate-btn{margin-top:8px;width:100%;background:var(--purple);color:#fff;border:none;padding:14px;font-size:13px;letter-spacing:.15em;text-transform:uppercase;border-radius:2px;transition:background .2s}
.gate-btn:hover{background:#6e2049}
.gate-btn.ghost{background:transparent;color:var(--purple);border:1px solid var(--line);margin-top:10px}
.gate-err{color:var(--bad);font-size:12.5px;margin-top:14px;min-height:18px}
.gate-info{color:var(--cactus);font-size:12px;margin-top:12px;min-height:16px}
.hidden{display:none!important}
#app{display:none;min-height:100vh}
header.top{background:var(--purple);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.top h1{font-size:20px;font-weight:900}
.top .who{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:14px}
.top .who a, .top .who button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:5px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-radius:2px;text-decoration:none}
nav.tabs{background:var(--purple);border-top:1px solid rgba(255,255,255,.15);padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:transparent;border:none;color:rgba(255,255,255,.7);padding:12px 18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.active{color:#fff;border-bottom-color:var(--gold)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.view{display:none}.view.active{display:block}
.section-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--cactus);margin:26px 0 10px}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.ctl label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cactus)}
select,.ctl input{font-family:var(--mono);font-size:14px;padding:9px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px;outline:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:#fff;border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:2px;padding:15px 16px}
.kpi .k-lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cactus);margin-bottom:6px}
.kpi .k-val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:11px;color:var(--cactus);margin-top:2px}
.cap-form{background:#fff;border:1px solid var(--line);border-radius:3px;padding:24px;max-width:640px}
.cap-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.cap-grid .fld{margin-bottom:0}
.cap-full{grid-column:1/-1}
.cap-btn{background:var(--purple);color:#fff;border:none;padding:13px 24px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:2px}
.cap-btn:hover{background:#6e2049}
.cap-btn.sec{background:var(--blue)}
.cap-btn.sec:hover{background:#255a5e}
.aud{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.aud th{background:var(--cactus);color:var(--paper);text-align:left;padding:9px 11px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.aud td{padding:8px 11px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.aud tr:hover td{background:#efe9d8}
.aud td.num{text-align:right}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.p-pend{background:#f2e6cf;color:var(--warn)}
.p-aprob{background:#dce7ea;color:var(--blue)}
.p-pagado{background:#e0efe0;color:var(--ok)}
.p-rech{background:#f2d6dc;color:var(--bad)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.mini-btn{border:none;padding:6px 11px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;color:#fff}
.mini-btn.ok{background:var(--ok)}
.mini-btn.bad{background:var(--bad)}
.mini-btn.info{background:var(--blue)}
.just-input{width:160px;font-family:var(--mono);font-size:12px;padding:6px;border:1px solid var(--line);border-radius:2px;resize:vertical;min-height:34px}
.loading,.empty{text-align:center;padding:50px 20px;color:var(--cactus);font-size:13px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{background:#f2d6dc;border:1px solid var(--bad);color:var(--bad);padding:14px 16px;border-radius:2px;font-size:13px;margin:20px 0}
.okmsg{background:#e0efe0;border:1px solid var(--ok);color:var(--ok);padding:10px 14px;border-radius:2px;font-size:13px;margin:12px 0}
.note{font-size:11.5px;color:var(--cactus);margin-top:18px;font-style:italic}
@media(max-width:560px){main{padding:20px 12px 70px}.cap-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-eyebrow">Puerto Escondido · Oaxaca</div>
    <h1>Casa Yuma</h1>
    <div class="gate-sub">Pagos a Proveedores</div>
    <div id="step1">
      <div class="fld"><label>Colaborador</label><select id="userSel"></select></div>
      <div class="fld"><label>Número de colaborador</label><input id="userId" type="text" placeholder="CY000" autocomplete="off"></div>
      <button class="gate-btn" onclick="identificar()">Continuar</button>
    </div>
    <div id="step2" class="hidden">
      <div class="fld"><label id="pinLabel">Tu PIN</label><input id="pinInput" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off"></div>
      <div id="pinInput2wrap" class="fld hidden"><label>Confirma tu PIN</label><input id="pinInput2" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off"></div>
      <button class="gate-btn" id="pinBtn" onclick="pinSubmit()">Entrar</button>
      <button class="gate-btn ghost" onclick="volverStep1()">← Cambiar colaborador</button>
    </div>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-info" id="gateInfo"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>Casa Yuma · Pagos a Proveedores</h1>
    <div class="who"><span id="whoLabel"></span><a href="index.html">Portal</a><button onclick="logout()">Salir</button></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-view="nueva" class="active">Nueva solicitud</button>
    <button data-view="pendientes">Pendientes</button>
    <button data-view="historial">Historial</button>
    <button data-view="proveedores">Proveedores</button>
  </nav>
  <main>
    <section class="view active" id="v-nueva"><div id="nuevaBody"></div></section>
    <section class="view" id="v-pendientes"><div id="pendientesBody"><div class="loading"><div class="spinner"></div>Cargando…</div></div></section>
    <section class="view" id="v-historial">
      <div class="ctl">
        <label>Desde</label><input id="hDesde" type="date">
        <label>Hasta</label><input id="hHasta" type="date">
        <label>Estatus</label>
        <select id="hEstatus"><option value="">Todos</option><option>Pendiente</option><option>Aprobado</option><option>Pagado</option><option>Rechazado</option></select>
        <button class="cap-btn" style="padding:9px 16px" onclick="cargarHistorial()">Ver</button>
        <button class="cap-btn sec" style="padding:9px 16px" onclick="pdfHistorial()">PDF</button>
      </div>
      <div id="historialKpis"></div>
      <div id="historialBody"><div class="empty">Elige un rango de fechas para ver el historial.</div></div>
    </section>
    <section class="view" id="v-proveedores"><div id="proveedoresBody"><div class="loading"><div class="spinner"></div>Cargando…</div></div></section>
  </main>
</div>

<script>
const CONFIG={
  WEBAPP_URL:'https://script.google.com/macros/s/AKfycbwaQK50qEOFGvYxoy3wpS17uPzru1BQAs0TYwnEeD50M1fe3UfNWqcy1AwN1wDOlqM/exec', // misma Web App que usa index.html y requisiciones.html
  USERS:[
    {id:'CY035',n:'Aida Carrillo Patiño'},{id:'CY037',n:'Omar Emiliano de la Tejera Zamorano'},
    {id:'CY038',n:'Rodolfo Ramirez Pérez'},{id:'CY057',n:'Arleth Paola Anicacio Antúnez'},
    {id:'CY039',n:'Jesus Israel Castillo Hernández'},{id:'CY001',n:'Manuel Arturo Otazo Aponte'},
    {id:'CY064',n:'Jorge Guillén Garbuno'},{id:'CY070',n:'América Arróniz'},{id:'CY999',n:'Growthbis'},
  ],
};
const CATEGORIAS=['Alimentos y Bebidas','Mantenimiento','Amenities e Insumos','Servicios (luz/agua/internet)','Honorarios y Nómina externa','Marketing','Eventos','Construcción / Obra','Otros'];
const FORMAS_PAGO=['Transferencia','Cheque','Efectivo','Tarjeta'];
const money=n=>(isNaN(n)||n===''||n==null)?'–':Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{const x=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(x)?0:x;};
let SESSION=null,PENDING=null;

(function(){const sel=document.getElementById('userSel');CONFIG.USERS.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.n;sel.appendChild(o);});sel.onchange=()=>{document.getElementById('userId').value=sel.value;};document.getElementById('userId').value=sel.value;})();

async function apiGet(params){params=Object.assign({},params,{_ts:Date.now()});const qs=Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');const res=await fetch(CONFIG.WEBAPP_URL+'?'+qs,{cache:'no-store'});return res.json();}
async function apiPost(body){const res=await fetch(CONFIG.WEBAPP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return res.json();}

// Intenta retomar la sesión guardada por index.html (mismo dominio/carpeta)
(async function tryAutoLogin(){
  try{
    const raw=sessionStorage.getItem('CY_FIN_SESSION');
    if(!raw)return;
    const s=JSON.parse(raw);
    const j=await apiGet({accion:'entrar',id:s.id,pin:s.pin});
    if(j.ok){
      if((j.nivel||s.nivel)!=='full'){return;} // este módulo exige nivel full aunque la sesión sea válida
      SESSION={id:s.id,pin:s.pin,nombre:j.nombre||s.nombre,nivel:j.nivel||s.nivel};
      entrarApp();
    }
  }catch(e){/* si falla, se queda en el gate normal */}
})();

async function identificar(){
  const id=document.getElementById('userId').value.trim().toUpperCase();
  const err=document.getElementById('gateErr'),info=document.getElementById('gateInfo');
  err.textContent='';info.textContent='Verificando…';
  try{
    const j=await apiGet({accion:'login',id:id});
    if(!j.ok){info.textContent='';err.textContent=j.error;return;}
    PENDING={id:j.id,nombre:j.nombre,nivel:j.nivel,tienePin:j.tienePin};info.textContent='';
    document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');
    if(j.tienePin){document.getElementById('pinLabel').textContent='Tu PIN · '+j.nombre.split(' ')[0];document.getElementById('pinInput2wrap').classList.add('hidden');document.getElementById('pinBtn').textContent='Entrar';}
    else{document.getElementById('pinLabel').textContent='Crea tu PIN · '+j.nombre.split(' ')[0];document.getElementById('pinInput2wrap').classList.remove('hidden');document.getElementById('pinBtn').textContent='Crear PIN y entrar';info.textContent='Primera vez: define un PIN de 4 a 6 dígitos.';}
    document.getElementById('pinInput').focus();
  }catch(e){info.textContent='';err.textContent='No se pudo conectar. Revisa CONFIG.WEBAPP_URL.';}
}
function volverStep1(){document.getElementById('step2').classList.add('hidden');document.getElementById('step1').classList.remove('hidden');document.getElementById('gateErr').textContent='';document.getElementById('gateInfo').textContent='';document.getElementById('pinInput').value='';document.getElementById('pinInput2').value='';}
async function pinSubmit(){
  const pin=document.getElementById('pinInput').value.trim();const err=document.getElementById('gateErr');err.textContent='';
  if(!/^\d{4,6}$/.test(pin)){err.textContent='El PIN debe ser de 4 a 6 dígitos.';return;}
  try{
    let j;
    if(PENDING.tienePin){j=await apiGet({accion:'entrar',id:PENDING.id,pin:pin});}
    else{const pin2=document.getElementById('pinInput2').value.trim();if(pin!==pin2){err.textContent='Los PIN no coinciden.';return;}j=await apiPost({accion:'crearPin',id:PENDING.id,pin:pin});}
    if(!j.ok){err.textContent=j.error;return;}
    const nivel=j.nivel||PENDING.nivel;
    if(nivel!=='full'){err.textContent='Este módulo requiere nivel de acceso "full".';return;}
    SESSION={id:PENDING.id,pin:pin,nombre:j.nombre||PENDING.nombre,nivel:nivel};entrarApp();
  }catch(e){err.textContent='No se pudo conectar.';}
}
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')pinSubmit();});
document.getElementById('pinInput2').addEventListener('keydown',e=>{if(e.key==='Enter')pinSubmit();});
document.getElementById('userId').addEventListener('keydown',e=>{if(e.key==='Enter')identificar();});

function entrarApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoLabel').textContent=SESSION.nombre+' · '+SESSION.nivel.toUpperCase();
  try{sessionStorage.setItem('CY_FIN_SESSION',JSON.stringify(SESSION));}catch(e){}
  document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>switchView(b.dataset.view,b));
  renderNueva();
  cargarPendientes();
  cargarProveedores();
  applyPrefillFromURL();
}
function logout(){try{sessionStorage.removeItem('CY_FIN_SESSION');}catch(e){}location.reload();}
function switchView(id,btn){document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('v-'+id).classList.add('active');}

// ————— Nueva solicitud —————
let PROVEEDORES_CACHE=[];
function renderNueva(){
  const hoy=new Date().toISOString().slice(0,10);
  document.getElementById('nuevaBody').innerHTML=`
    <div class="section-eyebrow">Nueva solicitud de pago</div>
    <div class="cap-form">
      <div class="cap-grid">
        <div class="fld cap-full"><label>Proveedor</label>
          <input id="pProveedor" list="pProveedorList" placeholder="Nombre del proveedor">
          <datalist id="pProveedorList"></datalist>
        </div>
        <div class="fld"><label>Categoría</label><select id="pCategoria">${CATEGORIAS.map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="fld"><label>Forma de pago</label><select id="pForma">${FORMAS_PAGO.map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="fld cap-full"><label>Concepto</label><input id="pConcepto" placeholder="Ej. Compra de blancos para habitaciones"></div>
        <div class="fld"><label>Monto (MXN)</label><input id="pMonto" type="number" step="0.01" placeholder="0.00"></div>
        <div class="fld"><label>Fecha requerida de pago</label><input id="pFecha" type="date" value="${hoy}"></div>
        <div class="fld"><label>No. de factura / CFDI</label><input id="pFactura" placeholder="Opcional"></div>
        <div class="fld"><label>Urgencia</label><select id="pUrgencia"><option>Normal</option><option>Urgente</option></select></div>
        <div class="fld cap-full"><label>Liga a comprobante (Drive, opcional)</label><input id="pLiga" placeholder="https://drive.google.com/..."></div>
        <div class="fld cap-full"><label>Notas</label><textarea id="pNotas" rows="2" placeholder="Opcional"></textarea></div>
      </div>
      <button class="cap-btn" onclick="crearPago()">Enviar solicitud</button>
      <div id="nuevaMsg"></div>
    </div>`;
}
function applyPrefillFromURL(){
  const p=new URLSearchParams(location.search);
  if(p.get('prefill')!=='1')return;
  const set=(id,v)=>{if(v!=null && document.getElementById(id))document.getElementById(id).value=v;};
  set('pProveedor',p.get('proveedor'));
  set('pConcepto',p.get('concepto'));
  set('pMonto',p.get('monto'));
  set('pNotas',p.get('notas'));
  if(p.get('categoria'))set('pCategoria',p.get('categoria'));
}
async function crearPago(){
  const proveedor=document.getElementById('pProveedor').value.trim();
  const concepto=document.getElementById('pConcepto').value.trim();
  const monto=num(document.getElementById('pMonto').value);
  const msg=document.getElementById('nuevaMsg');
  if(!proveedor||!concepto||monto<=0){msg.innerHTML='<div class="errbox">Proveedor, concepto y monto son obligatorios.</div>';return;}
  const body={accion:'pagos_crear',id:SESSION.id,pin:SESSION.pin,
    proveedor,categoria:document.getElementById('pCategoria').value,
    concepto,monto,moneda:'MXN',
    formaPago:document.getElementById('pForma').value,
    fechaRequerida:document.getElementById('pFecha').value,
    factura:document.getElementById('pFactura').value.trim(),
    liga:document.getElementById('pLiga').value.trim(),
    urgencia:document.getElementById('pUrgencia').value,
    notas:document.getElementById('pNotas').value.trim()};
  msg.innerHTML='<div class="okmsg">Enviando…</div>';
  try{
    const j=await apiPost(body);
    if(!j.ok){msg.innerHTML=`<div class="errbox">${j.error}</div>`;return;}
    msg.innerHTML=`<div class="okmsg">Solicitud ${j.id||''} creada. Aparecerá en "Pendientes".</div>`;
    renderNueva();
    cargarPendientes();
  }catch(e){msg.innerHTML='<div class="errbox">No se pudo enviar.</div>';}
}

// ————— Pendientes —————
async function cargarPendientes(){
  const el=document.getElementById('pendientesBody');
  el.innerHTML='<div class="loading"><div class="spinner"></div>Cargando…</div>';
  try{
    const j=await apiGet({accion:'pagos_list',id:SESSION.id,pin:SESSION.pin,estatus:'Pendiente'});
    if(!j.ok)throw new Error(j.error);
    const filas=j.filas||[];
    if(!filas.length){el.innerHTML='<div class="empty">No hay pagos pendientes de aprobación.</div>';return;}
    el.innerHTML=`<div class="section-eyebrow">Pendientes de aprobación (${filas.length})</div>
      <div style="overflow-x:auto"><table class="aud"><thead><tr>
        <th>ID</th><th>Proveedor</th><th>Concepto</th><th>Categoría</th><th>Monto</th><th>Requerido</th><th>Urgencia</th><th>Solicitó</th><th>Acción</th>
      </tr></thead><tbody>${filas.map(r=>rowPendiente(r)).join('')}</tbody></table></div>`;
  }catch(e){el.innerHTML=`<div class="errbox">${e.message}</div>`;}
}
function rowPendiente(r){
  const [id,fechaSol,solId,solNombre,proveedor,categoria,concepto,monto,moneda,forma,fechaReq,factura,liga,urgencia]=r;
  return `<tr>
    <td>${id}</td><td>${proveedor}</td><td>${concepto}</td><td>${categoria}</td>
    <td class="num">$${money(monto)}</td><td>${fechaReq||'–'}</td>
    <td>${urgencia==='Urgente'?'<span class="pill p-rech">Urgente</span>':'Normal'}</td>
    <td>${solNombre||solId}</td>
    <td><div class="row-actions">
      <button class="mini-btn ok" onclick="aprobarPago('${id}')">Aprobar</button>
      <button class="mini-btn bad" onclick="pedirRechazo('${id}')">Rechazar</button>
    </div><div id="rj_${id}"></div></td>
  </tr>`;
}
async function aprobarPago(id){
  if(!confirm('¿Aprobar el pago '+id+'?'))return;
  try{const j=await apiPost({accion:'pagos_actualizar',id:SESSION.id,pin:SESSION.pin,idPago:id,accionEstatus:'aprobar'});if(!j.ok){alert(j.error);return;}cargarPendientes();}catch(e){alert('No se pudo procesar.');}
}
function pedirRechazo(id){
  const box=document.getElementById('rj_'+id);
  box.innerHTML=`<textarea class="just-input" id="mot_${id}" placeholder="Motivo del rechazo"></textarea><button class="mini-btn bad" style="margin-top:4px" onclick="rechazarPago('${id}')">Confirmar</button>`;
}
async function rechazarPago(id){
  const motivo=document.getElementById('mot_'+id).value.trim();
  if(!motivo){alert('Escribe un motivo.');return;}
  try{const j=await apiPost({accion:'pagos_actualizar',id:SESSION.id,pin:SESSION.pin,idPago:id,accionEstatus:'rechazar',motivo});if(!j.ok){alert(j.error);return;}cargarPendientes();}catch(e){alert('No se pudo procesar.');}
}
async function marcarPagado(id){
  const ref=prompt('Referencia de transferencia / folio (opcional):')||'';
  const fecha=new Date().toISOString().slice(0,10);
  try{const j=await apiPost({accion:'pagos_actualizar',id:SESSION.id,pin:SESSION.pin,idPago:id,accionEstatus:'marcarPagado',referenciaPago:ref,fechaPago:fecha});if(!j.ok){alert(j.error);return;}cargarHistorial();}catch(e){alert('No se pudo procesar.');}
}

// ————— Historial —————
const ESTATUS_PILL={Pendiente:'p-pend',Aprobado:'p-aprob',Pagado:'p-pagado',Rechazado:'p-rech'};
async function cargarHistorial(){
  const el=document.getElementById('historialBody');
  const desde=document.getElementById('hDesde').value, hasta=document.getElementById('hHasta').value, estatus=document.getElementById('hEstatus').value;
  el.innerHTML='<div class="loading"><div class="spinner"></div>Cargando…</div>';
  try{
    const j=await apiGet({accion:'pagos_list',id:SESSION.id,pin:SESSION.pin,desde,hasta,estatus});
    if(!j.ok)throw new Error(j.error);
    const filas=j.filas||[];
    renderHistorialKpis(filas);
    if(!filas.length){el.innerHTML='<div class="empty">Sin resultados para ese filtro.</div>';return;}
    el.innerHTML=`<div style="overflow-x:auto"><table class="aud" id="histTable"><thead><tr>
      <th>ID</th><th>Fecha</th><th>Proveedor</th><th>Categoría</th><th>Concepto</th><th>Monto</th><th>Forma</th><th>Estatus</th><th>Aprobó</th><th>Pago</th>
    </tr></thead><tbody>${filas.map(r=>rowHistorial(r)).join('')}</tbody></table></div>`;
  }catch(e){el.innerHTML=`<div class="errbox">${e.message}</div>`;}
}
function rowHistorial(r){
  const [id,fechaSol,solId,solNombre,proveedor,categoria,concepto,monto,moneda,forma,fechaReq,factura,liga,urgencia,estatus,aprobadoPor,fechaAprob,motivoRech,fechaPago,refPago]=r;
  const pillClass=ESTATUS_PILL[estatus]||'p-pend';
  const accionCol = estatus==='Aprobado' ? `<button class="mini-btn info no-pdf" onclick="marcarPagado('${id}')">Marcar pagado</button>` : (fechaPago?`${fechaPago}${refPago?' · '+refPago:''}`:'–');
  return `<tr>
    <td>${id}</td><td>${fechaSol||'–'}</td><td>${proveedor}</td><td>${categoria}</td><td>${concepto}</td>
    <td class="num">$${money(monto)}</td><td>${forma}</td>
    <td><span class="pill ${pillClass}">${estatus}</span>${estatus==='Rechazado'&&motivoRech?`<div style="font-size:10.5px;color:var(--cactus);margin-top:3px">${motivoRech}</div>`:''}</td>
    <td>${aprobadoPor||'–'}</td><td>${accionCol}</td>
  </tr>`;
}
function renderHistorialKpis(filas){
  const hoy=new Date();const mesActual=hoy.toISOString().slice(0,7);
  let pagadoMes=0,pendiente=0,aprobadoNoPagado=0;const porCat={};
  filas.forEach(r=>{
    const [,,,,,categoria,,monto,,,,,,,estatus,,,,,fechaPago]=r;
    const m=num(monto);
    if(estatus==='Pagado' && fechaPago && String(fechaPago).slice(0,7)===mesActual) pagadoMes+=m;
    if(estatus==='Pendiente') pendiente+=m;
    if(estatus==='Aprobado') aprobadoNoPagado+=m;
    if(estatus!=='Rechazado'){porCat[categoria]=(porCat[categoria]||0)+m;}
  });
  let topCat='–',topVal=0;
  Object.keys(porCat).forEach(c=>{if(porCat[c]>topVal){topVal=porCat[c];topCat=c;}});
  document.getElementById('historialKpis').innerHTML=`<div class="kpis">
    <div class="kpi"><div class="k-lbl">Pagado este mes</div><div class="k-val">$${money(pagadoMes)}</div></div>
    <div class="kpi"><div class="k-lbl">Pendiente de aprobar</div><div class="k-val">$${money(pendiente)}</div></div>
    <div class="kpi"><div class="k-lbl">Aprobado por pagar</div><div class="k-val">$${money(aprobadoNoPagado)}</div></div>
    <div class="kpi"><div class="k-lbl">Categoría top</div><div class="k-val" style="font-size:15px">${topCat}</div><div class="k-sub">$${money(topVal)}</div></div>
  </div>`;
}
function pdfHistorial(){
  const el=document.getElementById('historialBody');
  if(!el||!el.innerHTML.trim()||el.querySelector('.empty')){alert('Primero carga un rango de fechas.');return;}
  const clon=el.cloneNode(true);
  clon.querySelectorAll('.no-pdf').forEach(n=>n.remove());
  const w=window.open('','_blank','width=1000,height=650');
  if(!w){alert('Permite las ventanas emergentes para descargar el PDF.');return;}
  const desde=document.getElementById('hDesde').value||'', hasta=document.getElementById('hHasta').value||'';
  w.document.write('<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Pagos Casa Yuma</title>'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">'+
    '<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">'+
    '<style>body{font-family:"Spline Sans Mono",monospace;background:#F5F1E6;padding:24px;color:#20302f}h1{font-family:"Fraunces",serif;font-size:20px;color:#88285C}.pdf-head{display:flex;gap:12px;border-bottom:2px solid #88285C;padding-bottom:12px;margin-bottom:18px}.pdf-head .date{margin-left:auto;font-size:12px;color:#72785E}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#72785E;color:#F5F1E6;text-align:left;padding:8px}td{padding:7px 8px;border-bottom:1px solid #d8cfb8}@media print{@page{size:A4 landscape;margin:12mm}}</style>'+
    '</head><body><div class="pdf-head"><h1>Casa Yuma</h1><span>Pagos a Proveedores</span><span class="date">'+desde+' – '+hasta+'</span></div>'+
    clon.outerHTML+'</body></html>');
  w.document.close();
  setTimeout(function(){w.focus();w.print();},600);
}

// ————— Proveedores —————
async function cargarProveedores(){
  const el=document.getElementById('proveedoresBody');
  el.innerHTML='<div class="loading"><div class="spinner"></div>Cargando…</div>';
  try{
    const j=await apiGet({accion:'proveedores_list',id:SESSION.id,pin:SESSION.pin});
    if(!j.ok)throw new Error(j.error);
    PROVEEDORES_CACHE=j.filas||[];
    const dl=document.getElementById('pProveedorList');
    if(dl)dl.innerHTML=PROVEEDORES_CACHE.map(p=>`<option value="${p[1]}">`).join('');
    el.innerHTML=`
      <div class="section-eyebrow">Nuevo proveedor</div>
      <div class="cap-form" style="margin-bottom:30px">
        <div class="cap-grid">
          <div class="fld"><label>Nombre</label><input id="vNombre"></div>
          <div class="fld"><label>Categoría</label><select id="vCategoria">${CATEGORIAS.map(c=>`<option>${c}</option>`).join('')}</select></div>
          <div class="fld"><label>Contacto</label><input id="vContacto" placeholder="Nombre de contacto"></div>
          <div class="fld"><label>Teléfono</label><input id="vTelefono"></div>
          <div class="fld"><label>Email</label><input id="vEmail" type="email"></div>
          <div class="fld"><label>RFC</label><input id="vRfc"></div>
          <div class="fld cap-full"><label>CLABE / Cuenta</label><input id="vClabe"></div>
        </div>
        <button class="cap-btn" onclick="crearProveedor()">Guardar proveedor</button>
        <div id="provMsg"></div>
      </div>
      <div class="section-eyebrow">Catálogo (${PROVEEDORES_CACHE.length})</div>
      <div style="overflow-x:auto"><table class="aud"><thead><tr><th>Nombre</th><th>Categoría</th><th>Contacto</th><th>Teléfono</th><th>Email</th><th>RFC</th></tr></thead><tbody>
      ${PROVEEDORES_CACHE.map(p=>`<tr><td>${p[1]}</td><td>${p[2]||''}</td><td>${p[3]||''}</td><td>${p[4]||''}</td><td>${p[5]||''}</td><td>${p[6]||''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Aún no hay proveedores registrados.</td></tr>'}
      </tbody></table></div>`;
  }catch(e){el.innerHTML=`<div class="errbox">${e.message}</div>`;}
}
async function crearProveedor(){
  const nombre=document.getElementById('vNombre').value.trim();
  const msg=document.getElementById('provMsg');
  if(!nombre){msg.innerHTML='<div class="errbox">El nombre es obligatorio.</div>';return;}
  const body={accion:'proveedores_crear',id:SESSION.id,pin:SESSION.pin,
    nombre,categoria:document.getElementById('vCategoria').value,
    contacto:document.getElementById('vContacto').value.trim(),
    telefono:document.getElementById('vTelefono').value.trim(),
    email:document.getElementById('vEmail').value.trim(),
    rfc:document.getElementById('vRfc').value.trim(),
    clabe:document.getElementById('vClabe').value.trim()};
  msg.innerHTML='<div class="okmsg">Guardando…</div>';
  try{const j=await apiPost(body);if(!j.ok){msg.innerHTML=`<div class="errbox">${j.error}</div>`;return;}cargarProveedores();}catch(e){msg.innerHTML='<div class="errbox">No se pudo guardar.</div>';}
}
</script>

:root{
  --blue:#2C6E73; --gold:#E1D082; --wool:#EAE3CD; --cactus:#72785E; --purple:#88285C;
  --ink:#20302f; --paper:#F5F1E6; --line:#d8cfb8;
  --ok:#3f7d4e; --warn:#b5892a; --bad:#a8324a;

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--mono);background:var(--paper);color:var(--ink);line-height:1.5;font-size:15px}
h1,h2,h3{font-family:var(--disp);font-weight:600;line-height:1.1}
a{color:var(--blue)} button{font-family:var(--mono);cursor:pointer}
#gate{position:fixed;inset:0;background:var(--blue);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}

.gate-eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--cactus);margin-bottom:12px}
.gate-card h1{font-size:32px;color:var(--blue);margin-bottom:4px;font-weight:900}
.gate-sub{font-size:12.5px;color:var(--cactus);margin-bottom:26px}
.fld{text-align:left;margin-bottom:16px}
.fld label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cactus);margin-bottom:6px}
.fld select,.fld input{width:100%;font-family:var(--mono);font-size:16px;padding:11px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px;outline:none}
.fld select:focus,.fld input:focus{border-color:var(--blue)}
.fld input.pin{letter-spacing:.4em;text-align:center;font-size:22px}
.gate-btn{margin-top:8px;width:100%;background:var(--blue);color:var(--paper);border:none;padding:14px;font-size:13px;letter-spacing:.15em;text-transform:uppercase;border-radius:2px;transition:background .2s}
.gate-btn:hover{background:#255a5e}
.gate-btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line);margin-top:10px}
.gate-err{color:var(--bad);font-size:12.5px;margin-top:14px;min-height:18px}
.gate-info{color:var(--cactus);font-size:12px;margin-top:12px;min-height:16px}
.hidden{display:none!important}
#app{display:none;min-height:100vh}
header.top{background:var(--blue);color:var(--paper);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.top h1{font-size:20px;font-weight:900}
.top .who{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:14px}
.top .who button{background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--paper);padding:5px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-radius:2px}
nav.tabs{background:var(--blue);border-top:1px solid rgba(255,255,255,.12);padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:transparent;border:none;color:rgba(255,255,255,.7);padding:12px 18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.active{color:var(--paper);border-bottom-color:var(--gold)}
main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
.view{display:none}.view.active{display:block}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.ctl label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cactus)}
select{font-family:var(--mono);font-size:14px;padding:9px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:2px;outline:none}
select:focus{border-color:var(--blue)}
.section-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--cactus);margin:26px 0 10px}
.dr-table{width:100%;border-collapse:collapse;font-size:13.5px}
.dr-table{min-width:640px}.dr-table td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.dr-table td.lbl{color:var(--ink)}
.dr-table td.val{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.dr-table tr.head td{background:var(--blue);color:var(--paper);font-size:11px;letter-spacing:.14em;text-transform:uppercase;border:none}
.dr-table tr.sub td.lbl{padding-left:24px;color:var(--cactus)}
.dr-table tr.total td{background:var(--wool);font-weight:600;border-top:2px solid var(--blue);border-bottom:none}
.dr-table tr.total td.lbl{letter-spacing:.05em;text-transform:uppercase;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.kpi{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:2px;padding:15px 16px}
.kpi .k-lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cactus);margin-bottom:6px}
.kpi .k-val{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:11px;color:var(--cactus);margin-top:2px}
.aud{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.aud th{background:var(--cactus);color:var(--paper);text-align:left;padding:9px 11px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.aud td{padding:8px 11px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.aud tr:hover td{background:#efe9d8}
.aud td.num{text-align:right}
.aud .inactivo td{background:#e6e2d5;color:#8a8578}
.aud .clickrow{cursor:pointer}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.pill.void{background:#f2d6dc;color:var(--bad)} .pill.adj{background:#f2e6cf;color:var(--warn)}
.badge{font-size:16px}.sem-ok{color:var(--ok)}.sem-warn{color:var(--warn)}.sem-bad{color:var(--bad)}
.cap-form{background:#fff;border:1px solid var(--line);border-radius:3px;padding:24px;max-width:560px}
.cap-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.cap-grid .fld{margin-bottom:0}
.cap-full{grid-column:1/-1}
.cap-btn{background:var(--blue);color:var(--paper);border:none;padding:13px 24px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:2px}
.cap-btn:hover{background:#255a5e}
.just-input{width:100%;font-family:var(--mono);font-size:13px;padding:8px;border:1px solid var(--line);border-radius:2px;resize:vertical;min-height:40px}
.just-btn{background:var(--purple);color:#fff;border:none;padding:6px 12px;font-size:11px;border-radius:2px;margin-top:5px;letter-spacing:.06em}
.loading,.empty{text-align:center;padding:50px 20px;color:var(--cactus);font-size:13px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{background:#f2d6dc;border:1px solid var(--bad);color:var(--bad);padding:14px 16px;border-radius:2px;font-size:13px;margin:20px 0}
.okmsg{background:#e0efe0;border:1px solid var(--ok);color:var(--ok);padding:10px 14px;border-radius:2px;font-size:13px;margin:12px 0}

.cap-h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600;margin:18px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.cap-sub{font-size:12px;color:var(--cactus);margin:-6px 0 8px}
.cuadre-cat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cactus);margin:12px 0 4px}
.line{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;gap:12px;border-bottom:1px solid rgba(0,0,0,.05)}
.note{font-size:11.5px;color:var(--cactus);margin-top:18px;font-style:italic}
@media(max-width:560px){.dr-table td{padding:8px 6px;font-size:12.5px}main{padding:20px 12px 70px}.cap-grid{grid-template-columns:1fr}}
.tipo-chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.t-void{background:#f2d6dc;color:var(--bad)}
.t-refund{background:#e6d9ec;color:var(--purple)}
.t-adj{background:#f2e6cf;color:var(--warn)}
.t-otro{background:#dce4dc;color:var(--cactus)}
@media(max-width:640px){.libro-cols{grid-template-columns:1fr !important}}
.net{font-size:13.5px;font-weight:600}.bru{font-size:10px;color:var(--cactus);font-weight:400}.dim{color:#a9a28f}

<body>
<div id="gate">
  <div class="gate-card">
    <div class="gate-eyebrow">Puerto Escondido · Oaxaca</div>
    <h1>Casa Yuma</h1>
    <div class="gate-sub">Portal de Administración y Auditoría</div>
    <div id="step1">
      <div class="fld"><label>Colaborador</label><select id="userSel"></select></div>
      <div class="fld"><label>Número de colaborador</label><input id="userId" type="text" placeholder="CY000" autocomplete="off"></div>
      <button class="gate-btn" onclick="identificar()">Continuar</button>
    </div>
    <div id="step2" class="hidden">
      <div class="fld"><label id="pinLabel">Tu PIN</label><input id="pinInput" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off"></div>
      <div id="pinInput2wrap" class="fld hidden"><label>Confirma tu PIN</label><input id="pinInput2" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off"></div>
      <button class="gate-btn" id="pinBtn" onclick="pinSubmit()">Entrar</button>
      <button class="gate-btn ghost" onclick="volverStep1()">← Cambiar colaborador</button>
    </div>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-info" id="gateInfo"></div>
  </div>
</div>
<div id="app">
  <header class="top">
    <h1>Casa Yuma · Auditoría</h1>
    <div class="who"><span id="whoLabel"></span><button onclick="logout()">Salir</button></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main>
    <section class="view" id="v-daily"><div class="ctl"><label for="daySel">Fecha</label><button class="cap-btn" style="padding:9px 12px" onclick="cambiarDia(-1)">◀</button><input id="daySel" type="date" onchange="renderDaily()" style="max-width:165px"><button class="cap-btn" style="padding:9px 12px" onclick="cambiarDia(1)">▶</button><button class="cap-btn" style="padding:9px 16px" onclick="descargarPDF()">PDF</button></div><div id="dailyBody"></div></section>
    <section class="view" id="v-captura"><div id="capturaBody"></div></section>
    <section class="view" id="v-historial"><div id="historialBody"><div class="loading"><div class="spinner"></div>Cargando…</div></div></section>
    <section class="view" id="v-auditoria">
      <div class="ctl"><label for="audFecha">Fecha</label><input id="audFecha" type="date" onchange="cargarAuditoria()"><button class="cap-btn" style="padding:9px 16px" onclick="cargarAuditoria()">Ver</button><button class="cap-btn" style="padding:9px 16px" onclick="pdfDe('auditoriaBody','Auditoria_CasaYuma',document.getElementById('audFecha').value)">PDF</button></div>
      <div id="auditoriaBody"><div class="empty">Elige una fecha para ver la auditoría del día.</div></div>
    </section>
    <section class="view" id="v-ajustes"><div id="ajustesBody"><div class="loading"><div class="spinner"></div>Cargando…</div></div></section>
    <section class="view" id="v-ingpago">
      <div class="ctl">
        <label for="ivpDesde">Desde</label><input id="ivpDesde" type="date">
        <label for="ivpHasta">Hasta</label><input id="ivpHasta" type="date">
        <button class="cap-btn" style="padding:9px 16px" onclick="cargarIngPago()">Ver</button>
        <button class="cap-btn no-pdf" style="padding:9px 16px" onclick="pdfDe('ingpagoBody','IngresoVsPago_CasaYuma',document.getElementById('ivpDesde').value,'landscape')">PDF</button>
      </div>
      <div id="ingpagoBody"><div class="empty">Elige una fecha (o rango) para detectar cargos sin contrapago.</div></div>
    </section>
    <section class="view" id="v-propinas">
      <div class="ctl">
        <label>Modo</label>
        <select id="propModo" onchange="cambiarModoProp()"><option value="dia">Un día</option><option value="rango">Rango (quincena)</option></select>
      </div>
      <div class="ctl" id="propCtlDia"><label for="propFecha">Fecha</label><input id="propFecha" type="date" onchange="cargarPropinas()"><button class="cap-btn" style="padding:9px 16px" onclick="cargarPropinas()">Ver</button></div>
      <div class="ctl" id="propCtlRango" style="display:none">
        <label>Desde</label><input id="propDesde" type="date">
        <label>Hasta</label><input id="propHasta" type="date">
        <button class="cap-btn" style="padding:9px 16px" onclick="cargarPropinasRango()">Ver</button>
        <button class="cap-btn no-pdf" style="padding:9px 16px" onclick="descargarPropinasExcel()">Descargar Excel</button>
      </div>
      <div id="propinasBody"><div class="empty">Elige una fecha (o rango) para ver el desglose de propinas.</div></div>
    </section>
  </main>
</div>

const money=n=>(isNaN(n)||n===''||n==null)?'–':Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const int=n=>(isNaN(n)||n==='')?'–':Number(n).toLocaleString('es-MX');
const num=v=>{const x=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(x)?0:x;};
const pct=v=>{ if(v==='' ||v==null) return '–'; let s=String(v).trim(); if(s.includes('%')) return s; let x=parseFloat(s.replace(/[^0-9.\-]/g,'')); if(isNaN(x)) return '–'; if(x<=1) x=x*100; return x.toLocaleString('es-MX',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; };
let SESSION=null,PENDING=null;
(function(){const sel=document.getElementById('userSel');CONFIG.USERS.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.n;sel.appendChild(o);});sel.onchange=()=>{document.getElementById('userId').value=sel.value;};document.getElementById('userId').value=sel.value;})();
async function apiGet(params){params=Object.assign({},params,{_ts:Date.now()});const qs=Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');const res=await fetch(CONFIG.WEBAPP_URL+'?'+qs,{cache:'no-store'});return res.json();}
async function apiPost(body){const res=await fetch(CONFIG.WEBAPP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return res.json();}
async function identificar(){
  const id=document.getElementById('userId').value.trim().toUpperCase();
  const err=document.getElementById('gateErr'),info=document.getElementById('gateInfo');
  err.textContent='';info.textContent='Verificando…';
  try{
    const j=await apiGet({accion:'login',id:id});
    if(!j.ok){info.textContent='';err.textContent=j.error;return;}
    PENDING={id:j.id,nombre:j.nombre,nivel:j.nivel,tienePin:j.tienePin};info.textContent='';
    document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');
    if(j.tienePin){document.getElementById('pinLabel').textContent='Tu PIN · '+j.nombre.split(' ')[0];document.getElementById('pinInput2wrap').classList.add('hidden');document.getElementById('pinBtn').textContent='Entrar';}
    else{document.getElementById('pinLabel').textContent='Crea tu PIN · '+j.nombre.split(' ')[0];document.getElementById('pinInput2wrap').classList.remove('hidden');document.getElementById('pinBtn').textContent='Crear PIN y entrar';info.textContent='Primera vez: define un PIN de 4 a 6 dígitos.';}
    document.getElementById('pinInput').focus();
  }catch(e){info.textContent='';err.textContent='No se pudo conectar.';}
}
function volverStep1(){document.getElementById('step2').classList.add('hidden');document.getElementById('step1').classList.remove('hidden');document.getElementById('gateErr').textContent='';document.getElementById('gateInfo').textContent='';document.getElementById('pinInput').value='';document.getElementById('pinInput2').value='';}
async function pinSubmit(){
  const pin=document.getElementById('pinInput').value.trim();const err=document.getElementById('gateErr');err.textContent='';
  if(!/^\d{4,6}$/.test(pin)){err.textContent='El PIN debe ser de 4 a 6 dígitos.';return;}
  try{
    let j;
    if(PENDING.tienePin){j=await apiGet({accion:'entrar',id:PENDING.id,pin:pin});}
    else{const pin2=document.getElementById('pinInput2').value.trim();if(pin!==pin2){err.textContent='Los PIN no coinciden.';return;}j=await apiPost({accion:'crearPin',id:PENDING.id,pin:pin});}
    if(!j.ok){err.textContent=j.error;return;}
    SESSION={id:PENDING.id,pin:pin,nombre:j.nombre||PENDING.nombre,nivel:j.nivel||PENDING.nivel};entrarApp();
  }catch(e){err.textContent='No se pudo conectar.';}
}

document.getElementById('pinInput2').addEventListener('keydown',e=>{if(e.key==='Enter')pinSubmit();});

function entrarApp(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';document.getElementById('whoLabel').textContent=SESSION.nombre+' · '+SESSION.nivel.toUpperCase();buildTabs();loadAll();}

const TABDEFS=[
  {id:'daily',label:'Daily Report',levels:['read','capture','full','superfull']},
  {id:'captura',label:'Cuadre diario',levels:['capture','full','superfull']},
  {id:'historial',label:'Historial cuadres',levels:['full','superfull']},

];
function buildTabs(){const tabs=document.getElementById('tabs');tabs.innerHTML='';const allowed=TABDEFS.filter(t=>t.levels.includes(SESSION.nivel));allowed.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.label;b.dataset.view=t.id;if(i===0)b.classList.add('active');b.onclick=()=>switchView(t.id,b);tabs.appendChild(b);});switchView(allowed[0].id,tabs.querySelector('button'));}
function switchView(id,btn){document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('v-'+id).classList.add('active');}
let DATA={captura:null,ajustes:null,control:null,presupuesto:null,cuadres:null};
async function loadAll(){
  try{const j=await apiGet({accion:'captura',id:SESSION.id,pin:SESSION.pin});if(!j.ok) throw new Error(j.error);
    try{const jp=await apiGet({accion:'presupuesto',id:SESSION.id,pin:SESSION.pin});if(jp.ok)DATA.presupuesto=jp.filas;}catch(_){}
    initDaily(j);}
  catch(e){document.getElementById('dailyBody').innerHTML=`<div class="errbox">${e.message}</div>`;}
  if(SESSION.nivel!=='read')renderCaptura();
  if(SESSION.nivel==='full'||SESSION.nivel==='superfull'){
    try{const j=await apiGet({accion:'ajustes',id:SESSION.id,pin:SESSION.pin});if(j.ok){DATA.ajustes=j.filas;renderAjustes();}}
    catch(e){document.getElementById('ajustesBody').innerHTML=`<div class="errbox">${e.message}</div>`;}
    try{const j=await apiGet({accion:'cuadres',id:SESSION.id,pin:SESSION.pin});if(j.ok){DATA.cuadres=j.filas;renderHistorial();}}
    catch(e){document.getElementById('historialBody').innerHTML=`<div class="errbox">${e.message}</div>`;}
  }
}
const MESES={ene:0,jan:0,feb:1,mar:2,abr:3,apr:3,may:4,jun:5,jul:6,ago:7,aug:7,sep:8,oct:9,nov:10,dic:11,dec:11};
function parseFecha(s){s=String(s).trim();if(!s)return null;let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return{y:+m[1],m:+m[2]-1,d:+m[3]};m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);if(m)return{y:+m[3]<100?2000+ +m[3]:+m[3],m:+m[2]-1,d:+m[1]};m=s.match(/^(\d{1,2})[\-\s]([A-Za-z]{3})/);if(m){const mm=MESES[m[2].toLowerCase()];if(mm!=null)return{y:2026,m:mm,d:+m[1]};}return null;}
const ROOMS=25;
// ── Daily Report v2: lee DAILY (neto) y DAILY_BRUTO por clave de columna, no por índice ──
let CAP={N:{},B:{},keys:[]};
function initDaily(j){
  if(!j||!Array.isArray(j.cols)||!Array.isArray(j.neto)){
    document.getElementById('dailyBody').innerHTML='<div class="errbox">El portal está conectado al backend VIEJO (no trae DAILY). Revisa que WEBAPP_URL sea la URL de la App web de la hoja nueva y que hayas implementado una versión nueva.</div>'; return; }
  const toObj=r=>{const o={};j.cols.forEach((c,i)=>o[c]=r[i]);return o;};
  const idx=(rows,dest)=>rows.forEach(r=>{const o=toObj(r);const f=String(o.fecha||'').slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(f))dest[f]=o;});
  CAP={N:{},B:{},keys:[]}; idx(j.neto,CAP.N); idx(j.bruto,CAP.B);
  CAP.keys=Object.keys(CAP.N).sort();
  let def=CAP.keys[CAP.keys.length-1];
  for(let i=CAP.keys.length-1;i>=0;i--){ if(num(CAP.N[CAP.keys[i]].totHotel)!==0){def=CAP.keys[i];break;} }
  const sel=document.getElementById('daySel');
  if(CAP.keys.length){sel.min=CAP.keys[0];sel.max=CAP.keys[CAP.keys.length-1];sel.value=def;}
  renderDaily();
}
function fechaActualPos(){const k=document.getElementById('daySel').value;let p=-1;for(let i=0;i<CAP.keys.length;i++){if(CAP.keys[i]<=k)p=i;else break;}return p<0?0:p;}
function cambiarDia(d){if(!CAP.keys.length)return;const p=Math.max(0,Math.min(CAP.keys.length-1,fechaActualPos()+d));document.getElementById('daySel').value=CAP.keys[p];renderDaily();}
const SUM_KEYS=['anulado','descPoster','abPoster','propPoster','habExtras','vendidas','cortesia','usoCasa','intercambio','ocupSinUC','ocupados','hab','noShow','early','late','pet','miscOtros','spa','lav','transp','dayPassN','dayPass','activ','well','misc','shop','propinas','ajustes','totDiv','alim','beb','rest','pax','eventos','minibar','cigarros','totAB','totHotel','sinClasif','iva','ish','sisCB','exclCB','cbPoster','sisPoster','exclPoster'];
function acumular(src,fSel,modo){
  const a={dias:0}; SUM_KEYS.forEach(k=>a[k]=0);
  CAP.keys.forEach(k=>{const f=parseFecha(k); if(f.y!==fSel.y) return;
    const ok=modo==='dia'?(f.m===fSel.m&&f.d===fSel.d):modo==='mtd'?(f.m===fSel.m&&f.d<=fSel.d):(f.m<fSel.m||(f.m===fSel.m&&f.d<=fSel.d));
    if(!ok) return; a.dias++; const r=src[k]||{}; SUM_KEYS.forEach(c=>a[c]+=num(r[c]));});
  a.ocupPct=a.dias?a.ocupados/(ROOMS*a.dias):0; a.adr=a.ocupados?a.hab/a.ocupados:0;
  a.revpar=a.dias?a.hab/(ROOMS*a.dias):0; a.cheque=a.pax?a.rest/a.pax:0;
  return a;
}
const PPTO_NOMBRE={ocupados:'Total cuartos ocupados',ocupPct:'% de Ocupación',adr:'ADR',revpar:'RevPAR',hab:'Total Cuartos (Ingreso Hab.)',
  spa:'Spa',well:'Wellness',lav:'Lavandería',transp:'Transportación (La Ola)',dayPass:'Day Pass',activ:'Actividades',misc:'Misceláneos',
  shop:'Shop / Boutique',totDiv:'TOTAL DIVISIÓN CUARTOS',alim:'Restaurante Alimentos',beb:'Restaurante Bebidas',
  rest:['Restaurante Alimentos','Restaurante Bebidas'],eventos:'Total Eventos',minibar:'Total Minibar',totAB:'TOTAL A&B',totHotel:'TOTAL HOTEL'};
// [etiqueta, clave, tipo(m=dinero,i=entero,p=%,r=tasa $), clase]
const SECCIONES=[
  ['Habitaciones',[['% Ocupación','ocupPct','p'],['ADR','adr','r'],['RevPAR','revpar','r'],
    ['Hab. vendidas','vendidas','i','sub'],['Cortesía','cortesia','i','sub'],['Uso casa','usoCasa','i','sub'],['Intercambio','intercambio','i','sub'],
    ['Ocupados s/ uso casa','ocupSinUC','i'],['Total cuartos ocupados','ocupados','i','total'],['Ingreso habitaciones (tarifas)','hab','m','total'],['Otros cargos de habitación (extra person, upgrade…)','habExtras','m','sub']]],
  ['División cuartos',[['Spa','spa','m','sub'],['Lavandería','lav','m','sub'],['Transportación','transp','m','sub'],
    ['Day Pass','dayPass','m','sub'],['Day Pass (#)','dayPassN','i','sub2'],['Actividades','activ','m','sub'],['Wellness','well','m','sub'],
    ['Misceláneos','misc','m','sub'],['No-Show','noShow','m','sub2'],['Early Check-In','early','m','sub2'],['Late Check-Out','late','m','sub2'],
    ['Pet Fee','pet','m','sub2'],['Otros','miscOtros','m','sub2'],['Shop / Boutique','shop','m','sub'],
    ['Ajustes y correcciones (informativo)','ajustes','m','info'],['Cargos anulados (informativo, se cancelan)','anulado','m','info'],
    ['Total división cuartos','totDiv','m','total']]],
  ['Restaurante',[['Alimentos','alim','m','sub'],['Bebidas','beb','m','sub'],['Total restaurante','rest','m','total'],['No. Pax','pax','i'],['Cheque promedio','cheque','r']]],
  ['Eventos · Minibar · Cigarros',[['Eventos','eventos','m','sub'],['Minibar','minibar','m','sub'],['Cigarros','cigarros','m','sub']]],
  ['Totales',[['Total A&B','totAB','m','total'],['TOTAL HOTEL','totHotel','m','total']]],
];
function pptoDe(nombre,mesCol){
  if(!DATA.presupuesto||!mesCol||!nombre) return null;
  if(Array.isArray(nombre)){let s=0,f=false;nombre.forEach(n=>{const v=pptoDe(n,mesCol);if(v!=null){s+=v;f=true;}});return f?s:null;}
  const nm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,''), t=nm(nombre);
  for(const r of DATA.presupuesto){ if(nm(r[0])===t) return num(r[mesCol]); } return null;
}
function renderDaily(){
  if(!CAP.keys.length){document.getElementById('dailyBody').innerHTML='<div class="empty">Sin datos todavía.</div>';return;}
  const key=CAP.keys[fechaActualPos()]; document.getElementById('daySel').value=key;
  const fS=parseFecha(key), mesCol=fS.m+1;
  const D={n:acumular(CAP.N,fS,'dia'),b:acumular(CAP.B,fS,'dia')}, M={n:acumular(CAP.N,fS,'mtd'),b:acumular(CAP.B,fS,'mtd')}, Y={n:acumular(CAP.N,fS,'ytd'),b:acumular(CAP.B,fS,'ytd')};
  const fP=v=>(v*100).toLocaleString('es-MX',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
  const fmt=(t,v)=>t==='p'?fP(v):(t==='i'?int(v):'$'+money(v));
  // neto grande; bruto chico debajo (solo dinero, y solo si difiere del neto)
  const celda=(t,P,k)=>{ const n=P.n[k], b=P.b[k]; const bru=(t==='m'||t==='r')&&Math.abs(b-n)>0.009?`<div class="bru">$${money(b)} bruto</div>`:'';
    return `<td class="val"><div class="net">${fmt(t,n)}</div>${bru}</td>`; };
  const varC=(t,real,pp)=>{ if(pp==null||pp===0) return '<td class="val dim">–</td><td class="val dim">–</td>';
    if(t==='p'&&Math.abs(pp)<=1) pp*=100; const r=t==='p'?real*100:real, dif=r-pp, col=dif>=0?'var(--ok)':'var(--bad)', sg=dif>=0?'+':'';
    const f=v=>t==='p'?v.toFixed(1)+'%':(t==='i'?int(v):'$'+money(v));
    return `<td class="val">${f(pp)}</td><td class="val" style="color:${col}">${sg}${f(dif)}<br><span style="font-size:10px">${sg}${(dif/pp*100).toFixed(1)}%</span></td>`; };
  const head=t=>`<tr class="head"><td>${t}</td><td class="val">Hoy</td><td class="val">MTD</td><td class="val">Ppto</td><td class="val">Var</td><td class="val">YTD</td></tr>`;
  let filas='';
  SECCIONES.forEach(([tit,rows])=>{ filas+=head(tit); rows.forEach(([lbl,k,t,cls])=>{
    filas+=`<tr class="${cls||''}"><td class="lbl">${lbl}</td>${celda(t,D,k)}${celda(t,M,k)}${varC(t,M.n[k],pptoDe(PPTO_NOMBRE[k],mesCol))}${celda(t,Y,k)}</tr>`; }); });
  const b=D.b;
  const cuadreSis = b.sisCB!==0 ? `
    <div class="section-eyebrow">Cuadre contra sistema · ${key}</div>
    <table class="aud"><tbody>
      <tr><td><strong>Cloudbeds · cargos del día (bruto)</strong></td><td class="num"><strong>$${money(b.sisCB)}</strong></td></tr>
      <tr><td>&nbsp;&nbsp;− Excluido (Paid Out, Paquetería)</td><td class="num">$${money(b.exclCB)}</td></tr>
      <tr><td>&nbsp;&nbsp;= Entra al reporte (incluye conceptos informativos)</td><td class="num">$${money(b.sisCB-b.exclCB)}</td></tr>
      <tr><td class="dim">Restaurante cargado a habitación (ya contado en Poster)</td><td class="num dim">$${money(b.cbPoster)}</td></tr>
      <tr><td class="dim">IVA · ISH (no son ingreso)</td><td class="num dim">$${money(b.iva)} · $${money(b.ish)}</td></tr>
      <tr><td><strong>Poster · ingresos del día (bruto, ya con descuentos)</strong></td><td class="num"><strong>$${money(b.sisPoster)}</strong></td></tr>
      <tr><td class="dim">&nbsp;&nbsp;Descuentos aplicados en Poster (ya restados)</td><td class="num dim">$${money(b.descPoster)}</td></tr>
      <tr><td>&nbsp;&nbsp;− No es venta (desayuno incluido, cortesías, propinas)</td><td class="num">$${money(b.exclPoster+b.propPoster)}</td></tr>
      <tr><td>&nbsp;&nbsp;= Restaurante + Eventos + Minibar + Cigarros (bruto)</td><td class="num">$${money(b.sisPoster-b.exclPoster-b.propPoster)} ${Math.abs((b.sisPoster-b.exclPoster-b.propPoster)-b.abPoster)<1?'<span class="sem-ok">✓</span>':'<span class="sem-bad">revisar</span>'}</td></tr>
    </tbody></table>
    <div class="note">Si algún concepto de Cloudbeds/Poster no coincide con tu reporte del sistema, compara contra estas líneas: son la suma exacta de lo que trae la API ese día.</div>` : '';
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="k-lbl">Ocupación</div><div class="k-val">${fP(D.n.ocupPct)}</div><div class="k-sub">${int(D.n.ocupados)} ocupados · MTD ${fP(M.n.ocupPct)}</div></div>
    <div class="kpi"><div class="k-lbl">ADR</div><div class="k-val">$${money(D.n.adr)}</div><div class="k-sub">MTD $${money(M.n.adr)}</div></div>
    <div class="kpi"><div class="k-lbl">Ingreso habitaciones</div><div class="k-val">$${money(D.n.hab)}</div><div class="k-sub">MTD $${money(M.n.hab)}</div></div>
    <div class="kpi"><div class="k-lbl">Total hotel (neto)</div><div class="k-val">$${money(D.n.totHotel)}</div><div class="k-sub">bruto $${money(D.b.totHotel)}</div></div>
  </div>`;
  document.getElementById('dailyBody').innerHTML=kpis+`<div class="section-eyebrow">Daily Report · ${key}</div>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="dr-table">${filas}</table></div>
    <div class="note">Número grande = NETO (sin IVA). Número chico = BRUTO, como aparece en Cloudbeds/Poster. Propinas y ajustes son informativos y no suman. Ocupación, ADR y RevPAR sobre ${ROOMS} cuartos; ocupados incluye cortesía, uso casa e intercambio. Day 1/Day 2 no cuentan como habitación: van a Day Pass.</div>`+cuadreSis;
}
function descargarPDF(){
  const fecha=document.getElementById('daySel').value||'';
  pdfDe('dailyBody','DailyReport_CasaYuma',fecha);
}
function pdfDe(idEl, prefijo, fecha, orient){
  const el=document.getElementById(idEl);
  if(!el || !el.innerHTML.trim() || el.querySelector('.empty')){ alert('Primero carga la información de una fecha.'); return; }
  // clonar el contenido y quitar los botones .no-pdf
  const clon=el.cloneNode(true);
  clon.querySelectorAll('.no-pdf').forEach(n=>n.remove());
  // abrir ventana de impresión con los estilos del portal (respeta variables CSS y colores)
  const w=window.open('','_blank','width=900,height=650');
  if(!w){ alert('Permite las ventanas emergentes para descargar el PDF.'); return; }

function tablaCQ(){
  const f=document.getElementById('cqFiltro').value, R=CQ.resultado||{};

  let items=CQ.items.filter(it=>it.monto!==0||it.forma!=='SINPAGO');
  if(f==='rev') items=items.filter(it=>it.estatus||it.cambiado||(malF&&it.forma==='T12')||(malR&&it.forma==='T3')||(malEF&&/^EF_/.test(it.forma))||(it.forma==='TRANSFER'&&it.estatus!=='Correcto - Validado'));
  else if(f==='EF') items=items.filter(it=>/^EF_/.test(it.forma));
  else if(f==='otros') items=items.filter(it=>['TRANSFER','OPENPAY','VCC','CARGOHAB','DEPOSITO','CORTESIA','USOCASA','CXC','POSTER','ANULADO'].indexOf(it.forma)>-1);
  else if(f!=='todos') items=items.filter(it=>it.forma===f);

    return `<tr${it.cambiado?' style="background:#fff6d6"':''}><td>${it.hora||'—'}</td><td>${it.origen}</td>
      <td>${it.concepto}<div style="font-size:10px;color:var(--cactus)">${[it.ref,it.nota,it.usuario].filter(Boolean).join(' · ')}</div></td>

      <td><select onchange="detCQ(${k},'forma',this.value)">${opF(it.forma)}</select>${it.cambiado?'<div style="font-size:10px;color:var(--cactus)">auto: '+CQ.formas[it.auto]+'</div>':''}</td>
      <td><select onchange="detCQ(${k},'estatus',this.value)">${opE(it.estatus)}</select></td>
      <td><input type="text" value="${(it.sol||'').replace(/"/g,'&quot;')}" placeholder="Solución" onchange="detCQ(${k},'sol',this.value)" style="min-width:150px">${it.por?`<div style="font-size:10px;color:var(--cactus)">${it.por}</div>`:''}</td></tr>`; }).join('');

    :`<div class="note">${f==='rev'?'Nada que revisar ✓':'Sin renglones.'}</div>`;
}
async function detCQ(k,campo,valor){

function pintarAjustes(){

  let rows=DATA.ajustes.slice(1).filter(r=>r[5]);

function concentradoUsuario(u, mesFiltro){
  let rows=DATA.ajustes.slice(1).filter(r=>String(r[5]||'').trim()===u);
  if(mesFiltro!=='Todos') rows=rows.filter(r=>{ const f=parseFecha(r[0]); return f && (f.y+'-'+String(f.m+1).padStart(2,'0'))===mesFiltro; });
  let total=0; rows.forEach(r=>total+=Math.abs(num(r[4])));

  // por MES (más reciente arriba)
  const M={};
  rows.forEach(r=>{ const f=parseFecha(r[0]); if(!f)return; const k=f.y+'-'+String(f.m+1).padStart(2,'0'); const t=(r[2]||'').toUpperCase(), m=Math.abs(num(r[4])); if(!M[k])M[k]={aN:0,aM:0,vN:0,vM:0}; if(t==='VOID'){M[k].vN++;M[k].vM+=m;}else{M[k].aN++;M[k].aM+=m;} });
  const meses=Object.keys(M).sort().reverse();
  const filaMes=meses.map(k=>{const d=M[k];return `<tr><td>${k}</td><td class="num">${d.aN}</td><td class="num">$${money(d.aM)}</td><td class="num">${d.vN}</td><td class="num">$${money(d.vM)}</td><td class="num"><strong>$${money(d.aM+d.vM)}</strong></td></tr>`;}).join('');

  // por CONCEPTO (col D = índice 3)
  const C={};
  rows.forEach(r=>{ const c=String(r[3]||'—').trim()||'—'; const m=Math.abs(num(r[4])); if(!C[c])C[c]={n:0,m:0}; C[c].n++; C[c].m+=m; });
  const conceptos=Object.keys(C).sort((a,b)=>C[b].m-C[a].m);
  const filaConcepto=conceptos.map(c=>`<tr><td>${c}</td><td class="num">${C[c].n}</td><td class="num">$${money(C[c].m)}</td></tr>`).join('');

  document.getElementById('ajustesTabla').innerHTML=`
    <div style="padding:14px 16px;background:var(--wool);border-radius:2px;margin-bottom:14px">
      <strong style="font-family:var(--disp);font-size:18px">${u}</strong>
      <div style="font-size:12px;color:var(--cactus);margin-top:4px">${rows.length} movimientos · Total $${money(total)}${mesFiltro!=='Todos'?' · '+mesFiltro:''}</div>
    </div>
    <div class="section-eyebrow">Concentrado por mes</div>
    <table class="aud"><thead><tr><th>Mes</th><th style="text-align:right"># Ajustes</th><th style="text-align:right">$ Ajustes</th><th style="text-align:right"># Voids</th><th style="text-align:right">$ Voids</th><th style="text-align:right">Total</th></tr></thead><tbody>${filaMes}</tbody></table>
    <div class="section-eyebrow" style="margin-top:22px">Desglose por concepto</div>
    <table class="aud"><thead><tr><th>Concepto</th><th style="text-align:right"># Veces</th><th style="text-align:right">Monto</th></tr></thead><tbody>${filaConcepto}</tbody></table>
    <div class="note">Cambia el usuario o pon "Todos" arriba para volver a la vista general.</div>`;
}

    pendHtml=`<div class="section-eyebrow" style="margin-top:22px">✓ Reservas con checkout y saldo pendiente</div><div class="note">Ninguna. ✓</div>`;
  }

  // Agencia (verificar liquidación)
  let agHtml='';
  if(R.agencia.length){
    const filas=R.agencia.map(p=>`<tr>
      <td>${p.reserva}</td><td>${p.huesped}</td><td style="text-align:center">${p.hab}</td><td style="text-align:center">${p.checkOut}</td>
      <td class="num">$${money(p.cargos)}</td><td class="num">$${money(p.pagos)}</td>
      <td class="num">$${money(p.saldo)}</td></tr>`).join('');
    agHtml=`<div class="section-eyebrow" style="margin-top:22px">Reservas de agencia — verificar liquidación (${R.agencia.length})</div>
      <table class="aud"><thead><tr><th>Reserva</th><th>Huésped</th><th style="text-align:center">Hab</th><th style="text-align:center">Check-out</th><th style="text-align:right">Cargado</th><th style="text-align:right">Pagado (VCC)</th><th style="text-align:right">Saldo</th></tr></thead><tbody>${filas}</tbody></table>
      <div class="note">Pago vía tarjeta virtual/OTA. El saldo puede liquidarse por la agencia aparte — verificar en el estado de cuenta de la OTA.</div>`;
  }

  // Micro-cargos (pruebas)
  let microHtml='';
  if(R.micro.length){
    const filas=R.micro.map(m=>`<tr><td>${m.fecha}</td><td>${m.concepto}</td><td class="num">$${money(m.monto)}</td><td>${m.usuario}</td><td>${m.reserva}</td></tr>`).join('');
    microHtml=`<div class="section-eyebrow" style="margin-top:22px">Micro-cargos ≤ $1 — posibles pruebas (${R.micro.length})</div>
      <table class="aud"><thead><tr><th>Fecha</th><th>Concepto</th><th style="text-align:right">Monto</th><th>Registró</th><th>Reserva</th></tr></thead><tbody>${filas}</tbody></table>
      <div class="note">Cargos de 1 centavo o menos, típicamente pruebas de catálogo. Conviene anularlos para limpiar.</div>`;
  }

  document.getElementById('ingpagoBody').innerHTML=`
    <div style="padding:16px;background:${nAlertas>0?'#faf0ef':'var(--wool)'};border-radius:2px;margin-bottom:14px;border:1px solid ${nAlertas>0?'var(--bad)':'var(--line)'}">
      <strong style="font-family:var(--disp);font-size:19px">Ingreso vs Pago · ${periodo}</strong>
      <div style="font-size:13px;margin-top:6px">${nAlertas>0?'<span style="color:var(--bad);font-weight:600">'+nAlertas+' alertas que requieren revisión</span>':'<span style="color:var(--ok);font-weight:600">Sin alertas — todo cuadra ✓</span>'}</div>
      <div style="font-size:11.5px;color:var(--cactus);margin-top:4px">Ventas de restaurante walk-in (con folio Poster): ${R.restaurante.n} · $${money(R.restaurante.total)} — normales, no requieren acción.</div>
    </div>
    ${anomHtml}
    ${pendHtml}
    ${agHtml}
    ${microHtml}`;
}
function cargarLibro(){
  const fecha=document.getElementById('libroFecha').value;
  if(!fecha){ document.getElementById('libroBody').innerHTML='<div class="empty">Elige una fecha.</div>'; return; }
  document.getElementById('libroBody').innerHTML='<div class="loading"><div class="spinner"></div>Cargando jornal del día…</div>';
  apiGet({accion:'libroDia',id:SESSION.id,pin:SESSION.pin,fecha:fecha}).then(j=>{
    if(!j.ok){ document.getElementById('libroBody').innerHTML=`<div class="errbox">${j.error}</div>`; return; }
    pintarLibro(j.libro);
  }).catch(e=>{ document.getElementById('libroBody').innerHTML='<div class="errbox">No se pudo consultar.</div>'; });
}
function pintarLibro(L){
  if(L.error){ document.getElementById('libroBody').innerHTML=`<div class="errbox">${L.error}</div>`; return; }
  window._LIBRO=L;
  // resumen: pagos por canal (conecta con el cuadre)
  const canalRows=L.canales.map(c=>`<tr><td>${c.canal}</td><td class="num">${c.n}</td><td class="num">$${money(c.monto)}</td></tr>`).join('');
  // grupos por clasificación (de dónde viene cada peso)
  const grupoRows=L.grupos.map(g=>{
    const excl=g.destino!=='Ingreso';
    return `<tr class="clickrow" onclick="filtrarLibro('${g.clasif.replace(/'/g,"\\'")}')" style="${excl?'opacity:.6':''}"><td>${g.clasif}<div style="font-size:10px;color:var(--cactus)">${g.destino}</div></td><td class="num">${g.n}</td><td class="num">$${money(g.monto)}</td></tr>`;
  }).join('');
  document.getElementById('libroBody').innerHTML=`
    <div style="padding:16px;background:var(--wool);border-radius:2px;margin-bottom:14px">
      <strong style="font-family:var(--disp);font-size:19px">Libro contable · ${L.fecha}</strong>
      <div style="font-size:13px;color:var(--ink);margin-top:6px">${L.totalMovimientos} movimientos · Cargos $${money(L.totalCargos)} · Pagos $${money(L.totalPagos)}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="libro-cols">
      <div>
        <div class="section-eyebrow">Pagos por canal (para el cuadre)</div>
        <table class="aud"><thead><tr><th>Canal</th><th style="text-align:right">#</th><th style="text-align:right">Monto</th></tr></thead><tbody>${canalRows||'<tr><td colspan=3>Sin pagos</td></tr>'}</tbody></table>
        <div class="note">Estos son los pagos que el cuadre concilia por canal.</div>
      </div>
      <div>
        <div class="section-eyebrow">De dónde viene (por clasificación)</div>
        <table class="aud"><thead><tr><th>Clasificación</th><th style="text-align:right">#</th><th style="text-align:right">Monto</th></tr></thead><tbody>${grupoRows}</tbody></table>
        <div class="note">Clic en una clasificación para filtrar los movimientos abajo.</div>
      </div>
    </div>
    <div class="ctl" style="margin-top:18px"><label>Ver movimientos</label><select id="libroFiltro" onchange="pintarLibroTabla()"><option value="Todos">Todas las clasificaciones</option>${L.grupos.map(g=>`<option value="${g.clasif}">${g.clasif}</option>`).join('')}</select></div>
    <div id="libroTabla"></div>`;
  pintarLibroTabla();
}
function filtrarLibro(clasif){
  document.getElementById('libroFiltro').value=clasif;
  pintarLibroTabla();
  document.getElementById('libroTabla').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function pintarLibroTabla(){
  const L=window._LIBRO; const filtro=document.getElementById('libroFiltro').value;
  const items=(filtro==='Todos')?L.items:L.items.filter(x=>x.clasif===filtro);
  const filas=items.map(it=>`<tr>
    <td>${it.hora}</td>
    <td>${it.concepto}</td>
    <td style="text-align:center">${it.cat}</td>
    <td>${it.clasif}</td>
    <td style="font-size:11px">${it.destino}</td>
    <td style="text-align:center">${it.folio||'—'}</td>
    <td style="text-align:center">${it.hab}</td>
    <td style="text-align:center">${it.reserva}</td>
    <td class="num" style="color:${it.monto<0?'var(--bad)':'inherit'}">$${money(it.monto)}</td>
  </tr>`).join('');
  document.getElementById('libroTabla').innerHTML=`
    <div class="section-eyebrow">Movimientos ${filtro!=='Todos'?'· '+filtro:'del día'} · ${items.length}</div>
    <div style="overflow-x:auto"><table class="aud"><thead><tr><th>Hora</th><th>Concepto</th><th style="text-align:center">Categoría</th><th>Clasificación</th><th>¿Suma al ingreso?</th><th style="text-align:center">Folio</th><th style="text-align:center">Hab</th><th style="text-align:center">Reserva</th><th style="text-align:right">Monto</th></tr></thead><tbody>${filas}</tbody></table></div>
    <div class="note">Jornal completo en vivo de Cloudbeds, con la misma clasificación del Daily Report y la pestaña MOVIMIENTOS. Montos en bruto, como en Cloudbeds.</div>`;
}
function cargarAuditoria(){
  const fecha=document.getElementById('audFecha').value;
  if(!fecha){ document.getElementById('auditoriaBody').innerHTML='<div class="empty">Elige una fecha.</div>'; return; }
  document.getElementById('auditoriaBody').innerHTML='<div class="loading"><div class="spinner"></div>Consultando Cloudbeds…</div>';
  apiGet({accion:'auditoriaDia',id:SESSION.id,pin:SESSION.pin,fecha:fecha}).then(j=>{
    if(!j.ok){ document.getElementById('auditoriaBody').innerHTML=`<div class="errbox">${j.error}</div>`; return; }
    pintarAuditoria(j.dia);
  }).catch(e=>{ document.getElementById('auditoriaBody').innerHTML='<div class="errbox">No se pudo consultar.</div>'; });
}
function pintarAuditoria(d){
  if(d.error){ document.getElementById('auditoriaBody').innerHTML=`<div class="errbox">${d.error}</div>`; return; }
  window._AUD=d;
  if(!d.items.length){ document.getElementById('auditoriaBody').innerHTML=`<div style="padding:14px 16px;background:var(--wool);border-radius:2px;margin-bottom:8px"><strong style="font-family:var(--disp);font-size:18px">Auditoría del ${d.fecha}</strong></div><div class="empty">Sin movimientos negativos este día. ✓</div>`; return; }
  // resumen por tipo
  const porTipo={}; d.items.forEach(it=>{ if(!porTipo[it.tipo])porTipo[it.tipo]={n:0,m:0}; porTipo[it.tipo].n++; porTipo[it.tipo].m+=it.monto; });
  const chips=Object.keys(porTipo).map(t=>`<span class="tipo-chip ${claseTipo(t)}">${t}: ${porTipo[t].n} · $${money(porTipo[t].m)}</span>`).join('');
  const opciones=['Todos'].concat(Object.keys(porTipo)).map(t=>`<option value="${t}">${t}</option>`).join('');
  document.getElementById('auditoriaBody').innerHTML=`
    <div style="padding:16px;background:var(--wool);border-radius:2px;margin-bottom:14px">
      <strong style="font-family:var(--disp);font-size:19px">Auditoría del ${d.fecha}</strong>
      <div style="font-size:13px;color:var(--ink);margin-top:6px">Total negativo del día: <strong style="color:var(--bad)">$${money(d.total)}</strong> · ${d.items.length} movimientos</div>
      <div style="margin-top:8px;font-size:11.5px;color:var(--cactus);border-top:1px solid var(--line);padding-top:8px">
        <div style="margin-bottom:4px">A dónde va cada peso negativo en el Daily Report:</div>
        ${(d.resumen||[]).map(r=>`<div>• ${r.destino}: <strong>$${money(r.monto)}</strong> (${r.n})</div>`).join('')}
      </div>
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">${chips}</div>
    </div>
    <div class="ctl"><label>Filtrar tipo</label><select id="audTipoFiltro" onchange="pintarTablaAud()">${opciones}</select></div>
    <div id="audTabla"></div>`;
  pintarTablaAud();
}
function claseTipo(t){ return t==='Anulación'?'t-void':t==='Reembolso'?'t-refund':t==='Ajuste'?'t-adj':'t-otro'; }
function pintarTablaAud(){
  const d=window._AUD; const filtro=document.getElementById('audTipoFiltro').value;
  const items=(filtro==='Todos')?d.items:d.items.filter(x=>x.tipo===filtro);
  const filas=items.map(it=>{
    const just=it.justificacion||'';
    const justCell=just
      ? `<div style="font-size:11px;color:var(--ok)">✓ ${just}<br><span style="color:var(--cactus)">${it.justificadoPor||''}</span></div>`
      : `<textarea class="just-input" id="ja_${it.idTx}" placeholder="¿Por qué?"></textarea><button class="just-btn" onclick="justificarAud('${it.idTx}')">Guardar</button>`;
    return `<tr>
      <td>${it.hora}</td>
      <td>${it.usuario}</td>
      <td><span class="tipo-chip ${claseTipo(it.tipo)}">${it.tipo}</span></td>
      <td>${it.concepto}</td>
      <td>${it.categoria}<div style="font-size:10px;color:var(--cactus)">${it.destino}</div></td>
      <td style="text-align:center">${it.hab}</td>
      <td style="text-align:center">${it.reserva}</td>
      <td class="num" style="color:var(--bad);font-weight:600">$${money(it.monto)}</td>
      <td style="min-width:170px">${justCell}</td></tr>`;
  }).join('');
  document.getElementById('audTabla').innerHTML=`
    <div style="overflow-x:auto"><table class="aud"><thead><tr>
      <th>Hora</th><th>Usuario</th><th>Tipo</th><th>Concepto</th><th>Categoría en el reporte</th><th style="text-align:center">Hab</th><th style="text-align:center">Reserva</th><th style="text-align:right">Monto</th><th>Justificación (por qué)</th>
    </tr></thead><tbody>${filas}</tbody></table></div>
    <div class="note">Todo monto negativo del día (sin contar pagos normales), con la misma clasificación del Daily Report. Una anulación que se cancela con su cargo no mueve ninguna categoría.</div>`;
}
async function justificarAud(idTx){
  const el=document.getElementById('ja_'+idTx); const texto=el.value.trim();
  if(!texto){ el.style.borderColor='var(--bad)'; return; }
  const it=(window._AUD.items||[]).find(x=>x.idTx===idTx)||{};
  el.disabled=true;
  try{
    const j=await apiPost({accion:'justificar',id:SESSION.id,pin:SESSION.pin,idTx:idTx,texto:texto,
      fecha:window._AUD.fecha,tipo:it.tipo||'',concepto:it.concepto||'',monto:it.monto||0});
    if(!j.ok){ alert(j.error); el.disabled=false; return; }
    // actualizar en memoria para que persista al filtrar
    if(it){ it.justificacion=texto; it.justificadoPor=j.por||SESSION.nombre; }
    el.parentElement.innerHTML=`<div style="font-size:11px;color:var(--ok)">✓ ${texto}<br><span style="color:var(--cactus)">${j.por||SESSION.nombre}</span></div>`;
  }catch(e){ alert('No se pudo guardar.'); el.disabled=false; }
}

// Control mensual: filas [fecha, cuadreGeneral, termFront, openpay, efvoFront, termRest, efvoRest, sinClasif]
function renderControl(){
  const rows=(DATA.control||[]); window._CTRL_ROWS=rows; const M={};
  rows.forEach(r=>{ const k=String(r[0]).slice(0,7); if(!M[k])M[k]={dias:0,sin:0,rev:0,sc:0}; const m=M[k]; m.dias++;
    if(r[1]==='SIN CAPTURA')m.sin++; else if(r[1]==='REVISAR')m.rev++; if(num(r[7])>0.01)m.sc++; });
  const keys=Object.keys(M).sort().reverse();
  if(!keys.length){document.getElementById('controlBody').innerHTML='<div class="empty">Sin datos de control aún.</div>';return;}
  const cell=v=>v>0?`<td class="num" style="background:#f2d6dc;color:var(--bad)">${v}</td>`:'<td class="num">0</td>';
  const body=keys.map(k=>{const m=M[k],t=m.sin+m.rev+m.sc;const sem=t===0?'🟢':t<=3?'🟡':'🔴';
    return `<tr class="clickrow" onclick="detalleMes('${k}')"><td>${k}</td><td class="num">${m.dias}</td>${cell(m.sin)}${cell(m.rev)}${cell(m.sc)}<td style="text-align:center">${sem}</td></tr>`;}).join('');
  document.getElementById('controlBody').innerHTML=`<div class="section-eyebrow">Control mensual</div>
    <table class="aud"><thead><tr><th>Mes</th><th style="text-align:right">Días</th><th style="text-align:right">Sin cuadre capturado</th><th style="text-align:right">Cuadre a revisar</th><th style="text-align:right">Con ingreso sin clasificar</th><th style="text-align:center">Semáforo</th></tr></thead><tbody>${body}</tbody></table>
    <div class="note">Clic en un mes para ver qué días tienen pendientes.</div><div id="ctrlDetBody"></div>`;
}
function detalleMes(mes){
  const est=v=>v==='REVISAR'?'<span class="tipo-chip t-void">Revisar</span>':v==='OK'?'<span style="color:var(--ok)">OK</span>':'<span class="dim">—</span>';
  const rows=(window._CTRL_ROWS||[]).filter(r=>String(r[0]).slice(0,7)===mes&&(r[1]!=='CUADRA'||num(r[7])>0.01));
  const body=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]==='SIN CAPTURA'?'<span class="tipo-chip t-adj">Sin captura</span>':est(r[1]==='CUADRA'?'OK':r[1])}</td>
    <td style="text-align:center">${est(r[2])}</td><td style="text-align:center">${est(r[3])}</td><td style="text-align:center">${est(r[4])}</td><td style="text-align:center">${est(r[5])}</td><td style="text-align:center">${est(r[6])}</td>
    <td class="num">${num(r[7])>0.01?'<span style="color:var(--bad)">$'+money(r[7])+'</span>':'–'}</td></tr>`).join('');
  document.getElementById('ctrlDetBody').innerHTML=rows.length?`<div class="section-eyebrow" style="margin-top:22px">${mes} · ${rows.length} días con pendientes</div>
    <div style="overflow-x:auto"><table class="aud"><thead><tr><th>Fecha</th><th>Cuadre</th><th>Term Front</th><th>Openpay</th><th>Efvo Front</th><th>Term Rest</th><th>Efvo Rest</th><th style="text-align:right">Sin clasificar</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="note">"Sin clasificar" = producto que no está en MAPA_ITEMS / MAPA_POSTER. Agrégalo ahí y usa "Verificar día" para actualizar.</div>`
    :`<div class="note" style="margin-top:14px">${mes}: todos los días cuadran ✓</div>`;
  document.getElementById('ctrlDetBody').scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body>
</html>

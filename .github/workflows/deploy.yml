name: Publicar Bitácora

# Se dispara solo con "git push" a main — nadie necesita correr nada a mano.
# Publica las Cloud Functions y las reglas de Firestore. Se autentica con
# Google Cloud vía Workload Identity Federation — sin ninguna llave
# descargada. El sitio (dashboard.html) ya lo publica GitHub Pages solo.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de las Cloud Functions
        working-directory: functions
        run: npm install

      - name: Autenticar con Google Cloud (sin llave)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Escribir variables no sensibles para las funciones
        run: |
          {
            echo "CLOUDBEDS_PROPERTY_ID=$CLOUDBEDS_PROPERTY_ID"
            echo "TOTAL_ROOMS=$TOTAL_ROOMS"
            echo "NOMINA_CSV_URL=$NOMINA_CSV_URL"
          } > functions/.env
        env:
          CLOUDBEDS_PROPERTY_ID: ${{ secrets.CLOUDBEDS_PROPERTY_ID }}
          TOTAL_ROOMS: ${{ secrets.TOTAL_ROOMS }}
          NOMINA_CSV_URL: ${{ secrets.NOMINA_CSV_URL }}

      - name: Guardar el token de Cloudbeds como Secret (Secret Manager)
        run: |
          printf '%s' "$CLOUDBEDS_TOKEN" | npx firebase-tools@15 functions:secrets:set CLOUDBEDS_TOKEN \
            --project "$FIREBASE_PROJECT_ID" --data-file - --force
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          CLOUDBEDS_TOKEN: ${{ secrets.CLOUDBEDS_TOKEN }}

      - name: Publicar (functions + reglas de Firestore)
        run: |
          npx firebase-tools@15 deploy --only functions,firestore:rules \
            --project "$FIREBASE_PROJECT_ID" --non-interactive --force
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

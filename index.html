<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Yuma · Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2C6E73; --gold:#E1D082; --wool:#EAE3CD; --cactus:#72785E; --purple:#88285C;
  --ink:#20302f; --paper:#F5F1E6; --line:#d8cfb8;
  --ok:#3f7d4e; --warn:#b5892a; --bad:#a8324a;
  --mono:'Spline Sans Mono',ui-monospace,monospace; --disp:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--mono);background:var(--paper);color:var(--ink);line-height:1.5;font-size:15px}
h1,h2,h3{font-family:var(--disp);font-weight:600;line-height:1.1}
a{color:var(--blue)} button{font-family:var(--mono);cursor:pointer}
#gate{position:fixed;inset:0;background:var(--blue);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.gate-card{background:var(--paper);border-radius:2px;max-width:400px;width:100%;padding:40px 32px;box-shadow:0 30px 80px rgba(0,0,0,.3);text-align:center}
.gate-eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--cactus);margin-bottom:12px}
.gate-card h1{font-size:32px;color:var(--blue);margin-bottom:4px;font-weight:900}
.gate-sub{font-size:12.5px;color:var(--cactus);margin-bottom:26px}
.fld{text-align:left;margin-bottom:16px}
.fld label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cactus);margin-bottom:6px}
.fld select,.fld input{width:100%;font-family:var(--mono);font-size:16px;padding:11px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px;outline:none}
.fld select:focus,.fld input:focus{border-color:var(--blue)}
.fld input.pin{letter-spacing:.4em;text-align:center;font-size:22px}
.gate-btn{margin-top:8px;width:100%;background:var(--blue);color:var(--paper);border:none;padding:14px;font-size:13px;letter-spacing:.15em;text-transform:uppercase;border-radius:2px;transition:background .2s}
.gate-btn:hover{background:#255a5e}
.gate-btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line);margin-top:10px}
.gate-err{color:var(--bad);font-size:12.5px;margin-top:14px;min-height:18px}
.gate-info{color:var(--cactus);font-size:12px;margin-top:12px;min-height:16px}
.hidden{display:none!important}
#app{display:none;min-height:100vh}
header.top{background:var(--blue);color:var(--paper);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.top h1{font-size:20px;font-weight:900}
.top .who{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:14px}
.top .who button{background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--paper);padding:5px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-radius:2px}
main{max-width:1080px;margin:0 auto;padding:40px 20px 80px}
.hero{margin-bottom:30px}
.hero .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--cactus);margin-bottom:8px}
.hero h2{font-size:26px;color:var(--ink)}
.hero p{color:var(--cactus);font-size:13px;margin-top:6px;max-width:520px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:3px;padding:24px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.card .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--cactus)}
.card h3{font-size:19px;color:var(--blue)}
.card p{font-size:12.5px;color:var(--cactus);line-height:1.55;flex-grow:1}
.card .go{align-self:flex-start;background:var(--blue);color:var(--paper);border:none;padding:10px 18px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:2px;text-decoration:none;display:inline-block}
.card .go:hover{background:#255a5e}
.card.locked{background:var(--wool);opacity:.75}
.card.locked h3{color:var(--cactus)}
.card.locked .go{background:var(--line);color:var(--cactus);pointer-events:none}
.card .lockbadge{position:absolute;top:16px;right:16px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--bad);background:#f2d6dc;padding:3px 9px;border-radius:20px}
.card.soon{border-style:dashed;background:transparent;align-items:flex-start;justify-content:center;min-height:150px}
.card.soon h3{color:var(--line);font-style:italic}
.card.soon p{color:#b9b096}
.stripe{height:4px;background:var(--gold);position:absolute;top:0;left:0;right:0}
.stripe.pagos{background:var(--purple)}
.stripe.req{background:var(--cactus)}
.stripe.aud{background:var(--blue)}
.stripe.inc{background:#C97B4A}
.stripe.bit{background:#8B6BAE}
.stripe.cal{background:#4E7C8C}
.card.pending{background:var(--wool);opacity:.9}
.card.pending h3{color:var(--cactus)}
.card.pending .go{background:var(--line);color:var(--cactus);pointer-events:none}
.pendbadge{position:absolute;top:16px;right:16px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--cactus);background:#fff;border:1px solid var(--line);padding:3px 9px;border-radius:20px}
.foot-note{margin-top:38px;font-size:11.5px;color:var(--cactus);font-style:italic;max-width:560px}
@media(max-width:560px){main{padding:28px 14px 60px}.hero h2{font-size:22px}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-eyebrow">Puerto Escondido · Oaxaca</div>
    <h1>Casa Yuma</h1>
    <div class="gate-sub">Portal de Finanzas</div>
    <div id="step1">
      <div class="fld"><label>Colaborador</label><select id="userSel"></select></div>
      <div class="fld"><label>Número de colaborador</label><input id="userId" type="text" placeholder="CY000" autocomplete="off"></div>
      <button class="gate-btn" onclick="identificar()">Continuar</button>
    </div>
    <div id="step2" class="hidden">
      <div class="fld"><label id="pinLabel">Tu PIN</label><input id="pinInput" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off"></div>
      <div id="pinInput2wrap" class="fld hidden"><label>Confirma tu PIN</label><input id="pinInput2" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off"></div>
      <button class="gate-btn" id="pinBtn" onclick="pinSubmit()">Entrar</button>
      <button class="gate-btn ghost" onclick="volverStep1()">← Cambiar colaborador</button>
    </div>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-info" id="gateInfo"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>Casa Yuma · Finanzas</h1>
    <div class="who"><span id="whoLabel"></span><button onclick="logout()">Salir</button></div>
  </header>
  <main>
    <div class="hero">
      <div class="eyebrow">Portal central</div>
      <h2>¿A dónde vamos?</h2>
      <p>Un solo acceso para los sistemas financieros de Casa Yuma. Cada módulo abre en su propia pestaña.</p>
    </div>
    <div class="grid" id="cardGrid"></div>
    <div class="foot-note" id="footNote"></div>
  </main>
</div>

<script>
// ————— Directorio de colaboradores (debe existir igual en la hoja "Usuarios" del backend) —————
const CONFIG={
  WEBAPP_URL:'https://script.google.com/macros/s/AKfycbwaQK50qEOFGvYxoy3wpS17uPzru1BQAs0TYwnEeD50M1fe3UfNWqcy1AwN1wDOlqM/exec',
  AUDITORIA_URL:'auditoria.html', // nombre/ubicación del archivo de Auditoría que ya tienes
  USERS:[
    {id:'CY035',n:'Aida Carrillo Patiño'},{id:'CY037',n:'Omar Emiliano de la Tejera Zamorano'},
    {id:'CY038',n:'Rodolfo Ramirez Pérez'},{id:'CY057',n:'Arleth Paola Anicacio Antúnez'},
    {id:'CY039',n:'Jesus Israel Castillo Hernández'},{id:'CY001',n:'Manuel Arturo Otazo Aponte'},
    {id:'CY064',n:'Jorge Guillén Garbuno'},{id:'CY070',n:'América Arróniz'},{id:'CY999',n:'Growthbis'},
    {id:'CY071',n:'José de Jesús Segoviano Farjas'},{id:'CY007',n:'Ricardo Ojeda Montuy'},
    {id:'CY062',n:'Lizette Lopez Lopez'},{id:'CY025',n:'Egbert Cruz García'},
    {id:'CY029',n:'Neri Angelina Contreras Pacheco'},{id:'CY060',n:'Rainier Jetzahi Ramírez Vasquez'},
    {id:'CY005',n:'Horacio Muñoz Martínez'},
  ],
};

// ————— Definición de módulos: nivel mínimo requerido para verlos habilitados —————
const MODULES=[
  {id:'auditoria', tag:'Cuadre · Libro · Auditoría', title:'Auditoría', stripe:'aud',
   desc:'Daily report, cuadre diario, libro contable y auditoría de transacciones por día.',
   href:CONFIG.AUDITORIA_URL, levels:['superfull','full']},
  {id:'pagos', tag:'Cuentas por pagar', title:'Pagos a Proveedores', stripe:'pagos',
   desc:'Solicitud, aprobación y seguimiento de pagos a proveedores, con catálogo e historial.',
   href:'pagos.html', levels:['superfull','full','lider']},
  {id:'requisiciones', tag:'Compras internas', title:'Requisiciones', stripe:'req',
   desc:'Solicitud y aprobación de requisiciones de compra por departamento.',
   href:'requisiciones.html', levels:['superfull','full','lider']},
];

// ————— Módulos anunciados pero aún sin HTML/backend — se configuran más adelante —————
const PENDING_MODULES=[
  {id:'incidencias', tag:'Nómina', title:'Incidencias', stripe:'inc',
   desc:'Registro mensual de incidencias de nómina por colaborador (faltas, permisos, horas extra…).'},
  {id:'bitacora', tag:'Operación diaria', title:'Bitácora de turnos', stripe:'bit',
   desc:'Registro de lo que pasa en cada turno, para que el siguiente turno sepa qué siguió pendiente.'},
  {id:'calendario', tag:'Reservas · Eventos', title:'Calendario', stripe:'cal',
   desc:'Calendario compartido de reservas, eventos y fechas clave de Casa Yuma.'},
];

let SESSION=null,PENDING=null;
function esSuperfull(){ return SESSION && SESSION.nivel==='superfull'; }
function esLiderCompras(){ return SESSION && SESSION.nivel==='lider' && SESSION.rolEspecial==='compras'; }
function rolLabel(){
  if(esSuperfull())return 'Superfull';
  if(SESSION.nivel==='full')return 'Full';
  if(esLiderCompras())return 'Líder Compras';
  if(SESSION.nivel==='lider')return 'Líder';
  return SESSION.nivel||'';
}
(function(){const sel=document.getElementById('userSel');CONFIG.USERS.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.n;sel.appendChild(o);});sel.onchange=()=>{document.getElementById('userId').value=sel.value;};document.getElementById('userId').value=sel.value;})();

async function apiGet(params){params=Object.assign({},params,{_ts:Date.now()});const qs=Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');const res=await fetch(CONFIG.WEBAPP_URL+'?'+qs,{cache:'no-store'});return res.json();}
async function apiPost(body){const res=await fetch(CONFIG.WEBAPP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return res.json();}

async function identificar(){
  const id=document.getElementById('userId').value.trim().toUpperCase();
  const err=document.getElementById('gateErr'),info=document.getElementById('gateInfo');
  err.textContent='';info.textContent='Verificando…';
  try{
    const j=await apiGet({accion:'login',id:id});
    if(!j.ok){info.textContent='';err.textContent=j.error;return;}
    PENDING={id:j.id,nombre:j.nombre,nivel:j.nivel,departamento:j.departamento,rolEspecial:j.rolEspecial,tienePin:j.tienePin};info.textContent='';
    document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');
    if(j.tienePin){document.getElementById('pinLabel').textContent='Tu PIN · '+j.nombre.split(' ')[0];document.getElementById('pinInput2wrap').classList.add('hidden');document.getElementById('pinBtn').textContent='Entrar';}
    else{document.getElementById('pinLabel').textContent='Crea tu PIN · '+j.nombre.split(' ')[0];document.getElementById('pinInput2wrap').classList.remove('hidden');document.getElementById('pinBtn').textContent='Crear PIN y entrar';info.textContent='Primera vez: define un PIN de 4 a 6 dígitos.';}
    document.getElementById('pinInput').focus();
  }catch(e){info.textContent='';err.textContent='No se pudo conectar. Revisa CONFIG.WEBAPP_URL.';}
}
function volverStep1(){document.getElementById('step2').classList.add('hidden');document.getElementById('step1').classList.remove('hidden');document.getElementById('gateErr').textContent='';document.getElementById('gateInfo').textContent='';document.getElementById('pinInput').value='';document.getElementById('pinInput2').value='';}
async function pinSubmit(){
  const pin=document.getElementById('pinInput').value.trim();const err=document.getElementById('gateErr');err.textContent='';
  if(!/^\d{4,6}$/.test(pin)){err.textContent='El PIN debe ser de 4 a 6 dígitos.';return;}
  try{
    let j;
    if(PENDING.tienePin){j=await apiGet({accion:'entrar',id:PENDING.id,pin:pin});}
    else{const pin2=document.getElementById('pinInput2').value.trim();if(pin!==pin2){err.textContent='Los PIN no coinciden.';return;}j=await apiPost({accion:'crearPin',id:PENDING.id,pin:pin});}
    if(!j.ok){err.textContent=j.error;return;}
    SESSION={id:PENDING.id,pin:pin,nombre:j.nombre||PENDING.nombre,nivel:j.nivel||PENDING.nivel,departamento:j.departamento||PENDING.departamento||'',rolEspecial:j.rolEspecial||PENDING.rolEspecial||''};
    entrarApp();
  }catch(e){err.textContent='No se pudo conectar.';}
}
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')pinSubmit();});
document.getElementById('pinInput2').addEventListener('keydown',e=>{if(e.key==='Enter')pinSubmit();});
document.getElementById('userId').addEventListener('keydown',e=>{if(e.key==='Enter')identificar();});

function entrarApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoLabel').textContent=SESSION.nombre+' · '+rolLabel();
  // Deja la sesión disponible para pagos.html / requisiciones.html si viven en el mismo dominio/carpeta
  try{sessionStorage.setItem('CY_FIN_SESSION',JSON.stringify(SESSION));}catch(e){}
  buildCards();
}
function logout(){try{sessionStorage.removeItem('CY_FIN_SESSION');}catch(e){}location.reload();}

function buildCards(){
  const grid=document.getElementById('cardGrid');
  grid.innerHTML='';
  MODULES.forEach(m=>{
    const allowed=m.levels.includes(SESSION.nivel);
    const card=document.createElement('div');
    card.className='card'+(allowed?'':' locked');
    card.innerHTML=`<div class="stripe ${m.stripe}"></div>
      ${allowed?'':'<div class="lockbadge">Sin acceso</div>'}
      <div class="tag">${m.tag}</div>
      <h3>${m.title}</h3>
      <p>${m.desc}</p>
      <a class="go" href="${allowed?m.href:'#'}" target="_blank" rel="noopener">${allowed?'Entrar →':'Nivel insuficiente'}</a>`;
    grid.appendChild(card);
  });
  PENDING_MODULES.forEach(m=>{
    const card=document.createElement('div');
    card.className='card pending';
    card.innerHTML=`<div class="stripe ${m.stripe}"></div>
      <div class="pendbadge">Pendiente de configurar</div>
      <div class="tag">${m.tag}</div>
      <h3>${m.title}</h3>
      <p>${m.desc}</p>
      <a class="go" href="#">Próximamente</a>`;
    grid.appendChild(card);
  });
  const soon=document.createElement('div');
  soon.className='card soon';
  soon.innerHTML=`<div class="tag">Próximamente</div><h3>Siguiente módulo</h3><p>Este espacio queda listo para lo que sigue — presupuesto anual, nómina, control de activos…</p>`;
  grid.appendChild(soon);
  let nota;
  if(esSuperfull()){
    nota='Ves todos los módulos como Superfull: apruebas Pagos y Requisiciones, y eres el único que puede revertir una aprobación o editar un renglón ya procesado. Auditoría te pedirá tu PIN de ese sistema por separado la primera vez.';
  } else if(SESSION.nivel==='full'){
    nota='Ves todos los módulos porque tu nivel de acceso es "full": apruebas Pagos y Requisiciones de todos los departamentos. Auditoría te pedirá tu PIN de ese sistema por separado la primera vez.';
  } else if(esLiderCompras()){
    nota='Como Líder Compras tienes Requisiciones de todos los departamentos (sin aprobar) y administras el catálogo de artículos. En Pagos puedes capturar solicitudes, pero solo ves las tuyas.';
  } else if(SESSION.nivel==='lider'){
    nota='Como líder de departamento, tienes Requisiciones para '+(SESSION.departamento||'tu departamento')+'. En Pagos puedes capturar solicitudes, pero solo ves las tuyas — aprobarlas es nivel "full".';
  } else {
    nota='Pagos y Requisiciones están reservados a colaboradores con acceso asignado. Habla con administración si lo necesitas.';
  }
  document.getElementById('footNote').textContent = nota;
}
</script>
</body>
</html>

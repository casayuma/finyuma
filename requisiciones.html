<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Yuma · Requisiciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2C6E73; --gold:#E1D082; --wool:#EAE3CD; --cactus:#72785E; --purple:#88285C;
  --ink:#20302f; --paper:#F5F1E6; --line:#d8cfb8;
  --ok:#3f7d4e; --warn:#b5892a; --bad:#a8324a;
  --mono:'Spline Sans Mono',ui-monospace,monospace; --disp:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--mono);background:var(--paper);color:var(--ink);line-height:1.5;font-size:15px}
h1,h2,h3{font-family:var(--disp);font-weight:600;line-height:1.1}
a{color:var(--blue)} button{font-family:var(--mono);cursor:pointer}
#gate{position:fixed;inset:0;background:var(--cactus);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.gate-card{background:var(--paper);border-radius:2px;max-width:400px;width:100%;padding:40px 32px;box-shadow:0 30px 80px rgba(0,0,0,.3);text-align:center}
.gate-eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--cactus);margin-bottom:12px}
.gate-card h1{font-size:32px;color:var(--cactus);margin-bottom:4px;font-weight:900}
.gate-sub{font-size:12.5px;color:var(--cactus);margin-bottom:26px}
.fld{text-align:left;margin-bottom:16px}
.fld label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cactus);margin-bottom:6px}
.fld select,.fld input,.fld textarea{width:100%;font-family:var(--mono);font-size:16px;padding:11px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px;outline:none}
.fld select:focus,.fld input:focus,.fld textarea:focus{border-color:var(--cactus)}
.fld select:disabled,.fld input:disabled{background:var(--wool);color:var(--cactus)}
.fld input.pin{letter-spacing:.4em;text-align:center;font-size:22px}
.gate-btn{margin-top:8px;width:100%;background:var(--cactus);color:#fff;border:none;padding:14px;font-size:13px;letter-spacing:.15em;text-transform:uppercase;border-radius:2px;transition:background .2s}
.gate-btn:hover{background:#5c6149}
.gate-btn.ghost{background:transparent;color:var(--cactus);border:1px solid var(--line);margin-top:10px}
.gate-btn:disabled{background:var(--line);color:var(--cactus);cursor:not-allowed}
.gate-err{color:var(--bad);font-size:12.5px;margin-top:14px;min-height:18px}
.gate-info{color:var(--cactus);font-size:12px;margin-top:12px;min-height:16px}
.hidden{display:none!important}
#app{display:none;min-height:100vh}
header.top{background:var(--cactus);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.top h1{font-size:20px;font-weight:900}
.top .who{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:14px}
.top .who a, .top .who button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:5px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-radius:2px;text-decoration:none}
nav.tabs{background:var(--cactus);border-top:1px solid rgba(255,255,255,.15);padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:transparent;border:none;color:rgba(255,255,255,.75);padding:12px 18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.active{color:#fff;border-bottom-color:var(--gold)}
main{max-width:1100px;margin:0 auto;padding:26px 18px 80px}
.view{display:none}.view.active{display:block}
.section-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--cactus);margin:26px 0 10px}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.ctl label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cactus)}
select,.ctl input{font-family:var(--mono);font-size:14px;padding:9px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px;outline:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:#fff;border:1px solid var(--line);border-left:3px solid var(--cactus);border-radius:2px;padding:15px 16px}
.kpi .k-lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cactus);margin-bottom:6px}
.kpi .k-val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:11px;color:var(--cactus);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.cap-form{background:#fff;border:1px solid var(--line);border-radius:3px;padding:24px}
.cap-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.cap-grid .fld{margin-bottom:0}
.cap-full{grid-column:1/-1}
.cap-btn{background:var(--cactus);color:#fff;border:none;padding:13px 24px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:2px}
.cap-btn:hover{background:#5c6149}
.cap-btn:disabled{background:var(--line);color:var(--cactus);cursor:not-allowed}
.cap-btn.sec{background:var(--blue)}
.cap-btn.sec:hover{background:#255a5e}
.cap-btn.ghost2{background:transparent;border:1px solid var(--line);color:var(--cactus);padding:8px 14px}
.item-row{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:14px}
.item-row .fld{margin-bottom:0}
@media(max-width:760px){.item-row{grid-template-columns:1fr 1fr}}
.search-wrap{position:relative}
.search-results{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-top:none;max-height:230px;overflow-y:auto;z-index:20;box-shadow:0 10px 20px rgba(0,0,0,.14)}
.sr-item{padding:9px 12px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.sr-item:hover,.sr-item:active{background:var(--wool)}
.sr-item:last-child{border-bottom:none}
.sr-nombre{font-weight:600}
.sr-precio{color:var(--cactus);white-space:nowrap;font-size:11px}
.sr-empty{padding:9px 12px;font-size:12px;color:var(--cactus);font-style:italic}
.sr-nuevo{color:var(--blue);font-weight:600}
.nuevo-art-box{background:var(--wool);border:1px solid var(--line);border-radius:2px;padding:16px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nuevo-art-box .fld{margin-bottom:0}
.nuevo-art-box .cap-full{grid-column:1/-1}
.nuevo-art-box .row-actions{grid-column:1/-1;margin-top:2px}
.cart-box{background:#fff;border:1px solid var(--line);border-radius:3px;padding:20px;position:sticky;top:16px}
.cart-box h3{font-size:15px;color:var(--cactus);margin-bottom:12px}
.cart-empty{font-size:12.5px;color:var(--cactus);font-style:italic;padding:14px 0}
.cart-item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.cart-item .ci-name{font-weight:600}
.cart-item .ci-meta{color:var(--cactus);font-size:11px}
.cart-item .ci-amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cart-item .ci-x{background:none;border:none;color:var(--bad);font-size:11px;text-transform:uppercase;padding:0;margin-top:4px}
.cart-total{display:flex;justify-content:space-between;padding-top:14px;font-size:16px;font-weight:600}
.window-note{font-size:11.5px;padding:10px 12px;border-radius:2px;margin-top:14px}
.window-ok{background:#e0efe0;color:var(--ok);border:1px solid var(--ok)}
.window-bad{background:#f2d6dc;color:var(--bad);border:1px solid var(--bad)}
.window-warn{background:#f2e6cf;color:var(--warn);border:1px solid var(--warn)}
.aud{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.aud th{background:var(--cactus);color:var(--paper);text-align:left;padding:9px 11px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.aud td{padding:8px 11px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.aud tr:hover td{background:#efe9d8}
.aud td.num{text-align:right}
.pedido-head td{background:var(--wool);font-weight:600;border-top:2px solid var(--cactus);font-size:12px;letter-spacing:.03em}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.p-pend{background:#f2e6cf;color:var(--warn)}
.p-aprob{background:#dce7ea;color:var(--blue)}
.p-comprada{background:#e6d9ec;color:var(--purple)}
.p-recibida{background:#e0efe0;color:var(--ok)}
.p-rech{background:#f2d6dc;color:var(--bad)}
.p-horario{background:#f2d6dc;color:var(--bad)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.mini-btn{border:none;padding:6px 11px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;color:#fff}
.mini-btn.ok{background:var(--ok)}
.mini-btn.bad{background:var(--bad)}
.mini-btn.info{background:var(--blue)}
.mini-btn.purp{background:var(--purple)}
.just-input{width:160px;font-family:var(--mono);font-size:12px;padding:6px;border:1px solid var(--line);border-radius:2px;resize:vertical;min-height:34px}
.loading,.empty{text-align:center;padding:50px 20px;color:var(--cactus);font-size:13px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--cactus);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{background:#f2d6dc;border:1px solid var(--bad);color:var(--bad);padding:14px 16px;border-radius:2px;font-size:13px;margin:20px 0}
.okmsg{background:#e0efe0;border:1px solid var(--ok);color:var(--ok);padding:10px 14px;border-radius:2px;font-size:13px;margin:12px 0}
.note{font-size:11.5px;color:var(--cactus);margin-top:18px;font-style:italic}
.viz-root{--surface-1:#ffffff;--text-primary:#20302f;--text-secondary:#72785E;--grid:#ece6d4}
.chart-wrap{background:#fff;border:1px solid var(--line);border-radius:3px;padding:20px;margin-bottom:20px;overflow-x:auto}
.chart-legend-label{font-size:11.5px}
.dept-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
.cat-inp{width:100%;font-family:var(--mono);font-size:12.5px;padding:6px 7px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink)}
.cat-inp:disabled{background:var(--wool);color:var(--cactus)}
.edit-box{background:var(--wool);border:1px solid var(--line);border-radius:2px;padding:12px;margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;align-items:end}
.edit-box .fld{margin-bottom:0}
.edit-box .row-actions{grid-column:1/-1}
@media(max-width:560px){main{padding:20px 12px 70px}.cap-grid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-eyebrow">Puerto Escondido · Oaxaca</div>
    <h1>Casa Yuma</h1>
    <div class="gate-sub">Requisiciones</div>
    <div id="step1">
      <div class="fld"><label>Colaborador</label><select id="userSel"></select></div>
      <div class="fld"><label>Número de colaborador</label><input id="userId" type="text" placeholder="CY000" autocomplete="off"></div>
      <button class="gate-btn" onclick="identificar()">Continuar</button>
    </div>
    <div id="step2" class="hidden">
      <div class="fld"><label id="pinLabel">Tu PIN</label><input id="pinInput" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off"></div>
      <div id="pinInput2wrap" class="fld hidden"><label>Confirma tu PIN</label><input id="pinInput2" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off"></div>
      <button class="gate-btn" id="pinBtn" onclick="pinSubmit()">Entrar</button>
      <button class="gate-btn ghost" onclick="volverStep1()">← Cambiar colaborador</button>
    </div>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-info" id="gateInfo"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>Casa Yuma · Requisiciones</h1>
    <div class="who"><span id="whoLabel"></span><a href="index.html">Portal</a><button onclick="logout()">Salir</button></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main>
    <section class="view active" id="v-nueva"><div id="nuevaBody"></div></section>
    <section class="view" id="v-pendientes"><div id="pendientesBody"><div class="loading"><div class="spinner"></div>Cargando…</div></div></section>
    <section class="view" id="v-historial">
      <div class="ctl">
        <label>Desde</label><input id="hDesde" type="date">
        <label>Hasta</label><input id="hHasta" type="date">
        <label>Estatus</label>
        <select id="hEstatus"><option value="">Todos</option><option>Pendiente</option><option>Aprobado</option><option>Comprada</option><option>Recibida</option><option>Rechazado</option></select>
        <span id="hDeptoWrap"><label>Departamento</label><select id="hDepto"><option value="">Todos</option></select></span>
        <button class="cap-btn" style="padding:9px 16px" onclick="cargarHistorial()">Ver</button>
        <button class="cap-btn sec" style="padding:9px 16px" onclick="pdfHistorial()">PDF</button>
      </div>
      <div id="historialKpis"></div>
      <div id="historialBody"><div class="empty">Elige un rango de fechas para ver el historial.</div></div>
    </section>
    <section class="view" id="v-gasto">
      <div class="ctl">
        <label>Mes</label><input id="gMes" type="month">
        <button class="cap-btn" style="padding:9px 16px" onclick="cargarGasto()">Ver</button>
      </div>
      <div id="gastoBody"><div class="empty">Elige un mes para ver el gasto.</div></div>
    </section>
    <section class="view" id="v-catalogo"><div id="catalogoBody"><div class="loading"><div class="spinner"></div>Cargando…</div></div></section>
    <section class="view" id="v-acumulados"><div id="acumuladosBody"><div class="loading"><div class="spinner"></div>Cargando…</div></div></section>
    <section class="view" id="v-compraslinea"><div id="compraslineaBody"></div></section>
  </main>
</div>

<script>
const CONFIG={
  WEBAPP_URL:'https://script.google.com/macros/s/AKfycbwaQK50qEOFGvYxoy3wpS17uPzru1BQAs0TYwnEeD50M1fe3UfNWqcy1AwN1wDOlqM/exec',
  PAGOS_URL:'pagos.html',
  USERS:[
    {id:'CY035',n:'Aida Carrillo Patiño'},{id:'CY037',n:'Omar Emiliano de la Tejera Zamorano'},
    {id:'CY038',n:'Rodolfo Ramirez Pérez'},{id:'CY057',n:'Arleth Paola Anicacio Antúnez'},
    {id:'CY039',n:'Jesus Israel Castillo Hernández'},{id:'CY001',n:'Manuel Arturo Otazo Aponte'},
    {id:'CY064',n:'Jorge Guillén Garbuno'},{id:'CY070',n:'América Arróniz'},{id:'CY999',n:'Growthbis'},
    {id:'CY071',n:'José de Jesús Segoviano Farjas'},{id:'CY007',n:'Ricardo Ojeda Montuy'},
    {id:'CY062',n:'Lizette Lopez Lopez'},{id:'CY025',n:'Egbert Cruz García'},
    {id:'CY029',n:'Neri Angelina Contreras Pacheco'},{id:'CY060',n:'Rainier Jetzahi Ramírez Vasquez'},
    {id:'CY005',n:'Horacio Muñoz Martínez'},
  ],
};
// Orden fijo (paleta categórica validada) — nunca reordenar según los valores del mes.
const DEPARTAMENTOS=[
  {nombre:'Administración', color:'#2a78d6'},
  {nombre:'Restaurante',    color:'#eb6834'},
  {nombre:'Cocina',         color:'#1baf7a'},
  {nombre:'Mantenimiento',  color:'#eda100'},
  {nombre:'Ama de llaves',  color:'#e87ba4'},
  {nombre:'Recepción',      color:'#008300'},
];
const URGENCIAS=['Baja','Media','Alta','Urgente'];
const money=n=>(isNaN(n)||n===''||n==null)?'–':Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{const x=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(x)?0:x;};
const deptoColor=nombre=>{const d=DEPARTAMENTOS.find(x=>x.nombre===nombre);return d?d.color:'#72785E';};
let SESSION=null,PENDING=null,CATALOGO=[],CARRITO=[],ITEM_SELECCIONADO=null,RESULTADOS_BUSQUEDA=[];
function normaliza(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const NIVELES_VALIDOS=['superfull','full','lider'];
function esSuperfull(){ return SESSION && SESSION.nivel==='superfull'; }
function esAprobador(){ return SESSION && (SESSION.nivel==='full' || SESSION.nivel==='superfull'); }
function esLiderCompras(){ return SESSION && SESSION.nivel==='lider' && SESSION.rolEspecial==='compras'; }
function esLiderNormal(){ return SESSION && SESSION.nivel==='lider' && !esLiderCompras(); }
function verTodosDeptos(){ return esAprobador() || esLiderCompras(); }
function administraCatalogo(){ return esAprobador() || esLiderCompras(); } // superfull, full y líder compras
function rolLabel(){
  if(esSuperfull())return 'Superfull';
  if(SESSION.nivel==='full')return 'Full';
  if(esLiderCompras())return 'Líder Compras';
  return 'Líder · '+(SESSION.departamento||'');
}

(function(){const sel=document.getElementById('userSel');CONFIG.USERS.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.n;sel.appendChild(o);});sel.onchange=()=>{document.getElementById('userId').value=sel.value;};document.getElementById('userId').value=sel.value;})();
(function(){const sel=document.getElementById('hDepto');DEPARTAMENTOS.forEach(d=>{const o=document.createElement('option');o.value=d.nombre;o.textContent=d.nombre;sel.appendChild(o);});})();

async function apiGet(params){params=Object.assign({},params,{_ts:Date.now()});const qs=Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');const res=await fetch(CONFIG.WEBAPP_URL+'?'+qs,{cache:'no-store'});return res.json();}
async function apiPost(body){const res=await fetch(CONFIG.WEBAPP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return res.json();}

// ————— Ventana de días/horario (America/Mexico_City) —————
const DEPTO_SIN_VENTANA='Cocina';
function ventanaInfo(){
  const fmt=new Intl.DateTimeFormat('en-US',{timeZone:'America/Mexico_City',weekday:'short',hour:'2-digit',hour12:false});
  const partes=fmt.formatToParts(new Date());
  const dia=(partes.find(p=>p.type==='weekday')||{}).value||'';
  let hora=parseInt((partes.find(p=>p.type==='hour')||{}).value||'0',10);
  if(hora===24)hora=0;
  const permitidos=['Sat','Sun','Tue','Thu'];
  return {permitido: permitidos.indexOf(dia)!==-1 && hora<20, dia, hora};
}

(async function tryAutoLogin(){
  try{
    const raw=sessionStorage.getItem('CY_FIN_SESSION');
    if(!raw)return;
    const s=JSON.parse(raw);
    const j=await apiGet({accion:'entrar',id:s.id,pin:s.pin});
    if(j.ok){
      const nivel=j.nivel||s.nivel;
      if(NIVELES_VALIDOS.indexOf(nivel)===-1){return;}
      SESSION={id:s.id,pin:s.pin,nombre:j.nombre||s.nombre,nivel:nivel,departamento:j.departamento||s.departamento||'',rolEspecial:j.rolEspecial||s.rolEspecial||''};
      entrarApp();
    }
  }catch(e){}
})();

async function identificar(){
  const id=document.getElementById('userId').value.trim().toUpperCase();
  const err=document.getElementById('gateErr'),info=document.getElementById('gateInfo');
  err.textContent='';info.textContent='Verificando…';
  try{
    const j=await apiGet({accion:'login',id:id});
    if(!j.ok){info.textContent='';err.textContent=j.error;return;}
    PENDING={id:j.id,nombre:j.nombre,nivel:j.nivel,departamento:j.departamento,rolEspecial:j.rolEspecial,tienePin:j.tienePin};info.textContent='';
    document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');
    if(j.tienePin){document.getElementById('pinLabel').textContent='Tu PIN · '+j.nombre.split(' ')[0];document.getElementById('pinInput2wrap').classList.add('hidden');document.getElementById('pinBtn').textContent='Entrar';}
    else{document.getElementById('pinLabel').textContent='Crea tu PIN · '+j.nombre.split(' ')[0];document.getElementById('pinInput2wrap').classList.remove('hidden');document.getElementById('pinBtn').textContent='Crear PIN y entrar';info.textContent='Primera vez: define un PIN de 4 a 6 dígitos.';}
    document.getElementById('pinInput').focus();
  }catch(e){info.textContent='';err.textContent='No se pudo conectar. Revisa CONFIG.WEBAPP_URL.';}
}

async function pinSubmit(){
  const pin=document.getElementById('pinInput').value.trim();const err=document.getElementById('gateErr');err.textContent='';
  if(!/^\d{4,6}$/.test(pin)){err.textContent='El PIN debe ser de 4 a 6 dígitos.';return;}
  try{
    let j;
    if(PENDING.tienePin){j=await apiGet({accion:'entrar',id:PENDING.id,pin:pin});}
    else{const pin2=document.getElementById('pinInput2').value.trim();if(pin!==pin2){err.textContent='Los PIN no coinciden.';return;}j=await apiPost({accion:'crearPin',id:PENDING.id,pin:pin});}
    if(!j.ok){err.textContent=j.error;return;}
    const nivel=j.nivel||PENDING.nivel;
    if(NIVELES_VALIDOS.indexOf(nivel)===-1){err.textContent='Tu usuario no tiene acceso a Requisiciones.';return;}
    SESSION={id:PENDING.id,pin:pin,nombre:j.nombre||PENDING.nombre,nivel:nivel,departamento:j.departamento||PENDING.departamento||'',rolEspecial:j.rolEspecial||PENDING.rolEspecial||''};entrarApp();
  }catch(e){err.textContent='No se pudo conectar.';}
}
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')pinSubmit();});
document.getElementById('pinInput2').addEventListener('keydown',e=>{if(e.key==='Enter')pinSubmit();});

const TABDEFS_FULL=[

  {id:'compraslinea',label:'Compras en línea'},
  {id:'pendientes',label:'Pendientes'},
  {id:'acumulados',label:'Pedidos acumulados'},

];
const TABDEFS_COMPRAS=[
  {id:'nueva',label:'Nueva requisición'},
  {id:'compraslinea',label:'Compras en línea'},

];
const TABDEFS_LIDER=[

function buildTabs(){
  let defs = esAprobador() ? TABDEFS_FULL : (esLiderCompras() ? TABDEFS_COMPRAS : TABDEFS_LIDER);

    b.textContent=t.label; b.dataset.view=t.id;

  });
  switchView(defs[0].id, tabs.querySelector('button'));
}
function switchView(id,btn){document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('v-'+id).classList.add('active');
  if(id==='historial' && !document.getElementById('historialBody').dataset.loaded) cargarHistorial();
  if(id==='gasto' && !document.getElementById('gastoBody').dataset.loaded) cargarGasto();

}

function buscarCatalogo(){
  const q=document.getElementById('iBuscar').value.trim();
  const cont=document.getElementById('iResultados');
  ITEM_SELECCIONADO=null;
  if(!q){ cont.classList.add('hidden'); cont.innerHTML=''; RESULTADOS_BUSQUEDA=[]; return; }
  const qn=normaliza(q);
  RESULTADOS_BUSQUEDA=CATALOGO.filter(c=>normaliza(c[1]).indexOf(qn)!==-1).slice(0,8);
  let html='';
  if(RESULTADOS_BUSQUEDA.length){
    html+=RESULTADOS_BUSQUEDA.map((c,i)=>`<div class="sr-item" onmousedown="event.preventDefault();elegirResultado(${i})">
        <span class="sr-nombre">${escapeHtml(c[1])}</span><span class="sr-precio">${c[3]?('$'+money(c[3])+' / '+escapeHtml(c[2]||'')):''}</span>
      </div>`).join('');
  } else {
    html+='<div class="sr-empty">Sin coincidencias en el catálogo.</div>';
  }
  html+=`<div class="sr-item sr-nuevo" onmousedown="event.preventDefault();mostrarNuevoArticulo()">+ Agregar "${escapeHtml(q)}" como artículo nuevo</div>`;
  cont.innerHTML=html;
  cont.classList.remove('hidden');
}
function elegirResultado(i){
  const c=RESULTADOS_BUSQUEDA[i];
  if(!c)return;
  document.getElementById('iBuscar').value=c[1];
  document.getElementById('iUnidad').value=c[2]||'';
  document.getElementById('iPrecio').value=c[3]||'';
  ITEM_SELECCIONADO={catalogoId:c[0], articulo:c[1]};
  document.getElementById('iResultados').classList.add('hidden');
  actualizarPrevisualizacion();
}
function mostrarNuevoArticulo(){
  document.getElementById('iResultados').classList.add('hidden');
  document.getElementById('naNombre').value=document.getElementById('iBuscar').value.trim();
  document.getElementById('naUnidad').value='';
  document.getElementById('naPrecio').value='';
  const deptoSel=document.getElementById('rDepto');
  document.getElementById('naDepto').value = deptoSel ? deptoSel.value : '';
  document.getElementById('nuevoArtBox').classList.remove('hidden');
  document.getElementById('naNombre').focus();
}
function cancelarNuevoArticulo(){ document.getElementById('nuevoArtBox').classList.add('hidden'); }
async function guardarNuevoArticulo(){
  const nombre=document.getElementById('naNombre').value.trim();
  if(!nombre){ alert('Escribe el nombre del artículo.'); return; }
  const unidad=document.getElementById('naUnidad').value.trim();
  const precioUnitario=num(document.getElementById('naPrecio').value)||0;
  const departamento=document.getElementById('naDepto').value;
  try{
    const j=await apiPost({accion:'catalogo_crear',id:SESSION.id,pin:SESSION.pin,articulo:nombre,unidad,precioUnitario,departamento});
    if(!j.ok){ alert(j.error); return; }
    CATALOGO.push([j.id, nombre, unidad, precioUnitario, departamento]);
    document.getElementById('iBuscar').value=nombre;
    document.getElementById('iUnidad').value=unidad;
    document.getElementById('iPrecio').value=precioUnitario||'';
    ITEM_SELECCIONADO={catalogoId:j.id, articulo:nombre};
    document.getElementById('nuevoArtBox').classList.add('hidden');
    actualizarPrevisualizacion();
  }catch(e){ alert('No se pudo guardar el artículo nuevo.'); }
}
function actualizarPrevisualizacion(){
  const cant=num(document.getElementById('iCantidad').value)||0;
  const precio=num(document.getElementById('iPrecio').value)||0;
  document.getElementById('iPrevisualizacion').textContent = (cant&&precio) ? ('Subtotal de este artículo: $'+money(cant*precio)) : '';
}
function agregarAlCarrito(){
  const articulo=document.getElementById('iBuscar').value.trim();
  const catalogoId = ITEM_SELECCIONADO ? ITEM_SELECCIONADO.catalogoId : '';
  const cantidad = num(document.getElementById('iCantidad').value)||1;
  const unidad = document.getElementById('iUnidad').value.trim();
  const precioUnitario = num(document.getElementById('iPrecio').value)||0;
  if(!articulo){ alert('Escribe o elige un artículo.'); return; }
  const yaEnCarrito = CARRITO.some(it => (catalogoId && it.catalogoId===catalogoId) || normaliza(it.articulo)===normaliza(articulo));
  if(yaEnCarrito){ alert('Ese artículo ya está en tu lista. Si necesitas más cantidad, quítalo de la lista y agrégalo de nuevo con la cantidad correcta.'); return; }
  CARRITO.push({articulo, catalogoId, cantidad, unidad, precioUnitario, subtotal:Math.round(cantidad*precioUnitario*100)/100});
  document.getElementById('iBuscar').value='';
  document.getElementById('iResultados').classList.add('hidden');
  document.getElementById('iCantidad').value='1';
  document.getElementById('iUnidad').value='';
  document.getElementById('iPrecio').value='';
  document.getElementById('iPrevisualizacion').textContent='';
  ITEM_SELECCIONADO=null;
  renderCarrito();
}
function quitarDelCarrito(idx){ CARRITO.splice(idx,1); renderCarrito(); }
function renderCarrito(){
  const cont=document.getElementById('carritoLista');
  if(!cont)return;
  if(!CARRITO.length){ cont.innerHTML='<div class="cart-empty">Todavía no agregas artículos.</div>'; }
  else {
    cont.innerHTML=CARRITO.map((it,idx)=>`
      <div class="cart-item">
        <div><div class="ci-name">${it.articulo}</div><div class="ci-meta">${it.cantidad} ${it.unidad||''} ${it.precioUnitario?('· $'+money(it.precioUnitario)+' c/u'):''}</div></div>
        <div><div class="ci-amt">${it.precioUnitario?('$'+money(it.subtotal)):'a definir'}</div><button class="ci-x" onclick="quitarDelCarrito(${idx})">Quitar</button></div>
      </div>`).join('');
  }
  const total=CARRITO.reduce((s,it)=>s+(it.subtotal||0),0);
  document.getElementById('carritoTotal').textContent='$'+money(total);

  const deptoSel=document.getElementById('rDepto');
  const departamento = deptoSel ? deptoSel.value : SESSION.departamento;
  const v=ventanaInfo();
  const esCocina = departamento===DEPTO_SIN_VENTANA;
  const aviso=document.getElementById('ventanaAviso');
  const btn=document.getElementById('btnEnviarPedido');
  if(v.permitido){
    aviso.innerHTML='<div class="window-note window-ok">Dentro del horario de captura.</div>';
    btn.disabled=false;
  } else if(esCocina){
    aviso.innerHTML='<div class="window-note window-warn">Fuera del horario normal — Cocina puede enviarlo, pero quedará marcado para revisión de Gerencia General.</div>';
    btn.disabled=false;
  } else {
    aviso.innerHTML='<div class="window-note window-bad">Cerrado. Las requisiciones solo se envían sábados, domingos, martes y jueves hasta las 8:00 PM.</div>';
    btn.disabled=true;
  }
}
async function enviarPedido(){
  if(!CARRITO.length){ alert('Agrega al menos un artículo a la lista.'); return; }
  const deptoSel=document.getElementById('rDepto');
  const departamento = esLiderNormal() ? SESSION.departamento : deptoSel.value;
  const msg=document.getElementById('nuevaMsg');
  const body={accion:'requisiciones_crear',id:SESSION.id,pin:SESSION.pin,
    departamento,
    urgencia:document.getElementById('rUrgencia').value,
    fechaRequerida:document.getElementById('rFecha').value,
    items:CARRITO};
  msg.innerHTML='<div class="okmsg">Enviando…</div>';
  try{
    const j=await apiPost(body);
    if(!j.ok){msg.innerHTML=`<div class="errbox">${j.error}</div>`;return;}
    msg.innerHTML=`<div class="okmsg">Pedido ${j.id} enviado con ${j.items} artículo(s). Aparecerá en ${esAprobador()?'"Pendientes"':'"Historial"'}.</div>`;
    renderNueva();
    if(esAprobador())cargarPendientes();
    document.getElementById('historialBody').dataset.loaded='';
  }catch(e){msg.innerHTML='<div class="errbox">No se pudo enviar.</div>';}
}

// ————— Pendientes (solo full) — agrupadas por pedido, aprobación por artículo —————
const SEL_PENDIENTES=new Set();
async function cargarPendientes(){
  SEL_PENDIENTES.clear();
  const el=document.getElementById('pendientesBody');
  el.innerHTML='<div class="loading"><div class="spinner"></div>Cargando…</div>';
  try{
    const j=await apiGet({accion:'requisiciones_list',id:SESSION.id,pin:SESSION.pin,estatus:'Pendiente'});
    if(!j.ok)throw new Error(j.error);
    const filas=j.filas||[];
    if(!filas.length){el.innerHTML='<div class="empty">No hay requisiciones pendientes de aprobación.</div>';return;}
    const grupos=agruparPorPedido(filas);
    el.innerHTML=`<div class="section-eyebrow">Pendientes de aprobación (${filas.length} artículo(s) en ${grupos.length} pedido(s))</div>
      <div class="bulk-bar" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding:10px 12px;background:var(--sand,#f4efe6);border-radius:10px">
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer">
          <input type="checkbox" id="chkTodosPend" onchange="toggleSeleccionarTodos(this.checked)"> Seleccionar todos
        </label>
        <span id="contadorSelPend" style="font-size:12.5px;color:var(--cactus)">0 seleccionados</span>
        <button class="mini-btn ok" id="btnAprobarSel" disabled onclick="aprobarSeleccionados()" style="margin-left:auto">Aprobar seleccionados</button>
      </div>
      <div style="overflow-x:auto"><table class="aud"><thead><tr>
        <th style="width:28px"></th><th>Artículo</th><th>Cant.</th><th>Precio unit.</th><th>Subtotal</th><th>Urgencia</th><th>Acción</th>
      </tr></thead><tbody>${grupos.map(g=>renderGrupoPendiente(g)).join('')}</tbody></table></div>`;
  }catch(e){el.innerHTML=`<div class="errbox">${e.message}</div>`;}
}
function agruparPorPedido(filas){
  const map={}; const orden=[];
  filas.forEach(r=>{
    const pedidoId=r[1];
    if(!map[pedidoId]){ map[pedidoId]={pedidoId, fecha:r[2], solicitanteNombre:r[4], departamento:r[5], justificacion:r[12], urgencia:r[13], fechaRequerida:r[14], fueraDeHorario:r[15], items:[]}; orden.push(pedidoId); }
    map[pedidoId].items.push(r);
  });
  return orden.map(id=>map[id]);
}
function renderGrupoPendiente(g){
  const badge = g.fueraDeHorario==='SI' ? '<span class="pill p-horario">⚠ Fuera de horario — revisar Gerencia General</span>' : '';
  const cabecera=`<tr class="pedido-head"><td colspan="7">
    Pedido ${g.pedidoId} · <span class="dept-dot" style="background:${deptoColor(g.departamento)}"></span>${g.departamento} · ${g.solicitanteNombre} · ${g.fecha} · requerido ${g.fechaRequerida||'–'} ${badge}
    ${g.justificacion?('<div style="font-weight:400;font-size:11.5px;color:var(--cactus);margin-top:3px">'+g.justificacion+'</div>'):''}
  </td></tr>`;
  return cabecera + g.items.map(r=>renderItemPendiente(r)).join('');
}
function renderItemPendiente(r){
  const [id,pedidoId,fecha,solId,solNombre,depto,articulo,catalogoId,cantidad,unidad,precioUnitario,subtotal,justificacion,urgencia]=r;
  return `<tr>
    <td><input type="checkbox" class="pend-check" value="${id}" onchange="actualizarSeleccionPendientes()"></td>
    <td>${articulo}</td>
    <td class="num">${cantidad}${unidad?' '+unidad:''}</td>
    <td class="num">${precioUnitario?'$'+money(precioUnitario):'–'}</td>
    <td class="num">${subtotal?'$'+money(subtotal):'a definir'}</td>
    <td>${urgencia==='Urgente'||urgencia==='Alta'?`<span class="pill p-rech">${urgencia}</span>`:urgencia}</td>
    <td><div class="row-actions">
      <button class="mini-btn ok" onclick="aprobarItem('${id}')">Aprobar</button>
      <button class="mini-btn bad" onclick="pedirRechazo('${id}')">Rechazar</button>
    </div><div id="rj_${id}"></div></td>
  </tr>`;
}
function actualizarSeleccionPendientes(){
  SEL_PENDIENTES.clear();
  document.querySelectorAll('.pend-check:checked').forEach(c=>SEL_PENDIENTES.add(c.value));
  const total=document.querySelectorAll('.pend-check').length;
  const contador=document.getElementById('contadorSelPend');
  if(contador) contador.textContent=SEL_PENDIENTES.size+' seleccionado'+(SEL_PENDIENTES.size===1?'':'s');
  const btn=document.getElementById('btnAprobarSel');
  if(btn) btn.disabled = SEL_PENDIENTES.size===0;
  const chkTodos=document.getElementById('chkTodosPend');
  if(chkTodos) chkTodos.checked = total>0 && SEL_PENDIENTES.size===total;
}
function toggleSeleccionarTodos(checked){
  document.querySelectorAll('.pend-check').forEach(c=>{c.checked=checked;});
  actualizarSeleccionPendientes();
}
async function aprobarSeleccionados(){
  if(!SEL_PENDIENTES.size)return;
  const ids=Array.from(SEL_PENDIENTES);
  if(!confirm(`¿Aprobar ${ids.length} artículo(s) seleccionado(s)?`))return;
  const btn=document.getElementById('btnAprobarSel');
  if(btn){btn.disabled=true;btn.textContent='Aprobando…';}
  try{
    const j=await apiPost({accion:'requisiciones_aprobar_lote',id:SESSION.id,pin:SESSION.pin,idItems:ids});
    if(!j.ok){alert(j.error);cargarPendientes();return;}
    cargarPendientes();
  }catch(e){alert('No se pudo procesar la aprobación múltiple.');cargarPendientes();}
}
async function aprobarItem(id){
  try{const j=await apiPost({accion:'requisiciones_actualizar',id:SESSION.id,pin:SESSION.pin,idItem:id,accionEstatus:'aprobar'});if(!j.ok){alert(j.error);return;}cargarPendientes();}catch(e){alert('No se pudo procesar.');}
}
function pedirRechazo(id){
  const box=document.getElementById('rj_'+id);
  box.innerHTML=`<textarea class="just-input" id="mot_${id}" placeholder="Motivo del rechazo"></textarea><button class="mini-btn bad" style="margin-top:4px" onclick="rechazarItem('${id}')">Confirmar</button>`;
}
async function rechazarItem(id){
  const motivo=document.getElementById('mot_'+id).value.trim();
  if(!motivo){alert('Escribe un motivo.');return;}
  try{const j=await apiPost({accion:'requisiciones_actualizar',id:SESSION.id,pin:SESSION.pin,idItem:id,accionEstatus:'rechazar',motivo});if(!j.ok){alert(j.error);return;}cargarPendientes();}catch(e){alert('No se pudo procesar.');}
}
async function marcarEstado(id,estado){

// ————— Pedidos acumulados (Líder Compras / Full / Superfull) — todos los deptos, en curso —————
// Junta lo Pendiente + Aprobado + Comprado de TODOS los departamentos, separado por
// departamento, para que Compras tenga en un solo lugar todo lo que sigue vivo. Control
// cruzado: Compras (o Full/Superfull) marca "Comprada"; el departamento que lo pidió marca
// "Recibida" cerrando el circuito — recién ahí el artículo desaparece de esta lista (lo
// Recibido/Rechazado ya no aparece aquí, para eso está "Historial").
const ESTATUS_ACUMULADOS=['Pendiente','Aprobado','Comprada'];
const SEL_ACUM_COMPRAR=new Set(); // artículos Aprobado seleccionados para marcar Comprada
const SEL_ACUM_RECIBIR=new Set(); // artículos Comprada seleccionados para marcar Recibida
async function cargarAcumulados(){
  SEL_ACUM_COMPRAR.clear(); SEL_ACUM_RECIBIR.clear();
  const el=document.getElementById('acumuladosBody');
  el.innerHTML='<div class="loading"><div class="spinner"></div>Cargando…</div>';
  try{
    const j=await apiGet({accion:'requisiciones_list',id:SESSION.id,pin:SESSION.pin});
    if(!j.ok)throw new Error(j.error);
    const filas=(j.filas||[]).filter(r=>ESTATUS_ACUMULADOS.indexOf(r[16])!==-1);
    if(!filas.length){el.innerHTML='<div class="empty">No hay pedidos en curso por ahora.</div>';return;}
    const total=filas.reduce((s,r)=>s+num(r[11]),0);
    const bloques=agruparPorDepartamentoYPedido(filas);
    el.innerHTML=`<div class="section-eyebrow">Pedidos acumulados (${filas.length} artículo(s) en ${bloques.reduce((s,b)=>s+b.grupos.length,0)} pedido(s) · $${money(total)})</div>
      <div class="note" style="margin-top:0;margin-bottom:14px">Incluye Pendientes, Aprobados y Comprados de todos los departamentos — el histórico completo está en "Historial". Compras marca "Comprada"; cada departamento marca "Recibida" cuando le llega, y ahí desaparece de esta lista.</div>
      <div class="bulk-bar" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:var(--sand,#f4efe6);border-radius:10px">
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer">
          <input type="checkbox" id="chkTodosComprar" onchange="toggleSeleccionarTodosAcum('comprar',this.checked)"> Todos los aprobados
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer">
          <input type="checkbox" id="chkTodosRecibir" onchange="toggleSeleccionarTodosAcum('recibir',this.checked)"> Todos los comprados
        </label>
        <span id="contadorSelAcum" style="font-size:12.5px;color:var(--cactus)">0 seleccionados</span>
        <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
          <button class="mini-btn info" id="btnCompradosSel" disabled onclick="marcarCompradosSeleccionados()">Marcar comprados</button>
          <button class="mini-btn ok" id="btnRecibidosSel" disabled onclick="marcarRecibidosSeleccionados()">Marcar recibidos</button>
        </div>
      </div>
      ${bloques.map(b=>`
        <div class="section-eyebrow" style="margin-top:18px"><span class="dept-dot" style="background:${deptoColor(b.departamento)}"></span> ${b.departamento}</div>
        <div style="overflow-x:auto"><table class="aud"><thead><tr>
          <th style="width:28px"></th><th>Artículo</th><th>Cant.</th><th>Subtotal</th><th>Estatus</th><th>Acción</th>
        </tr></thead><tbody>${b.grupos.map(g=>renderGrupoAcumulado(g)).join('')}</tbody></table></div>
      `).join('')}`;
  }catch(e){el.innerHTML=`<div class="errbox">${e.message}</div>`;}
}
function agruparPorDepartamentoYPedido(filas){
  const porDepto={}; const orden=[];
  filas.forEach(r=>{
    const depto=r[5];
    if(!porDepto[depto]){ porDepto[depto]=[]; orden.push(depto); }
    porDepto[depto].push(r);
  });
  return orden.map(depto=>({departamento:depto, grupos:agruparPorPedido(porDepto[depto])}));
}
function renderGrupoAcumulado(g){
  const badge = g.fueraDeHorario==='SI' ? '<span class="pill p-horario">⚠ Fuera de horario</span>' : '';
  const cabecera=`<tr class="pedido-head"><td colspan="6">
    Pedido ${g.pedidoId} · ${g.solicitanteNombre} · ${g.fecha} ${badge}
  </td></tr>`;
  return cabecera + g.items.map(r=>renderItemAcumulado(r)).join('');
}
function renderItemAcumulado(r){
  const [id,,,,,depto,articulo,,cantidad,unidad,,subtotal,,,,,estatus]=r;
  const pillClass=ESTATUS_PILL[estatus]||'p-pend';
  let acciones=[]; let checkbox='';
  if(estatus==='Aprobado'){
    // Comprada: la marca Compras (Rainier) o Full/Superfull. Borrar: exclusivo Full/Superfull
    // (Compras no puede borrar artículos del pedido, solo marcarlos Comprada).
    if(esAprobador() || esLiderCompras()){
      checkbox=`<input type="checkbox" class="acum-check-comprar" value="${id}" onchange="actualizarSeleccionAcumulados()">`;
      acciones.push(`<button class="mini-btn info" onclick="marcarEstadoAcumulado('${id}','marcarComprada')">Comprada</button>`);
    }
    if(esAprobador()){
      acciones.push(`<button class="mini-btn bad" onclick="borrarItemAcumulado('${id}')">Borrar</button>`);
    }
  } else if(estatus==='Comprada'){
    if(esAprobador() || (SESSION.departamento && SESSION.departamento===depto)){
      checkbox=`<input type="checkbox" class="acum-check-recibir" value="${id}" onchange="actualizarSeleccionAcumulados()">`;
      acciones.push(`<button class="mini-btn ok" onclick="marcarEstadoAcumulado('${id}','marcarRecibida')">Recibida</button>`);
    }
  }
  const accionCol = acciones.length ? `<div class="row-actions no-pdf">${acciones.join('')}</div>` : '–';
  return `<tr>
    <td>${checkbox}</td>
    <td>${articulo}</td>
    <td class="num">${cantidad}${unidad?' '+unidad:''}</td>
    <td class="num">${subtotal?'$'+money(subtotal):'a definir'}</td>
    <td><span class="pill ${pillClass}">${estatus}</span></td>
    <td>${accionCol}</td>
  </tr>`;
}
function actualizarSeleccionAcumulados(){
  SEL_ACUM_COMPRAR.clear(); SEL_ACUM_RECIBIR.clear();
  document.querySelectorAll('.acum-check-comprar:checked').forEach(c=>SEL_ACUM_COMPRAR.add(c.value));
  document.querySelectorAll('.acum-check-recibir:checked').forEach(c=>SEL_ACUM_RECIBIR.add(c.value));
  const totalSel=SEL_ACUM_COMPRAR.size+SEL_ACUM_RECIBIR.size;
  const contador=document.getElementById('contadorSelAcum');
  if(contador) contador.textContent=totalSel+' seleccionado'+(totalSel===1?'':'s');
  const btnC=document.getElementById('btnCompradosSel'); if(btnC) btnC.disabled=SEL_ACUM_COMPRAR.size===0;
  const btnR=document.getElementById('btnRecibidosSel'); if(btnR) btnR.disabled=SEL_ACUM_RECIBIR.size===0;
  const totalComprar=document.querySelectorAll('.acum-check-comprar').length;
  const totalRecibir=document.querySelectorAll('.acum-check-recibir').length;
  const chkC=document.getElementById('chkTodosComprar'); if(chkC) chkC.checked = totalComprar>0 && SEL_ACUM_COMPRAR.size===totalComprar;
  const chkR=document.getElementById('chkTodosRecibir'); if(chkR) chkR.checked = totalRecibir>0 && SEL_ACUM_RECIBIR.size===totalRecibir;
}
function toggleSeleccionarTodosAcum(tipo,checked){
  const cls = tipo==='comprar' ? '.acum-check-comprar' : '.acum-check-recibir';
  document.querySelectorAll(cls).forEach(c=>{c.checked=checked;});
  actualizarSeleccionAcumulados();
}
async function marcarCompradosSeleccionados(){
  if(!SEL_ACUM_COMPRAR.size)return;
  const ids=Array.from(SEL_ACUM_COMPRAR);
  if(!confirm(`¿Marcar ${ids.length} artículo(s) como Comprados?`))return;
  const btn=document.getElementById('btnCompradosSel'); if(btn){btn.disabled=true;btn.textContent='Marcando…';}
  try{
    const j=await apiPost({accion:'requisiciones_marcar_lote',id:SESSION.id,pin:SESSION.pin,idItems:ids,accionEstatus:'marcarComprada'});
    if(!j.ok){alert(j.error);}
    cargarAcumulados();
  }catch(e){alert('No se pudo procesar.');cargarAcumulados();}
}
async function marcarRecibidosSeleccionados(){
  if(!SEL_ACUM_RECIBIR.size)return;
  const ids=Array.from(SEL_ACUM_RECIBIR);
  if(!confirm(`¿Marcar ${ids.length} artículo(s) como Recibidos?`))return;
  const btn=document.getElementById('btnRecibidosSel'); if(btn){btn.disabled=true;btn.textContent='Marcando…';}
  try{
    const j=await apiPost({accion:'requisiciones_marcar_lote',id:SESSION.id,pin:SESSION.pin,idItems:ids,accionEstatus:'marcarRecibida'});
    if(!j.ok){alert(j.error);}
    cargarAcumulados();
  }catch(e){alert('No se pudo procesar.');cargarAcumulados();}
}
async function marcarEstadoAcumulado(id,estado){
  try{const j=await apiPost({accion:'requisiciones_actualizar',id:SESSION.id,pin:SESSION.pin,idItem:id,accionEstatus:estado});if(!j.ok){alert(j.error);return;}cargarAcumulados();}catch(e){alert('No se pudo procesar.');}
}
async function borrarItemAcumulado(id){
  if(!confirm('¿Borrar este artículo ya aprobado? Esta acción no se puede deshacer.'))return;
  try{const j=await apiPost({accion:'requisiciones_borrar',id:SESSION.id,pin:SESSION.pin,idItem:id});if(!j.ok){alert(j.error);return;}cargarAcumulados();}catch(e){alert('No se pudo borrar.');}
}

function renderCompraLinea(){
  const deptoOpts = esLiderNormal()
    ? `<option>${SESSION.departamento}</option>`
    : DEPARTAMENTOS.map(d=>`<option>${d.nombre}</option>`).join('');

          <div class="fld"><label>Fecha requerida</label><input id="clFecha" type="date" value="${hoy}"></div>
          <div class="fld cap-full"><label>Notas (opcional)</label><input id="clNotas" placeholder="Talla, color, alguna especificación…"></div>
        </div>
        <button class="cap-btn" style="margin-top:14px" onclick="enviarCompraLinea()">Enviar a Manuel</button>

async function enviarCompraLinea(){
  const msg=document.getElementById('clMsg');
  const descripcion=document.getElementById('clDescripcion').value.trim();
  const link=document.getElementById('clLink').value.trim();
  const cantidad=num(document.getElementById('clCantidad').value)||1;
  const precioEstimado=num(document.getElementById('clPrecio').value)||0;
  const departamento=document.getElementById('clDepto').value;
  const urgencia=document.getElementById('clUrgencia').value;
  const fechaRequerida=document.getElementById('clFecha').value;
  const notas=document.getElementById('clNotas').value.trim();
  if(!descripcion){ msg.innerHTML='<div class="errbox">Escribe qué es lo que se quiere comprar.</div>'; return; }
  if(!link){ msg.innerHTML='<div class="errbox">Pega el link del producto.</div>'; return; }
  msg.innerHTML='<div class="loading"><div class="spinner"></div>Enviando…</div>';
  try{
    const j=await apiPost({accion:'compras_linea_crear',id:SESSION.id,pin:SESSION.pin,descripcion,link,cantidad,precioEstimado,departamento,urgencia,fechaRequerida,notas});

    document.getElementById('clCantidad').value='1';
    document.getElementById('clPrecio').value='';
    document.getElementById('clNotas').value='';

}
async function cargarComprasLinea(){
  const el=document.getElementById('compraslineaListaBody');

function renderItemCompraLinea(r){

    ${acciones}

async function marcarCompraLineaComprada(idCompra){
  const notaCompra=prompt('¿Alguna nota de la compra? (opcional: número de guía, confirmación, etc.)')||'';

// ————— Historial / Mis solicitudes —————
const ESTATUS_PILL={Pendiente:'p-pend',Aprobado:'p-aprob',Comprada:'p-comprada',Recibida:'p-recibida',Rechazado:'p-rech'};
async function cargarHistorial(){
  const el=document.getElementById('historialBody');
  const desde=document.getElementById('hDesde').value, hasta=document.getElementById('hHasta').value, estatus=document.getElementById('hEstatus').value;
  const departamento = verTodosDeptos() ? document.getElementById('hDepto').value : ''; // el backend ya fuerza el propio si es líder
  el.innerHTML='<div class="loading"><div class="spinner"></div>Cargando…</div>';
  document.getElementById('historialBody').dataset.loaded='1';
  try{
    const j=await apiGet({accion:'requisiciones_list',id:SESSION.id,pin:SESSION.pin,desde,hasta,estatus,departamento});
    if(!j.ok)throw new Error(j.error);
    const filas=j.filas||[];
    renderHistorialKpis(filas);
    if(!filas.length){el.innerHTML='<div class="empty">Sin resultados para ese filtro.</div>';return;}
    const grupos=agruparPorPedido(filas);
    el.innerHTML=`<div style="overflow-x:auto"><table class="aud" id="histTable"><thead><tr>
      <th>Artículo</th><th>Cant.</th><th>Subtotal</th><th>Estatus</th><th>Aprobó</th><th>Acción</th>
    </tr></thead><tbody>${grupos.map(g=>renderGrupoHistorial(g)).join('')}</tbody></table></div>`;
  }catch(e){el.innerHTML=`<div class="errbox">${e.message}</div>`;}
}
function renderGrupoHistorial(g){
  const badge = g.fueraDeHorario==='SI' ? '<span class="pill p-horario">⚠ Fuera de horario</span>' : '';
  const cabecera=`<tr class="pedido-head"><td colspan="6">
    Pedido ${g.pedidoId} · <span class="dept-dot" style="background:${deptoColor(g.departamento)}"></span>${g.departamento} · ${g.solicitanteNombre} · ${g.fecha} ${badge}
  </td></tr>`;
  return cabecera + g.items.map(r=>renderItemHistorial(r,g.pedidoId)).join('');
}
function renderItemHistorial(r,pedidoId){
  const [id,,,,,depto,articulo,,cantidad,unidad,precioUnitario,subtotal,,,,,estatus,aprobadoPor,,motivoRech]=r;
  const pillClass=ESTATUS_PILL[estatus]||'p-pend';
  let acciones=[];
  // Historial es de solo consulta + generar pago. Marcar Comprada/Recibida ahora vive en
  // "Pedidos acumulados": Comprada la pone Compras (control cruzado), Recibida la pone el
  // propio departamento que lo pidió — cerrando el circuito.
  if(esAprobador() && estatus==='Aprobado'){
    acciones.push(`<button class="mini-btn purp" onclick="generarPago('${escapeHtml(articulo)}',${subtotal||0},'${pedidoId}')">Generar pago</button>`);
  }
  if(estatus==='Comprada' && (esAprobador() || (SESSION.departamento && SESSION.departamento===depto))){
    acciones.push(`<button class="mini-btn ok" onclick="marcarEstado('${id}','marcarRecibida')">Recibida</button>`);
  }
  if(esSuperfull()){
    if(estatus!=='Pendiente') acciones.push(`<button class="mini-btn bad" onclick="revertirItem('${id}')">Revertir</button>`);
    acciones.push(`<button class="mini-btn info" onclick="mostrarEditarItem('${id}',${cantidad},'${escapeHtml(unidad||'')}',${precioUnitario||0})">Editar</button>`);
  }
  const accionCol = acciones.length ? `<div class="row-actions no-pdf">${acciones.join('')}</div>` : '–';
  return `<tr>
    <td>${articulo}</td>
    <td class="num">${cantidad}${unidad?' '+unidad:''}</td>
    <td class="num">${subtotal?'$'+money(subtotal):'a definir'}</td>
    <td><span class="pill ${pillClass}">${estatus}</span>${estatus==='Rechazado'&&motivoRech?`<div style="font-size:10.5px;color:var(--cactus);margin-top:3px">${motivoRech}</div>`:''}</td>
    <td>${aprobadoPor||'–'}</td><td>${accionCol}<div id="ed_${id}" class="no-pdf"></div></td>
  </tr>`;
}
async function revertirItem(id){
  if(!confirm('¿Regresar este artículo a Pendiente? Se borra quién lo aprobó/rechazó y sus fechas.'))return;
  try{const j=await apiPost({accion:'requisiciones_actualizar',id:SESSION.id,pin:SESSION.pin,idItem:id,accionEstatus:'revertir'});if(!j.ok){alert(j.error);return;}cargarHistorial();if(esAprobador())cargarPendientes();}catch(e){alert('No se pudo procesar.');}

function mostrarEditarItem(id,cantidad,unidad,precio){

    <div class="fld"><label>Unidad</label><input class="cat-inp" id="edUnidad_${id}" value="${unidad}"></div>
    <div class="fld"><label>Precio unitario</label><input class="cat-inp" id="edPrecio_${id}" type="number" step="0.01" value="${precio}"></div>

      <button class="mini-btn ok" onclick="guardarEdicionItem('${id}')">Guardar</button>
      <button class="mini-btn bad" onclick="document.getElementById('ed_${id}').innerHTML=''">Cancelar</button>

async function guardarEdicionItem(id){
  const cantidad=num(document.getElementById('edCant_'+id).value);
  const unidad=document.getElementById('edUnidad_'+id).value.trim();
  const precioUnitario=num(document.getElementById('edPrecio_'+id).value);
  try{const j=await apiPost({accion:'requisiciones_actualizar',id:SESSION.id,pin:SESSION.pin,idItem:id,accionEstatus:'editar',cantidad,unidad,precioUnitario});if(!j.ok){alert(j.error);return;}cargarHistorial();}catch(e){alert('No se pudo procesar.');}
}
function renderHistorialKpis(filas){
  let pendientes=0,aprobadas=0,rechazadas=0,gasto=0;
  const porDepto={};
  filas.forEach(r=>{
    const estatus=r[16], subtotal=num(r[11]), depto=r[5];
    if(estatus==='Pendiente')pendientes++;
    if(estatus==='Rechazado')rechazadas++;
    if(estatus && estatus!=='Pendiente' && estatus!=='Rechazado'){aprobadas++; gasto+=subtotal; porDepto[depto]=(porDepto[depto]||0)+subtotal;}
  });
  let topDepto='–',topVal=0;
  Object.keys(porDepto).forEach(d=>{if(porDepto[d]>topVal){topVal=porDepto[d];topDepto=d;}});
  document.getElementById('historialKpis').innerHTML=`<div class="kpis">
    <div class="kpi"><div class="k-lbl">Artículos</div><div class="k-val">${filas.length}</div></div>
    <div class="kpi"><div class="k-lbl">Pendientes</div><div class="k-val">${pendientes}</div></div>
    <div class="kpi"><div class="k-lbl">Aprobados/en curso</div><div class="k-val">${aprobadas}</div></div>
    <div class="kpi"><div class="k-lbl">Gasto ${verTodosDeptos()?'(top: '+topDepto+')':''}</div><div class="k-val" style="font-size:17px">$${money(gasto)}</div></div>
  </div>`;
}
function pdfHistorial(){
  const el=document.getElementById('historialBody');
  if(!el||!el.innerHTML.trim()||el.querySelector('.empty')){alert('Primero carga un rango de fechas.');return;}
  const clon=el.cloneNode(true);
  clon.querySelectorAll('.no-pdf').forEach(n=>n.remove());
  const w=window.open('','_blank','width=1000,height=650');
  if(!w){alert('Permite las ventanas emergentes para descargar el PDF.');return;}
  const desde=document.getElementById('hDesde').value||'', hasta=document.getElementById('hHasta').value||'';
  w.document.write('<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Requisiciones Casa Yuma</title>'+

// ————— Gasto por departamento (con gráfica) —————
async function cargarGasto(){
  const el=document.getElementById('gastoBody');
  const mes=document.getElementById('gMes').value || new Date().toISOString().slice(0,7);
  const desde=mes+'-01';
  const hasta=new Date(Number(mes.slice(0,4)), Number(mes.slice(5,7)), 0).toISOString().slice(0,10);
  el.innerHTML='<div class="loading"><div class="spinner"></div>Cargando…</div>';
  document.getElementById('gastoBody').dataset.loaded='1';
  try{
    const j=await apiGet({accion:'requisiciones_list',id:SESSION.id,pin:SESSION.pin,desde,hasta});
    if(!j.ok)throw new Error(j.error);
    const filas=(j.filas||[]).filter(r=>['Aprobado','Comprada','Recibida'].indexOf(r[16])!==-1);
    if(verTodosDeptos()) renderGastoFull(el,filas,mes);
    else renderGastoLider(el,filas,mes);
  }catch(e){el.innerHTML=`<div class="errbox">${e.message}</div>`;}
}
function renderGastoFull(el,filas,mes){
  const totales={}; DEPARTAMENTOS.forEach(d=>totales[d.nombre]=0);
  filas.forEach(r=>{ const d=r[5]; if(totales[d]==null)totales[d]=0; totales[d]+=num(r[11]); });
  const max=Math.max(1,...Object.values(totales));
  const total=Object.values(totales).reduce((a,b)=>a+b,0);
  const barH=24, gap=14, chartW=560;
  const filasSvg=DEPARTAMENTOS.map((d,i)=>{
    const val=totales[d.nombre]||0;
    const w=Math.max(val>0?6:0, (val/max)*chartW);
    const y=i*(barH+gap);
    return `<g>
      <text x="0" y="${y+barH/2-6}" font-size="11.5" fill="var(--text-secondary)" font-family="var(--mono)">${d.nombre}</text>
      <rect x="0" y="${y}" width="${chartW+40}" height="${barH}" fill="none"/>
      <rect x="0" y="${y}" rx="4" ry="4" width="${w}" height="${barH}" fill="${d.color}"/>
      <text x="${w+8}" y="${y+barH/2+4}" font-size="12" fill="var(--text-primary)" font-family="var(--mono)" font-variant-numeric="tabular-nums">$${money(val)}</text>
    </g>`;
  }).join('');
  const svgH=DEPARTAMENTOS.length*(barH+gap);
  el.innerHTML=`
    <div class="kpis"><div class="kpi"><div class="k-lbl">Gasto total del mes</div><div class="k-val">$${money(total)}</div></div></div>
    <div class="chart-wrap viz-root">
      <svg width="100%" viewBox="0 0 ${chartW+140} ${svgH+30}" style="max-width:760px" role="img" aria-label="Gasto por departamento, ${mes}">
        <g transform="translate(120,10)">${filasSvg}</g>
      </svg>
    </div>
    <div style="overflow-x:auto"><table class="aud"><thead><tr><th>Departamento</th><th>Gasto del mes</th></tr></thead><tbody>
      ${DEPARTAMENTOS.map(d=>`<tr><td><span class="dept-dot" style="background:${d.color}"></span>${d.nombre}</td><td class="num">$${money(totales[d.nombre]||0)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="note">Incluye artículos Aprobados, Comprados y Recibidos (no cuenta pendientes ni rechazados).</div>`;
}
function renderGastoLider(el,filas,mes){
  const total=filas.reduce((s,r)=>s+num(r[11]),0);
  const porEstatus={};
  filas.forEach(r=>{ porEstatus[r[16]]=(porEstatus[r[16]]||0)+num(r[11]); });
  el.innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="k-lbl">Gasto de ${SESSION.departamento} este mes</div><div class="k-val">$${money(total)}</div></div>
      ${Object.keys(porEstatus).map(k=>`<div class="kpi"><div class="k-lbl">${k}</div><div class="k-val" style="font-size:17px">$${money(porEstatus[k])}</div></div>`).join('')}
    </div>
    <div class="note">Incluye artículos Aprobados, Comprados y Recibidos de tu departamento (no cuenta pendientes ni rechazados).</div>`;
}

// ————— Catálogo (administración — Superfull / Líder Compras) —————
async function cargarCatalogoAdmin(){
  const el=document.getElementById('catalogoBody');
  el.innerHTML='<div class="loading"><div class="spinner"></div>Cargando…</div>';
  try{
    const j=await apiGet({accion:'catalogo_list_todo',id:SESSION.id,pin:SESSION.pin});
    if(!j.ok)throw new Error(j.error);
    const filas=j.filas||[];
    el.innerHTML=`
      <div class="section-eyebrow">Agregar artículo al catálogo</div>
      <div class="cap-form" style="margin-bottom:26px">
        <div class="cap-grid">
          <div class="fld"><label>Nombre del artículo</label><input id="caNombre" placeholder="Ej. Servilletas de tela"></div>
          <div class="fld"><label>Unidad</label><input id="caUnidad" placeholder="pza, litro…"></div>
          <div class="fld"><label>Precio unitario</label><input id="caPrecio" type="number" step="0.01" placeholder="0.00"></div>
          <div class="fld"><label>Departamento (opcional)</label><select id="caDepto"><option value="">Cualquier departamento</option>${DEPARTAMENTOS.map(d=>`<option>${d.nombre}</option>`).join('')}</select></div>
        </div>
        <button class="cap-btn" onclick="agregarArticuloCatalogo()">Agregar al catálogo</button>
        <div id="catalogoMsg"></div>
      </div>
      <div class="section-eyebrow">Catálogo completo (${filas.length})</div>
      <div style="overflow-x:auto"><table class="aud"><thead><tr>
        <th>ID</th><th>Artículo</th><th>Unidad</th><th>Precio</th><th>Departamento</th><th>Activo</th><th>Acción</th>
      </tr></thead><tbody>${filas.map(f=>renderFilaCatalogoAdmin(f)).join('')||'<tr><td colspan="7" class="empty">Aún no hay artículos en el catálogo.</td></tr>'}</tbody></table></div>`;
  }catch(e){el.innerHTML=`<div class="errbox">${e.message}</div>`;}
}
function renderFilaCatalogoAdmin(f){
  const [id,articulo,unidad,precio,departamento,activo]=f;
  const deptoOpts='<option value="">Cualquier departamento</option>'+DEPARTAMENTOS.map(d=>`<option ${d.nombre===departamento?'selected':''}>${d.nombre}</option>`).join('');
  return `<tr>
    <td>${id}</td>
    <td><input class="cat-inp" id="cArt_${id}" value="${escapeHtml(articulo)}"></td>
    <td><input class="cat-inp" id="cUni_${id}" value="${escapeHtml(unidad||'')}"></td>
    <td><input class="cat-inp" id="cPre_${id}" type="number" step="0.01" value="${precio||0}"></td>
    <td><select class="cat-inp" id="cDep_${id}">${deptoOpts}</select></td>
    <td><select class="cat-inp" id="cAct_${id}"><option value="SI" ${activo==='SI'?'selected':''}>SI</option><option value="NO" ${activo==='NO'?'selected':''}>NO</option></select></td>
    <td><button class="mini-btn info" onclick="guardarFilaCatalogo('${id}')">Guardar</button></td>
  </tr>`;
}
async function agregarArticuloCatalogo(){
  const articulo=document.getElementById('caNombre').value.trim();
  const msg=document.getElementById('catalogoMsg');
  if(!articulo){msg.innerHTML='<div class="errbox">Escribe el nombre del artículo.</div>';return;}
  const body={accion:'catalogo_crear',id:SESSION.id,pin:SESSION.pin,
    articulo, unidad:document.getElementById('caUnidad').value.trim(),
    precioUnitario:num(document.getElementById('caPrecio').value)||0,
    departamento:document.getElementById('caDepto').value};
  msg.innerHTML='<div class="okmsg">Guardando…</div>';
  try{const j=await apiPost(body);if(!j.ok){msg.innerHTML=`<div class="errbox">${j.error}</div>`;return;}cargarCatalogoAdmin();}catch(e){msg.innerHTML='<div class="errbox">No se pudo guardar.</div>';}
}
async function guardarFilaCatalogo(id){
  const body={accion:'catalogo_actualizar',id:SESSION.id,pin:SESSION.pin,
    catalogoId:id,
    articulo:document.getElementById('cArt_'+id).value.trim(),
    unidad:document.getElementById('cUni_'+id).value.trim(),
    precioUnitario:num(document.getElementById('cPre_'+id).value)||0,
    departamento:document.getElementById('cDep_'+id).value,
    activo:document.getElementById('cAct_'+id).value};
  try{const j=await apiPost(body);if(!j.ok){alert(j.error);return;}await cargarCatalogo();cargarCatalogoAdmin();}catch(e){alert('No se pudo guardar.');}
}
</script>
